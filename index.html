              {history.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد جرد سابق", "No previous counts")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============ شاشة الإشعارات (نقص الأصناف عند الفروع) ============ */
/* ============ شاشة تتبّع تواريخ الصلاحية: كل الدفعات مرتّبة، مع تلوين القريب من الانتهاء أو المنتهي ============ */
/* ============ كشوفات الجرد: تجميع سجلات الجرد المتفرّقة (صنف صنف) في "جلسات جرد" واضحة — التاريخ، المكان، ومين اللي جرد ============ */
/* ============ سجل الحركات: عرض كل عمليات الوارد/الصادر، مع إمكانية "تراجع آمن" يرجّع الرصيد تلقائيًا لو حصل خطأ (كمية غلط، نقل مش متوفر...إلخ) ============ */
function MovesLogTab({ currentUser, meta, lang, t }) {
  const [moves, setMoves] = useState(null);
  const [typeFilter, setTypeFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [busyId, setBusyId] = useState(null);
  const [msg, setMsg] = useState("");

  useEffect(() => {
    const unsub = MOVES_COL.orderBy("createdAt", "desc").limit(500).onSnapshot((snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), () => setMoves([]));
    return unsub;
  }, []);

  const filtered = (moves || []).filter((m) => {
    if (typeFilter !== "all" && m.type !== typeFilter) return false;
    const term = search.trim().toLowerCase();
    if (!term) return true;
    return [m.itemName, m.branch, m.note, m.enteredBy].filter(Boolean).join(" ").toLowerCase().includes(term);
  });

  async function reverseMove(m) {
    if (m.reversed) return;
    if (!confirm(t(`هل تريد التراجع عن هذه الحركة؟ سيتم إرجاع رصيد "${m.itemName}" تلقائيًا لما كان عليه قبلها.`, `Reverse this movement? "${m.itemName}"'s stock will be automatically restored to what it was before.`))) return;
    setBusyId(m.id); setMsg("");
    try {
      const isRealBranch = m.branch && (meta.branches || []).includes(m.branch); // الحركة اتصرفت لفرع حقيقي (مش "تالف/هدر" أو "إنتاج مطبخ" وغيرها)
      const bsRef = isRealBranch ? BRANCH_STOCK_COL.doc(branchStockDocId(m.branch, m.itemId)) : null;
      let itemWasRecreated = false;
      await db.runTransaction(async (tx) => {
        const itemRef = ITEMS_COL.doc(m.itemId);
        const itemSnap = await tx.get(itemRef); // كل القراءات لازم تحصل قبل أي كتابة
        const bsSnap = bsRef ? await tx.get(bsRef) : null;
        const delta = m.type === "out" ? Number(m.qty) : -Number(m.qty); // التراجع عن صرف بيرجّع الكمية، والتراجع عن وارد بيسحبها
        if (itemSnap.exists) {
          const curQty = Number(itemSnap.data().qty) || 0;
          tx.update(itemRef, { qty: curQty + delta });
        } else {
          // الصنف كان محذوف خالص من شاشة الأصناف — نعيد إنشاءه تلقائيًا ببيانات أساسية من نفس الحركة (اسمه ووحدته)
          // عشان التراجع يشتغل ورصيده يرجع صح، بدل ما تحتاج تسجّله يدوي من الأول
          itemWasRecreated = true;
          tx.set(itemRef, {
            nameAr: m.itemName || "", nameEn: m.itemNameEn || "", unit: m.unit || "قطعة",
            sku: uid().toUpperCase(), price: 0, minStock: 0, category: "", institution: "",
            qty: delta, institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
        }
        if (bsRef && bsSnap) {
          const curBranchQty = bsSnap.exists ? (Number(bsSnap.data().qty) || 0) : 0;
          tx.set(bsRef, { qty: Math.max(0, curBranchQty - Number(m.qty)) }, { merge: true });
        }
      });
      await MOVES_COL.doc(m.id).update({ reversed: true, reversedBy: currentUser.name, reversedAt: firebase.firestore.FieldValue.serverTimestamp() });
      setMsg("✅ " + (itemWasRecreated
        ? t(`تم التراجع عن الحركة. تنبيه: الصنف "${m.itemName}" كان محذوف، فتم إعادة إنشائه تلقائيًا برصيده الصحيح — روح لشاشة "الأصناف" وكمّل بياناته (السعر، الفئة، الكيان).`, `Movement reversed. Note: "${m.itemName}" was deleted, so it was automatically recreated with the correct stock — go to "Items" and complete its details (price, category, entity).`)
        : t("تم التراجع عن الحركة وإرجاع الرصيد بنجاح", "Movement reversed and stock restored successfully")));
    } catch (e) { setMsg("Error: " + e.message); }
    setBusyId(null);
  }

  if (moves === null) return <div style={{ color: C.muted, padding: 20 }}>...</div>;

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>📜 {t("سجل حركات المستودع", "Warehouse Movement Log")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("لو حصل خطأ (كمية غلط، تحويل مش متوفر في المخزون...إلخ)، تقدر \"تتراجع\" عن أي حركة والنظام هيرجّع الرصيد تلقائيًا لما كان عليه قبلها.", "If a mistake happened (wrong quantity, transfer not available in stock...etc), you can \"reverse\" any movement and the system automatically restores the stock to what it was before.")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
          <div>
            <label style={smallLabel}>{t("النوع", "Type")}</label>
            <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)} style={inputStyle2}>
              <option value="all">{t("الكل", "All")}</option>
              <option value="in">{t("وارد", "In")}</option>
              <option value="out">{t("صادر", "Out")}</option>
            </select>
          </div>
          <div style={{ flex: "1 1 220px" }}>
            <label style={smallLabel}>{t("بحث (الصنف، الفرع، ملاحظة، اسم المستخدم)", "Search (item, branch, note, user)")}</label>
            <input value={search} onChange={(e) => setSearch(e.target.value)} style={inputStyle2} />
          </div>
        </div>
        {msg && <div style={{ marginBottom: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
        <table>
          <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("النوع", "Type")}</th><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكمية", "Qty")}</th><th style={th}>{t("الفرع/الجهة", "Branch/Destination")}</th><th style={th}>{t("ملاحظة", "Note")}</th><th style={th}>{t("بواسطة", "By")}</th><th style={th}></th></tr></thead>
          <tbody>
            {filtered.map((m) => (
              <tr key={m.id} style={{ background: m.reversed ? "#f9fafb" : undefined, opacity: m.reversed ? 0.6 : 1 }}>
                <td style={td}>{m.date}</td>
                <td style={{ ...td, fontWeight: 700, color: m.type === "in" ? C.success : C.danger }}>{m.type === "in" ? "📥 " + t("وارد", "In") : "📤 " + t("صادر", "Out")}</td>
                <td style={td}>{lang === "ar" ? m.itemName : (m.itemNameEn || m.itemName)}</td>
                <td style={td}>{m.type === "in" ? "+" : "-"}{fmt(m.qty)} {m.unit}</td>
                <td style={td}>{m.branch || m.supplierName || "—"}</td>
                <td style={td}>{m.note || "—"}</td>
                <td style={td}>{m.enteredBy}</td>
                <td style={td}>
                  {m.reversed ? (
                    <span style={{ fontSize: 11.5, color: C.muted, fontWeight: 700 }}>↩️ {t("متراجَع عنها", "Reversed")}</span>
                  ) : (
                    <span onClick={() => reverseMove(m)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700 }}>{busyId === m.id ? "..." : "↩️ " + t("تراجع", "Reverse")}</span>
                  )}
                </td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan={8} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد حركات", "No movements")}</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function CountSessionsTab({ lang, t, institutionName }) {
  const [allCounts, setAllCounts] = useState(null);
  const [openSession, setOpenSession] = useState(null);
  const [locationFilter, setLocationFilter] = useState("all");

  const MAIN_WH_LABEL = t("المستودع الرئيسي", "Main Warehouse");

  useEffect(() => {
    const unsub = COUNTS_COL.orderBy("createdAt", "desc").limit(1000).onSnapshot((snap) => setAllCounts(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), () => setAllCounts([]));
    return unsub;
  }, []);

  // تجميع سجلات الجرد (صنف صنف) في "جلسات": نفس التاريخ + نفس المكان + نفس مين جرد = جلسة واحدة
  const sessions = useMemo(() => {
    if (!allCounts) return [];
    const map = {};
    allCounts.forEach((c) => {
      const key = `${c.date}__${c.branch}__${c.countedBy}`;
      if (!map[key]) map[key] = { key, date: c.date, location: c.branch, countedBy: c.countedBy, items: [], shortageCount: 0, surplusCount: 0 };
      map[key].items.push(c);
      if (c.diff < -0.009) map[key].shortageCount++;
      if (c.diff > 0.009) map[key].surplusCount++;
    });
    return Object.values(map).sort((a, b) => b.date.localeCompare(a.date));
    // eslint-disable-next-line
  }, [allCounts]);

  const locations = [MAIN_WH_LABEL, ...new Set(sessions.filter((s) => s.location !== MAIN_WH_LABEL).map((s) => s.location))];
  const filteredSessions = locationFilter === "all" ? sessions : sessions.filter((s) => s.location === locationFilter);

  function doPrint() { window.print(); }

  if (allCounts === null) return <div style={{ color: C.muted, padding: 20 }}>...</div>;

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={cardTitle}>📑 {t("كشوفات الجرد", "Count Statements")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("كل جلسة جرد (تاريخ معيّن + مكان معيّن + موظف معيّن) مجمّعة هنا بضغطة واحدة تفتح كل تفاصيلها.", "Every count session (a specific date + location + employee) is grouped here — one click opens all its details.")}</div>
        <div>
          <label style={smallLabel}>{t("فلترة حسب المكان", "Filter by location")}</label>
          <select value={locationFilter} onChange={(e) => setLocationFilter(e.target.value)} style={{ ...inputStyle2, maxWidth: 240 }}>
            <option value="all">{t("كل الأماكن", "All locations")}</option>
            {locations.map((l) => <option key={l} value={l}>{l}</option>)}
          </select>
        </div>
      </div>

      <div className="print-area">
        <div className="print-only-header"><h2>{institutionName}</h2><div>{t("كشوفات الجرد", "Count Statements")}</div></div>
        <div style={cardStyle}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
            <div style={cardTitle}>{t("جلسات الجرد", "Count sessions")} ({filteredSessions.length})</div>
            <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
          </div>
          <table>
            <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>📍 {t("المكان", "Location")}</th><th style={th}>👤 {t("الموظف اللي جرد", "Counted by")}</th><th style={th}>{t("عدد الأصناف", "Items counted")}</th><th style={th}>{t("نواقص", "Shortages")}</th><th style={th}>{t("زيادات", "Surpluses")}</th><th style={th}></th></tr></thead>
            <tbody>
              {filteredSessions.map((s) => (
                <React.Fragment key={s.key}>
                  <tr>
                    <td style={{ ...td, fontWeight: 700 }}>{s.date}</td>
                    <td style={td}>{s.location}</td>
                    <td style={{ ...td, fontWeight: 700 }}>{s.countedBy}</td>
                    <td style={td}>{s.items.length}</td>
                    <td style={{ ...td, color: s.shortageCount > 0 ? C.danger : C.muted, fontWeight: s.shortageCount > 0 ? 700 : 400 }}>{s.shortageCount}</td>
                    <td style={{ ...td, color: s.surplusCount > 0 ? C.success : C.muted, fontWeight: s.surplusCount > 0 ? 700 : 400 }}>{s.surplusCount}</td>
                    <td style={td} className="no-print"><span onClick={() => setOpenSession(openSession === s.key ? null : s.key)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700 }}>{openSession === s.key ? t("إخفاء", "Hide") : t("عرض التفاصيل", "View details")}</span></td>
                  </tr>
                  {openSession === s.key && (
                    <tr>
                      <td colSpan={7} style={{ background: C.blueSoft, padding: 12 }}>
                        <table>
                          <thead><tr><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("المتوقع", "Expected")}</th><th style={th}>{t("الفعلي المجرود", "Counted")}</th><th style={th}>{t("الفرق", "Diff")}</th></tr></thead>
                          <tbody>
                            {s.items.map((it) => (
                              <tr key={it.id}>
                                <td style={td}>{it.itemName}</td><td style={td}>{fmt(it.systemQty)}</td><td style={td}>{fmt(it.countedQty)}</td>
                                <td style={{ ...td, fontWeight: 700, color: it.diff < 0 ? C.danger : it.diff > 0 ? C.success : C.muted }}>{it.diff > 0 ? "+" : ""}{fmt(it.diff)}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
              {filteredSessions.length === 0 && <tr><td colSpan={7} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد جلسات جرد مسجّلة", "No count sessions recorded")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function ExpiryTab({ lang, t }) {
  const [batches, setBatches] = useState(null);
  const [markingId, setMarkingId] = useState(null);

  useEffect(() => {
    const unsub = BATCHES_COL.orderBy("expiryDate").onSnapshot((snap) => setBatches(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);

  function daysUntil(dateStr) {
    return Math.ceil((new Date(dateStr) - new Date(todayStr())) / 86400000);
  }
  function statusOf(days) {
    if (days < 0) return "expired";
    if (days <= 7) return "urgent";
    if (days <= 30) return "soon";
    return "ok";
  }
  const STATUS_STYLE = {
    expired: { bg: "#fef2f2", color: C.danger, label: t("منتهي الصلاحية", "Expired") },
    urgent: { bg: "#fff7ed", color: C.warn, label: t("قريب جدًا (أسبوع أو أقل)", "Very soon (≤7 days)") },
    soon: { bg: "#fefce8", color: "#a16207", label: t("خلال شهر", "Within a month") },
    ok: { bg: "#f0fdf4", color: C.success, label: t("سليم", "OK") },
  };

  async function markConsumed(id) {
    setMarkingId(id);
    await BATCHES_COL.doc(id).update({ remainingQty: 0 });
    setMarkingId(null);
  }

  if (batches === null) return <div style={{ color: C.muted, padding: 20 }}>...</div>;
  const activeBatches = batches.filter((b) => (b.remainingQty ?? b.qty) > 0);
  const sorted = [...activeBatches].sort((a, b) => daysUntil(a.expiryDate) - daysUntil(b.expiryDate));

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>📅 {t("تتبّع تواريخ الصلاحية", "Expiry Date Tracking")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("كل دفعة بضاعة سجّلت لها تاريخ صلاحية وقت الوارد، هتظهر هنا مرتّبة من الأقرب انتهاءً.", "Every batch you gave an expiry date to when receiving stock appears here, sorted by nearest expiry.")}</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
          {Object.entries(STATUS_STYLE).map(([key, s]) => {
            const count = sorted.filter((b) => statusOf(daysUntil(b.expiryDate)) === key).length;
            if (count === 0) return null;
            return <div key={key} style={{ background: s.bg, borderRadius: 10, padding: "8px 14px", fontSize: 13, fontWeight: 700, color: s.color }}>{s.label}: {count}</div>;
          })}
        </div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكمية المتبقية", "Remaining qty")}</th><th style={th}>{t("تاريخ الاستلام", "Received")}</th><th style={th}>{t("تاريخ الصلاحية", "Expiry date")}</th><th style={th}>{t("الحالة", "Status")}</th><th style={th}></th></tr></thead>
            <tbody>
              {sorted.map((b) => {
                const days = daysUntil(b.expiryDate);
                const status = statusOf(days);
                const s = STATUS_STYLE[status];
                return (
                  <tr key={b.id} style={{ background: s.bg }}>
                    <td style={{ ...td, fontWeight: 700 }}>{lang === "ar" ? (b.itemName || b.itemNameEn) : (b.itemNameEn || b.itemName)}</td>
                    <td style={td}>{fmt(b.remainingQty ?? b.qty)} {b.unit}</td>
                    <td style={td}>{b.receivedDate}</td>
                    <td style={td}>{b.expiryDate}</td>
                    <td style={{ ...td, color: s.color, fontWeight: 700 }}>{s.label} {status !== "expired" && status !== "ok" ? `(${days} ${t("يوم", "days")})` : ""}</td>
                    <td style={td}><span onClick={() => markConsumed(b.id)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700 }}>{markingId === b.id ? "..." : t("تعليم كمستهلكة", "Mark consumed")}</span></td>
                  </tr>
                );
              })}
              {sorted.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد دفعات مسجّل لها تاريخ صلاحية", "No batches with an expiry date recorded")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============ تقرير المخزون: القيمة الإجمالية + استهلاك كل فرع ============ */
function ReportsTab({ lang, t, institutionName }) {
  const [items, setItems] = useState([]);
  const [moves, setMoves] = useState([]);
  const [fromDate, setFromDate] = useState(new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0, 10));
  const [toDate, setToDate] = useState(todayStr());
  const [mode, setMode] = useState("stock"); // stock | branch | purchases | payments | vat
  const [branchFilter, setBranchFilter] = useState("all");
  const [meta, setMeta] = useState({ branches: [] });

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = MOVES_COL.orderBy("createdAt", "desc").limit(3000).onSnapshot((snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = META_DOC.onSnapshot((doc) => setMeta(doc.exists ? doc.data() : { branches: [] }));
    return unsub;
  }, []);

  const totalValue = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  const lowStockItems = items.filter((it) => it.minStock > 0 && (it.qty || 0) <= it.minStock);

  const rangeMoves = moves.filter((m) => m.date >= fromDate && m.date <= toDate);
  const rangeOutMoves = rangeMoves.filter((m) => m.type === "out" && (branchFilter === "all" || m.branch === branchFilter));
  const rangeInMoves = rangeMoves.filter((m) => m.type === "in");

  const byBranch = useMemo(() => {
    const map = {};
    rangeMoves.filter((m) => m.type === "out").forEach((m) => {
      const key = m.branch || "—";
      if (!map[key]) map[key] = { branch: key, qtyTotal: 0, valueTotal: 0, items: {} };
      map[key].qtyTotal += Number(m.qty) || 0;
      map[key].valueTotal += (Number(m.qty) || 0) * (Number(m.price) || 0);
      const itKey = m.itemName;
      map[key].items[itKey] = (map[key].items[itKey] || 0) + (Number(m.qty) || 0);
    });
    return Object.values(map).sort((a, b) => b.valueTotal - a.valueTotal);
    // eslint-disable-next-line
  }, [rangeMoves]);

  /* ============ تحليل ذكي إحصائي (بدون أي API خارجي) — أنماط استهلاك، فروع شاذة، أصناف قريبة من النفاد ============ */
  const smartInsights = useMemo(() => {
    const list = [];
    if (byBranch.length > 1) {
      const top = byBranch[0];
      const totalAll = byBranch.reduce((s, b) => s + b.valueTotal, 0);
      const pct = totalAll > 0 ? (top.valueTotal / totalAll) * 100 : 0;
      if (pct >= 40) list.push({ kind: "info", text: t(`فرع "${top.branch}" بياخد ${pct.toFixed(0)}% من إجمالي قيمة المسحوبات في هذه الفترة — تركّز عالي يستاهل مراجعة.`, `Branch "${top.branch}" accounts for ${pct.toFixed(0)}% of total withdrawn value this period — worth reviewing.`) });
    }
    // أصناف معدل استهلاكها هيخلّص المخزون قريب (بناءً على متوسط الاستهلاك اليومي في الفترة)
    const daysInRange = Math.max(1, (new Date(toDate) - new Date(fromDate)) / 86400000);
    const consumedByItem = {};
    rangeMoves.filter((m) => m.type === "out").forEach((m) => { consumedByItem[m.itemId] = (consumedByItem[m.itemId] || 0) + (Number(m.qty) || 0); });
    items.forEach((it) => {
      const consumed = consumedByItem[it.id] || 0;
      if (consumed <= 0) return;
      const dailyRate = consumed / daysInRange;
      if (dailyRate <= 0) return;
      const daysLeft = (it.qty || 0) / dailyRate;
      if (daysLeft <= 7 && (it.qty || 0) > 0) {
        list.push({ kind: "warning", text: t(`صنف "${it.nameAr}" هيخلص تقريبًا خلال ${Math.round(daysLeft)} يوم لو استمر معدل الاستهلاك الحالي.`, `"${it.nameEn || it.nameAr}" will likely run out in about ${Math.round(daysLeft)} days at the current consumption rate.`) });
      }
    });
    if (lowStockItems.length > 0) {
      list.push({ kind: "warning", text: t(`${lowStockItems.length} صنف تحت الحد الأدنى المسموح به دلوقتي.`, `${lowStockItems.length} item(s) are currently below minimum stock.`) });
    }
    if (list.length === 0) list.push({ kind: "success", text: t("لا توجد ملاحظات شاذة — المخزون والاستهلاك مستقران في هذه الفترة.", "No anomalies detected — stock and consumption look stable this period.") });
    return list;
    // eslint-disable-next-line
  }, [byBranch, items, rangeMoves, fromDate, toDate]);

  // تقرير المشتريات والمدفوعات والضريبة
  const purchasesTotal = rangeInMoves.reduce((s, m) => s + (Number(m.purchaseValue) || 0), 0);
  const vatTotal = rangeInMoves.reduce((s, m) => s + (Number(m.vatAmount) || 0), 0);
  const paidTotal = rangeInMoves.reduce((s, m) => s + (Number(m.paidAmount) || 0), 0);
  const unpaidTotal = (purchasesTotal + vatTotal) - paidTotal;

  async function markPaid(moveId, amount) {
    await MOVES_COL.doc(moveId).update({ paidAmount: amount, paymentStatus: "paid" });
  }

  function doPrint() { window.print(); }

  const KIND_STYLE = {
    warning: { bg: "#fef2f2", border: "#fecaca", icon: "⚠️", color: "#991b1b" },
    success: { bg: "#f0fdf4", border: "#bbf7d0", icon: "✅", color: "#166534" },
    info: { bg: "#eff6ff", border: "#bfdbfe", icon: "ℹ️", color: "#1e40af" },
  };

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
          <button onClick={() => setMode("stock")} style={mode === "stock" ? smallBtn : ghostBtn}>{t("المخزون والقيمة", "Stock & value")}</button>
          <button onClick={() => setMode("branch")} style={mode === "branch" ? smallBtn : ghostBtn}>{t("استهلاك الفروع", "Branch consumption")}</button>
          <button onClick={() => setMode("purchases")} style={mode === "purchases" ? smallBtn : ghostBtn}>{t("المشتريات", "Purchases")}</button>
          <button onClick={() => setMode("payments")} style={mode === "payments" ? smallBtn : ghostBtn}>{t("المدفوعات", "Payments")}</button>
          <button onClick={() => setMode("vat")} style={mode === "vat" ? smallBtn : ghostBtn}>{t("الضريبة 15%", "15% VAT")}</button>
        </div>
        {mode !== "stock" && (
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
            <div><label style={smallLabel}>{t("من تاريخ", "From")}</label><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} style={inputStyle2} /></div>
            <div><label style={smallLabel}>{t("إلى تاريخ", "To")}</label><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} style={inputStyle2} /></div>
            {mode === "branch" && (
              <div>
                <label style={smallLabel}>{t("الفرع", "Branch")}</label>
                <select value={branchFilter} onChange={(e) => setBranchFilter(e.target.value)} style={inputStyle2}>
                  <option value="all">{t("كل الفروع", "All branches")}</option>
                  <GroupedBranchOptions meta={meta} />
                </select>
              </div>
            )}
          </div>
        )}
      </div>

      {mode === "branch" && (
        <div style={{ background: "linear-gradient(135deg,#faf5ff,#f5f3ff)", border: "1px solid #ddd6fe", borderRadius: 14, padding: 20, marginBottom: 18 }} className="no-print">
          <div style={{ fontWeight: 800, fontSize: 15, color: "#5b21b6", marginBottom: 10 }}>🤖 {t("تحليل ذكي تلقائي", "Automatic smart analysis")}</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {smartInsights.map((it, i) => {
              const s = KIND_STYLE[it.kind];
              return <div key={i} style={{ background: s.bg, border: "1px solid " + s.border, borderRadius: 10, padding: "10px 13px", fontSize: 13, color: s.color, display: "flex", gap: 8 }}><span>{s.icon}</span><span>{it.text}</span></div>;
            })}
          </div>
        </div>
      )}

      <div className="print-area">
        <div className="print-only-header"><h2>{institutionName}</h2><div>{t("تقرير", "Report")}</div></div>

        {mode === "stock" && (
          <>
            <div style={cardStyle}>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <div style={{ flex: "1 1 220px", background: "linear-gradient(135deg,#0f2557,#1d4ed8)", borderRadius: 10, padding: "14px 16px" }}>
                  <div style={{ fontSize: 12, color: "#dbe6ff" }}>{t("قيمة المخزون الإجمالية", "Total stock value")}</div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: "#fff" }}>{fmt(totalValue)} {t("ر.س", "SAR")}</div>
                </div>
                <div style={{ flex: "1 1 220px", background: C.blueSoft, borderRadius: 10, padding: "14px 16px" }}>
                  <div style={{ fontSize: 12, color: C.muted }}>{t("عدد الأصناف", "Number of items")}</div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: C.navy }}>{items.length}</div>
                </div>
                <div style={{ flex: "1 1 220px", background: lowStockItems.length > 0 ? "#fef2f2" : C.blueSoft, border: lowStockItems.length > 0 ? "1px solid #fecaca" : "none", borderRadius: 10, padding: "14px 16px" }}>
                  <div style={{ fontSize: 12, color: lowStockItems.length > 0 ? C.danger : C.muted }}>{t("أصناف تحت الحد الأدنى", "Items below minimum")}</div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: lowStockItems.length > 0 ? C.danger : C.navy }}>{lowStockItems.length}</div>
                </div>
              </div>
            </div>
            <div style={cardStyle}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
                <div style={cardTitle}>📋 {t("تفاصيل المخزون", "Stock details")}</div>
                <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
              </div>
              <table>
                <thead><tr><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكود", "Code")}</th><th style={th}>{t("الرصيد", "Qty")}</th><th style={th}>{t("السعر", "Price")}</th><th style={th}>{t("القيمة", "Value")}</th></tr></thead>
                <tbody>
                  {items.map((it) => (
                    <tr key={it.id} style={{ background: it.minStock > 0 && it.qty <= it.minStock ? "#fef2f2" : undefined }}>
                      <td style={td}>{lang === "ar" ? (it.nameAr || it.nameEn) : (it.nameEn || it.nameAr)}</td>
                      <td style={td}>{it.sku}</td>
                      <td style={{ ...td, fontWeight: 700 }}>{fmt(it.qty)} {it.unit}</td>
                      <td style={td}>{fmt(it.price)}</td>
                      <td style={{ ...td, fontWeight: 700 }}>{fmt((it.qty || 0) * (it.price || 0))}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </>
        )}

        {mode === "branch" && (
          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>🏬 {t("استهلاك كل فرع", "Consumption per branch")}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
            </div>
            <table>
              <thead><tr><th style={th}>{t("الفرع", "Branch")}</th><th style={th}>{t("إجمالي الكمية المسحوبة", "Total qty withdrawn")}</th><th style={th}>{t("القيمة الإجمالية", "Total value")}</th></tr></thead>
              <tbody>
                {byBranch.filter((b) => branchFilter === "all" || b.branch === branchFilter).map((b) => (
                  <tr key={b.branch}>
                    <td style={{ ...td, fontWeight: 700 }}>{b.branch}</td>
                    <td style={td}>{fmt(b.qtyTotal)}</td>
                    <td style={{ ...td, fontWeight: 700 }}>{fmt(b.valueTotal)} {t("ر.س", "SAR")}</td>
                  </tr>
                ))}
                {byBranch.length === 0 && <tr><td colSpan={3} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد حركات صرف في هذه الفترة", "No issue movements in this period")}</td></tr>}
              </tbody>
            </table>
          </div>
        )}

        {mode === "purchases" && (
          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>🧾 {t("تقرير المشتريات", "Purchases report")}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
            </div>
            <div style={{ marginBottom: 14, fontSize: 14, fontWeight: 700, color: C.navy }}>{t("إجمالي المشتريات (قبل الضريبة):", "Total purchases (before VAT):")} {fmt(purchasesTotal)} {t("ر.س", "SAR")}</div>
            <table>
              <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكمية", "Qty")}</th><th style={th}>{t("تكلفة الوحدة", "Unit cost")}</th><th style={th}>{t("القيمة", "Value")}</th><th style={th}>{t("المورد", "Supplier")}</th><th style={th}>{t("الفاتورة", "Invoice")}</th></tr></thead>
              <tbody>
                {rangeInMoves.map((m) => (
                  <tr key={m.id}>
                    <td style={td}>{m.date}</td><td style={td}>{m.itemName}</td><td style={td}>{fmt(m.qty)}</td>
                    <td style={td}>{fmt(m.unitCost)}</td><td style={{ ...td, fontWeight: 700 }}>{fmt(m.purchaseValue)}</td>
                    <td style={td}>{m.supplierName || "—"}</td><td style={td}>{m.invoiceNo || "—"}</td>
                  </tr>
                ))}
                {rangeInMoves.length === 0 && <tr><td colSpan={7} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد مشتريات في هذه الفترة", "No purchases in this period")}</td></tr>}
              </tbody>
            </table>
          </div>

        {mode === "payments" && (
          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>💳 {t("تقرير المدفوعات للموردين", "Supplier payments report")}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("إجمالي المدفوع", "Total paid")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.success }}>{fmt(paidTotal)}</div>
              </div>
              <div style={{ flex: "1 1 200px", background: unpaidTotal > 0 ? "#fef2f2" : C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("متبقي غير مدفوع", "Remaining unpaid")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: unpaidTotal > 0 ? C.danger : C.success }}>{fmt(unpaidTotal)}</div>
              </div>
            </div>
            <table className="no-print">
              <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("المورد", "Supplier")}</th><th style={th}>{t("الفاتورة", "Invoice")}</th><th style={th}>{t("الإجمالي مع الضريبة", "Total incl. VAT")}</th><th style={th}>{t("الحالة", "Status")}</th><th style={th}></th></tr></thead>
              <tbody>

                })}
                {rangeInMoves.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد فواتير في هذه الفترة", "No invoices in this period")}</td></tr>}

              <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("المورد", "Supplier")}</th><th style={th}>{t("الرقم الضريبي", "Tax number")}</th><th style={th}>{t("القيمة قبل الضريبة", "Value before VAT")}</th><th style={th}>{t("الضريبة 15%", "15% VAT")}</th><th style={th}>{t("الإجمالي", "Total")}</th></tr></thead>

                {rangeInMoves.map((m) => (

/* ============ زرار مجموعة تبويبات بقائمة منسدلة — بتفتح مكانها بيتبع اتجاه اللغة تلقائيًا (insetInlineStart مش left/right ثابتين) ============ */
function NavGroupDropdown({ group, lang, effectiveTab, setTab, openGroupId, setOpenGroupId }) {
  const isOpen = openGroupId === group.id;
  const hasActiveChild = group.children.some((c) => c.id === effectiveTab);
  return (
    <div style={{ position: "relative" }}>
      <button onClick={() => setOpenGroupId(isOpen ? null : group.id)} style={{
        padding: "8px 14px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700,
        background: hasActiveChild || isOpen ? "#fff" : "rgba(255,255,255,0.12)", color: hasActiveChild || isOpen ? C.navy : "#fff",
        display: "flex", alignItems: "center", gap: 6,
      }}>
        {lang === "ar" ? group.labelAr : group.labelEn}
        <span style={{ fontSize: 10 }}>{isOpen ? "▲" : "▼"}</span>
      </button>
      {isOpen && (
        <>
          <div onClick={() => setOpenGroupId(null)} style={{ position: "fixed", inset: 0, zIndex: 40 }} />
          <div style={{
            position: "absolute", top: "calc(100% + 6px)", insetInlineStart: 0, zIndex: 50,
            background: "#fff", borderRadius: 10, boxShadow: "0 14px 32px rgba(15,37,87,0.22)", minWidth: 200, overflow: "hidden",
          }}>
            {group.children.map((tb) => (
              <div key={tb.id} onClick={() => { setTab(tb.id); setOpenGroupId(null); }} style={{
                padding: "10px 16px", cursor: "pointer", fontSize: 13, fontWeight: effectiveTab === tb.id ? 700 : 500,
                color: effectiveTab === tb.id ? C.blue : C.text, background: effectiveTab === tb.id ? C.blueSoft : "#fff",
              }}>{lang === "ar" ? tb.labelAr : tb.labelEn}</div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ============ لوحة التحكم الرئيسية: نظرة سريعة عند الدخول — أرصدة، تنبيهات، تحليل ذكي، طلبات معلّقة ============ */
function WarehouseDashboard({ lang, t, setTab, meta, currentUser, whMeta }) {
  const [items, setItems] = useState([]);
  const [moves, setMoves] = useState([]);
  const [pendingRequests, setPendingRequests] = useState([]);
  const [notifs, setNotifs] = useState([]);
  const [batches, setBatches] = useState([]);
  const restrictedEntity = getUserEntityRestriction(currentUser, whMeta);
  const [entityFilter, setEntityFilter] = useState(restrictedEntity || "all");

  const entities = restrictedEntity ? [restrictedEntity] : getAllEntityNames(meta.branchTree);

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = MOVES_COL.orderBy("createdAt", "desc").limit(1000).onSnapshot((snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = REQUESTS_COL.orderBy("createdAt", "desc").limit(100).onSnapshot((snap) => setPendingRequests(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((r) => r.status === "pending")));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = WH_NOTIF_COL.orderBy("createdAt", "desc").limit(10).onSnapshot((snap) => setNotifs(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = BATCHES_COL.orderBy("expiryDate").onSnapshot((snap) => setBatches(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);

  // فلترة حسب الكيان المختار — لو "الكل" ما بيتفلترش خالص
  const filteredItems = entityFilter === "all" ? items : items.filter((it) => (it.institution || "") === entityFilter);
  const filteredItemIds = new Set(filteredItems.map((it) => it.id));
  const filteredMoves = entityFilter === "all" ? moves : moves.filter((m) => filteredItemIds.has(m.itemId));

  const totalValue = filteredItems.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  const lowStockItems = filteredItems.filter((it) => it.minStock > 0 && (it.qty || 0) <= it.minStock);
  const expiringSoon = batches.filter((b) => (entityFilter === "all" || filteredItemIds.has(b.itemId)) && (b.remainingQty ?? b.qty) > 0 && Math.ceil((new Date(b.expiryDate) - new Date(todayStr())) / 86400000) <= 7);

  // تحليل ذكي: أنماط استهلاك آخر 14 يوم
  const smartInsights = useMemo(() => {
    const list = [];
    const fromDate = new Date(Date.now() - 14 * 86400000).toISOString().slice(0, 10);
    const recent = filteredMoves.filter((m) => m.date >= fromDate);
    const outByBranch = {};
    recent.filter((m) => m.type === "out").forEach((m) => { outByBranch[m.branch] = (outByBranch[m.branch] || 0) + (Number(m.qty) || 0) * (Number(m.price) || 0); });
    const branches = Object.entries(outByBranch).sort((a, b) => b[1] - a[1]);
    if (branches.length > 1) {
      const totalOut = branches.reduce((s, [, v]) => s + v, 0);
      const pct = totalOut > 0 ? (branches[0][1] / totalOut) * 100 : 0;
      if (pct >= 40) list.push({ kind: "info", text: t(`فرع "${branches[0][0]}" بياخد ${pct.toFixed(0)}% من إجمالي المسحوبات آخر أسبوعين.`, `Branch "${branches[0][0]}" accounts for ${pct.toFixed(0)}% of withdrawals in the last two weeks.`) });
    }
    if (lowStockItems.length > 0) list.push({ kind: "warning", text: t(`${lowStockItems.length} صنف تحت الحد الأدنى المسموح به.`, `${lowStockItems.length} item(s) below minimum stock.`) });
    if (expiringSoon.length > 0) list.push({ kind: "warning", text: t(`${expiringSoon.length} دفعة هتنتهي صلاحيتها خلال أسبوع.`, `${expiringSoon.length} batch(es) expiring within a week.`) });
    if (pendingRequests.length > 0) list.push({ kind: "info", text: t(`${pendingRequests.length} طلب من الفروع بانتظار موافقتك.`, `${pendingRequests.length} branch request(s) awaiting your approval.`) });
    if (list.length === 0) list.push({ kind: "success", text: t("كل شيء مستقر — لا توجد ملاحظات تستدعي الانتباه حاليًا 🎉", "Everything looks stable — no issues need attention right now 🎉") });
    return list;
    // eslint-disable-next-line
  }, [filteredMoves, lowStockItems, expiringSoon, pendingRequests]);

  // تحليل مستقل لكل فرع: كام سحب كل فرع وبأي قيمة، خلال آخر 30 يوم
  const byBranchAnalysis = useMemo(() => {
    const fromDate = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
    const map = {};
    (meta.branches || []).forEach((b) => { map[b] = { branch: b, qtyTotal: 0, valueTotal: 0, movesCount: 0 }; });
    filteredMoves.filter((m) => m.type === "out" && m.date >= fromDate).forEach((m) => {
      const key = m.branch || t("غير محدد", "Unspecified");
      if (!map[key]) map[key] = { branch: key, qtyTotal: 0, valueTotal: 0, movesCount: 0 };
      map[key].qtyTotal += Number(m.qty) || 0;
      map[key].valueTotal += (Number(m.qty) || 0) * (Number(m.price) || 0);
      map[key].movesCount += 1;
    });
    return Object.values(map).sort((a, b) => b.valueTotal - a.valueTotal);
    // eslint-disable-next-line
  }, [filteredMoves, meta.branches]);

  // تجميع نفس التحليل حسب المؤسسة/النشاط الأب (شجرة الفروع) — بيوضح كام صرفت كل مؤسسة إجمالًا بغض النظر عن فروعها
  const byInstitutionAnalysis = useMemo(() => {
    const groups = buildBranchGroups(meta.branchTree);
    if (groups.length === 0) return [];
    const branchValueMap = {};
    byBranchAnalysis.forEach((b) => { branchValueMap[b.branch] = b; });
    return groups.map((g) => {
      const agg = { institution: g.name, qtyTotal: 0, valueTotal: 0, movesCount: 0, branchCount: g.branches.length };
      g.branches.forEach((bName) => {
        const b = branchValueMap[bName];
        if (b) { agg.qtyTotal += b.qtyTotal; agg.valueTotal += b.valueTotal; agg.movesCount += b.movesCount; }
      });
      return agg;
    }).sort((a, b) => b.valueTotal - a.valueTotal);
    // eslint-disable-next-line
  }, [byBranchAnalysis, meta.branchTree]);

  const KIND_STYLE = {
    warning: { bg: "#fef2f2", border: "#fecaca", icon: "⚠️", color: "#991b1b" },
    success: { bg: "#f0fdf4", border: "#bbf7d0", icon: "✅", color: "#166534" },
    info: { bg: "#eff6ff", border: "#bfdbfe", icon: "ℹ️", color: "#1e40af" },
  };

  return (
    <div>
      <div style={{ ...cardStyle, background: "linear-gradient(135deg,#0f2557,#1d4ed8)", border: "none" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 800, color: "#fff", marginBottom: 4 }}>📦 {t("لوحة تحكم المستودع", "Warehouse Dashboard")}</div>
            <div style={{ fontSize: 13, color: "#c7d5f5" }}>{t("نظرة سريعة على وضع المخزون النهاردة", "A quick look at today's inventory status")}</div>
          </div>
          {entities.length > 0 && (
            <div>
              <label style={{ fontSize: 11.5, color: "#c7d5f5", display: "block", marginBottom: 4 }}>🏢 {t("فلترة حسب الكيان", "Filter by entity")}</label>
              <select value={entityFilter} onChange={(e) => setEntityFilter(e.target.value)} disabled={!!restrictedEntity} style={{ ...inputStyle2, minWidth: 160 }}>
                {!restrictedEntity && <option value="all">{t("كل الكيانات", "All entities")}</option>}
                {entities.map((e) => <option key={e} value={e}>{e}</option>)}
              </select>
            </div>
          )}
        </div>
      </div>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 18 }}>
        <div onClick={() => setTab("reports")} style={{ flex: "1 1 200px", cursor: "pointer", background: "#fff", border: "1px solid " + C.border, borderRadius: 12, padding: "16px 18px" }}>
          <div style={{ fontSize: 12, color: C.muted, marginBottom: 6 }}>💰 {t("قيمة المخزون الإجمالية", "Total stock value")}</div>
          <div style={{ fontSize: 22, fontWeight: 800, color: C.navy }}>{fmt(totalValue)} {t("ر.س", "SAR")}</div>
        </div>
        <div onClick={() => setTab("items")} style={{ flex: "1 1 200px", cursor: "pointer", background: lowStockItems.length > 0 ? "#fef2f2" : "#fff", border: "1px solid " + C.border, borderRadius: 12, padding: "16px 18px" }}>
          <div style={{ fontSize: 12, color: C.muted, marginBottom: 6 }}>⚠️ {t("أصناف تحت الحد الأدنى", "Below minimum")}</div>
          <div style={{ fontSize: 22, fontWeight: 800, color: lowStockItems.length > 0 ? C.danger : C.navy }}>{lowStockItems.length}</div>
        </div>
        <div onClick={() => setTab("expiry")} style={{ flex: "1 1 200px", cursor: "pointer", background: expiringSoon.length > 0 ? "#fff7ed" : "#fff", border: "1px solid " + C.border, borderRadius: 12, padding: "16px 18px" }}>
          <div style={{ fontSize: 12, color: C.muted, marginBottom: 6 }}>📅 {t("دفعات قريبة الصلاحية", "Batches expiring soon")}</div>
          <div style={{ fontSize: 22, fontWeight: 800, color: expiringSoon.length > 0 ? C.warn : C.navy }}>{expiringSoon.length}</div>
        </div>
        <div onClick={() => setTab("branchRequest")} style={{
          flex: "1 1 200px", cursor: "pointer", borderRadius: 12, padding: "16px 18px",
          background: pendingRequests.length > 0 ? "linear-gradient(135deg,#7c2d12,#c2410c)" : "#fff", border: pendingRequests.length > 0 ? "none" : "1px solid " + C.border,
        }}>
          <div style={{ fontSize: 12, color: pendingRequests.length > 0 ? "#fed7aa" : C.muted, marginBottom: 6 }}>📋 {t("طلبات فروع معلّقة", "Pending branch requests")}</div>
          <div style={{ fontSize: 22, fontWeight: 800, color: pendingRequests.length > 0 ? "#fff" : C.navy }}>{pendingRequests.length}</div>
        </div>
      </div>

      <div style={{ background: "linear-gradient(135deg,#faf5ff,#f5f3ff)", border: "1px solid #ddd6fe", borderRadius: 14, padding: 20, marginBottom: 18 }}>
        <div style={{ fontWeight: 800, fontSize: 15, color: "#5b21b6", marginBottom: 10 }}>🤖 {t("تحليل ذكي تلقائي", "Automatic smart analysis")}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {smartInsights.map((it, i) => {
            const s = KIND_STYLE[it.kind];
            return <div key={i} style={{ background: s.bg, border: "1px solid " + s.border, borderRadius: 10, padding: "10px 13px", fontSize: 13, color: s.color, display: "flex", gap: 8 }}><span>{s.icon}</span><span>{it.text}</span></div>;
          })}
        </div>
      </div>

      {byInstitutionAnalysis.length > 0 && (
        <div style={cardStyle}>
          <div style={cardTitle}>🏢 {t("تحليل حسب المؤسسة/النشاط (آخر 30 يوم)", "Per-Institution Analysis (last 30 days)")}</div>
          <div style={{ overflowX: "auto" }}>
            <table>
              <thead><tr><th style={th}>{t("المؤسسة/النشاط", "Institution/Activity")}</th><th style={th}>{t("عدد الفروع", "Branch count")}</th><th style={th}>{t("عدد عمليات الصرف", "Issue count")}</th><th style={th}>{t("إجمالي الكمية", "Total qty")}</th><th style={th}>{t("إجمالي القيمة", "Total value")}</th></tr></thead>
              <tbody>
                {byInstitutionAnalysis.map((g) => (
                  <tr key={g.institution}>
                    <td style={{ ...td, fontWeight: 800, color: C.navy }}>{g.institution}</td>
                    <td style={td}>{g.branchCount}</td>
                    <td style={td}>{g.movesCount}</td>
                    <td style={td}>{fmt(g.qtyTotal)}</td>
                    <td style={{ ...td, fontWeight: 700, color: C.navy }}>{fmt(g.valueTotal)} {t("ر.س", "SAR")}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ ...cardTitle, marginBottom: 0, border: "none", padding: 0 }}>🏬 {t("تحليل مستقل لكل فرع (آخر 30 يوم)", "Per-Branch Analysis (last 30 days)")}</div>
          <button onClick={() => setTab("reports")} style={ghostBtn}>{t("التقرير الكامل", "Full report")}</button>
        </div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th style={th}>{t("الفرع", "Branch")}</th><th style={th}>{t("عدد عمليات الصرف", "Issue count")}</th><th style={th}>{t("إجمالي الكمية", "Total qty")}</th><th style={th}>{t("إجمالي القيمة", "Total value")}</th></tr></thead>
            <tbody>
              {byBranchAnalysis.map((b) => (
                <tr key={b.branch}>
                  <td style={{ ...td, fontWeight: 700 }}>{b.branch}</td>
                  <td style={td}>{b.movesCount}</td>
                  <td style={td}>{fmt(b.qtyTotal)}</td>
                  <td style={{ ...td, fontWeight: 700, color: C.navy }}>{fmt(b.valueTotal)} {t("ر.س", "SAR")}</td>
                </tr>
              ))}
              {byBranchAnalysis.length === 0 && <tr><td colSpan={4} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد فروع مسجّلة", "No branches registered")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {notifs.length > 0 && (
        <div style={cardStyle}>
          <div style={cardTitle}>🔔 {t("آخر إشعارات النقص", "Recent shortage notifications")}</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {notifs.slice(0, 5).map((n) => (
              <div key={n.id} style={{ fontSize: 12.5, background: "#fef2f2", borderRadius: 8, padding: "8px 12px", color: "#991b1b" }}>⚠️ {n.branch} — {n.date} ({(n.items || []).length} {t("صنف", "item(s)")})</div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [users, setUsers] = useState(null);
  const [meta, setMeta] = useState(null);
  const [whMeta, setWhMeta] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [openGroupId, setOpenGroupId] = useState(null);
  const [lang, setLang] = useState(localStorage.getItem("wh-lang") || "ar");

  function t(ar, en) { return lang === "ar" ? ar : en; }

  useEffect(() => {
    const savedSession = localStorage.getItem("wh-session");
    if (savedSession) { try { setCurrentUser(JSON.parse(savedSession)); } catch (e) {} }
  }, []);

  useEffect(() => {
    const unsub = USERS_DOC.onSnapshot((doc) => {
      setUsers(doc.exists ? (doc.data().list || []) : []);
    });
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = META_DOC.onSnapshot((doc) => {
      setMeta(doc.exists ? doc.data() : { branches: [] });
    });
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = WH_META_DOC.onSnapshot((doc) => {
      setWhMeta(doc.exists ? doc.data() : {});
    });
    return unsub;
  }, []);

  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    localStorage.setItem("wh-lang", lang);
  }, [lang]);

  function handleLogin(u) {
    setCurrentUser(u);
    localStorage.setItem("wh-session", JSON.stringify(u));
  }
  function handleLogout() {
    setCurrentUser(null);
    localStorage.removeItem("wh-session");
  }

  if (users === null || meta === null || whMeta === null) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.muted }}>...</div>;
  }
  if (!currentUser) return <LoginScreen users={users} onLogin={handleLogin} />;

  const maintenanceOnly = isMaintenanceOnly(currentUser, whMeta);
  const kitchenOnly = isKitchenOnly(currentUser, whMeta);
  const entityManagerOnly = isEntityManagerOnly(currentUser, whMeta);
  const visibleTabs = maintenanceOnly
    ? TAB_DEFS_WH.filter((tb) => tb.id === "maintenanceRequest") // مسؤول الصيانة يشوف تبويب واحد بس، مفيش أي حاجة تانية
    : kitchenOnly
    ? TAB_DEFS_WH.filter((tb) => tb.id === "production") // موظف المطبخ يشوف تبويب واحد بس، مفيش أي حاجة تانية
    : entityManagerOnly
    ? TAB_DEFS_WH.filter((tb) => tb.id === "branchRequest") // مدير الكيان يشوف تبويب واحد بس، مفيش أي حاجة تانية
    : TAB_DEFS_WH.filter((tb) => {
        if (["items", "in", "settings", "notifs", "labels", "purchase", "expiry", "suppliers", "dashboard", "equipment", "mainCount", "branchStatement", "recipes", "variance", "countSessions", "movesLog"].includes(tb.id)) return canManageWarehouse(currentUser, whMeta);
        return true; // out, count, reports, quickscan, branchRequest متاحة لمدير المستودع وموظفه
      });
  const effectiveTab = visibleTabs.some((tb) => tb.id === tab) ? tab : (visibleTabs[0]?.id || (maintenanceOnly ? "maintenanceRequest" : kitchenOnly ? "production" : entityManagerOnly ? "branchRequest" : "out"));
  const ungroupedTabs = visibleTabs.filter((tb) => !tb.group);
  const visibleGroups = TAB_GROUPS.map((g) => ({ ...g, children: visibleTabs.filter((tb) => tb.group === g.id) })).filter((g) => g.children.length > 0);

  return (
    <div style={{ minHeight: "100vh" }}>
      <div style={{
        background: "linear-gradient(90deg,#0f2557,#1d4ed8)", color: "#fff", padding: "14px 22px",
        display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12,
      }} className="no-print">
        <div style={{ fontWeight: 800, fontSize: 15 }}>📦 {t("نظام إدارة المستودع", "Warehouse Management")}</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {ungroupedTabs.filter((tb) => tb.id === "dashboard").map((tb) => (
            <button key={tb.id} onClick={() => setTab(tb.id)} style={{
              padding: "8px 14px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700,
              background: effectiveTab === tb.id ? "#fff" : "rgba(255,255,255,0.12)", color: effectiveTab === tb.id ? C.navy : "#fff",
            }}>{lang === "ar" ? tb.labelAr : tb.labelEn}</button>
          ))}
          {visibleGroups.map((g) => (
            <NavGroupDropdown key={g.id} group={g} lang={lang} effectiveTab={effectiveTab} setTab={setTab} openGroupId={openGroupId} setOpenGroupId={setOpenGroupId} />
          ))}
          {ungroupedTabs.filter((tb) => tb.id !== "dashboard").map((tb) => (
            <button key={tb.id} onClick={() => setTab(tb.id)} style={{
              padding: "8px 14px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700,
              background: effectiveTab === tb.id ? "#fff" : "rgba(255,255,255,0.12)", color: effectiveTab === tb.id ? C.navy : "#fff",
            }}>{lang === "ar" ? tb.labelAr : tb.labelEn}</button>
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 13 }}>
          <a href="https://abbelroufmohamed-rgb.github.io/deera-fares-cash/" target="_blank" rel="noreferrer" title={t("نظام الكاشير والخزينة", "Cashier & Treasury System")} style={{
            width: 34, height: 34, borderRadius: 8, background: "rgba(255,255,255,0.14)",
            display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16,
            textDecoration: "none", cursor: "pointer",
          }}>💼</a>
          <button onClick={() => setLang(lang === "ar" ? "en" : "ar")} style={{
            background: "rgba(255,255,255,0.15)", color: "#fff", border: "none", borderRadius: 7, padding: "6px 12px", cursor: "pointer", fontWeight: 700,
          }}>{lang === "ar" ? "EN" : "AR"}</button>
          <span style={{ background: "rgba(255,255,255,0.12)", padding: "6px 12px", borderRadius: 20 }}>{currentUser.name} · {WAREHOUSE_ROLE_LABELS[getWarehouseRole(currentUser, whMeta)] || t("بدون صلاحية مستودع", "No warehouse access")}</span>
          <button onClick={handleLogout} style={{ background: "#fff", color: C.danger, border: "none", borderRadius: 7, padding: "6px 12px", cursor: "pointer", fontWeight: 700 }}>
            {t("خروج", "Logout")}
          </button>
        </div>
      </div>

      <div style={{ padding: 20, maxWidth: 1300, margin: "0 auto" }}>
        {effectiveTab === "dashboard" && canManageWarehouse(currentUser, whMeta) && <WarehouseDashboard lang={lang} t={t} setTab={setTab} meta={meta} currentUser={currentUser} whMeta={whMeta} />}
        {effectiveTab === "in" && canManageWarehouse(currentUser, whMeta) && <StockInTab currentUser={currentUser} lang={lang} t={t} />}
        {effectiveTab === "out" && <StockOutTab currentUser={currentUser} meta={meta} lang={lang} t={t} institutionName={DEFAULT_INSTITUTION_NAME} />}
        {effectiveTab === "branchRequest" && (
          <BranchRequestTab currentUser={currentUser} meta={meta} lang={lang} t={t} whMeta={whMeta}
            isWhAdmin={canManageWarehouse(currentUser, whMeta)}
            canConfirmReceipt={canRequestForBranch(currentUser, whMeta)}
            entityManagerFor={isEntityManagerOnly(currentUser, whMeta) ? getUserEntityRestriction(currentUser, whMeta) : ""} />
        )}
        {effectiveTab === "quickscan" && <QuickScanTab currentUser={currentUser} meta={meta} lang={lang} t={t} institutionName={DEFAULT_INSTITUTION_NAME} />}
        {effectiveTab === "mainCount" && canManageWarehouse(currentUser, whMeta) && <MainWarehouseCountTab currentUser={currentUser} meta={meta} lang={lang} t={t} />}
        {effectiveTab === "countSessions" && canManageWarehouse(currentUser, whMeta) && <CountSessionsTab lang={lang} t={t} institutionName={DEFAULT_INSTITUTION_NAME} />}
        {effectiveTab === "movesLog" && canManageWarehouse(currentUser, whMeta) && <MovesLogTab currentUser={currentUser} meta={meta} lang={lang} t={t} />}
        {effectiveTab === "count" && <BranchCountTab currentUser={currentUser} meta={meta} lang={lang} t={t} whMeta={whMeta} />}
        {effectiveTab === "items" && canManageWarehouse(currentUser, whMeta) && <ItemsTab currentUser={currentUser} lang={lang} t={t} whMeta={whMeta} meta={meta} />}
        {effectiveTab === "labels" && canManageWarehouse(currentUser, whMeta) && <BulkLabelsTab lang={lang} t={t} />}
        {effectiveTab === "purchase" && canManageWarehouse(currentUser, whMeta) && <SuggestedPurchaseTab lang={lang} t={t} institutionName={DEFAULT_INSTITUTION_NAME} />}
        {effectiveTab === "expiry" && canManageWarehouse(currentUser, whMeta) && <ExpiryTab lang={lang} t={t} />}
        {effectiveTab === "equipment" && canManageWarehouse(currentUser, whMeta) && <EquipmentTab currentUser={currentUser} meta={meta} lang={lang} t={t} />}
        {effectiveTab === "maintenanceRequest" && <MaintenanceRequestTab currentUser={currentUser} lang={lang} t={t} isResponsible={isMaintenanceResponsible(currentUser, whMeta)} />}
        {effectiveTab === "production" && <ProductionTab currentUser={currentUser} meta={meta} lang={lang} t={t} whMeta={whMeta} />}
        {effectiveTab === "damage" && <DamageWasteTab currentUser={currentUser} meta={meta} lang={lang} t={t} isWhAdmin={canManageWarehouse(currentUser, whMeta)} />}
        {effectiveTab === "recipes" && canManageWarehouse(currentUser, whMeta) && <RecipesTab lang={lang} t={t} meta={meta} />}
        {effectiveTab === "variance" && canManageWarehouse(currentUser, whMeta) && <ConsumptionVarianceTab meta={meta} lang={lang} t={t} institutionName={DEFAULT_INSTITUTION_NAME} />}
        {effectiveTab === "externalPurchase" && <ExternalPurchaseRequestTab currentUser={currentUser} meta={meta} lang={lang} t={t} isWhAdmin={canRequestForBranch(currentUser, whMeta)} />}
        {effectiveTab === "suppliers" && canManageWarehouse(currentUser, whMeta) && <SupplierStatementTab lang={lang} t={t} institutionName={DEFAULT_INSTITUTION_NAME} />}
        {effectiveTab === "branchStatement" && canManageWarehouse(currentUser, whMeta) && <BranchStatementTab meta={meta} lang={lang} t={t} institutionName={DEFAULT_INSTITUTION_NAME} />}
        {effectiveTab === "reports" && <ReportsTab lang={lang} t={t} institutionName={DEFAULT_INSTITUTION_NAME} />}
        {effectiveTab === "notifs" && canManageWarehouse(currentUser, whMeta) && <WarehouseNotificationsPanel lang={lang} t={t} />}
        {effectiveTab === "settings" && canManageWarehouse(currentUser, whMeta) && <WarehouseSettingsTab meta={meta} whMeta={whMeta} users={users} t={t} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
