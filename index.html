/* ============ مسار الصنف: كل حركاته من وارد وصادر بالترتيب الزمني — متى دخل، متى اتصرف، ولأي فرع ============ */
function ItemHistoryModal({ item, lang, t, onClose }) {
  const [moves, setMoves] = useState(null);

  useEffect(() => {
    const unsub = MOVES_COL.where("itemId", "==", item.id).orderBy("createdAt", "desc").limit(300).onSnapshot(
      (snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      () => {
        MOVES_COL.orderBy("createdAt", "desc").limit(3000).onSnapshot((snap) => {
          setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((m) => m.itemId === item.id));
        });
      }
    );
    return unsub;
  }, [item.id]);

  const totalIn = (moves || []).filter((m) => m.type === "in").reduce((s, m) => s + (Number(m.qty) || 0), 0);
  const totalOut = (moves || []).filter((m) => m.type === "out").reduce((s, m) => s + (Number(m.qty) || 0), 0);

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(8,15,35,0.6)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} className="no-print">
      <div style={{ background: "#fff", borderRadius: 16, padding: 22, maxWidth: 640, width: "100%", maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontWeight: 800, fontSize: 16, color: C.navy }}>🧾 {t("مسار الصنف:", "Item trail:")} {lang === "ar" ? (item.nameAr || item.nameEn) : (item.nameEn || item.nameAr)}</div>
          <span onClick={onClose} style={{ cursor: "pointer", fontSize: 20, color: C.muted }}>×</span>
        </div>
        <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 140px", background: "#f0fdf4", borderRadius: 10, padding: "10px 14px" }}>
            <div style={{ fontSize: 11.5, color: C.muted }}>{t("إجمالي الوارد", "Total received")}</div>
            <div style={{ fontSize: 17, fontWeight: 800, color: C.success }}>+{fmt(totalIn)}</div>
          </div>
          <div style={{ flex: "1 1 140px", background: "#fef2f2", borderRadius: 10, padding: "10px 14px" }}>
            <div style={{ fontSize: 11.5, color: C.muted }}>{t("إجمالي الصادر", "Total issued")}</div>
            <div style={{ fontSize: 17, fontWeight: 800, color: C.danger }}>-{fmt(totalOut)}</div>
          </div>
          <div style={{ flex: "1 1 140px", background: C.blueSoft, borderRadius: 10, padding: "10px 14px" }}>
            <div style={{ fontSize: 11.5, color: C.muted }}>{t("الرصيد الحالي", "Current balance")}</div>
            <div style={{ fontSize: 17, fontWeight: 800, color: C.navy }}>{fmt(item.qty)}</div>
          </div>
        </div>
        {moves === null ? (
          <div style={{ color: C.muted, padding: 20, textAlign: "center" }}>...</div>
        ) : (
          <table>
            <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("النوع", "Type")}</th><th style={th}>{t("الكمية", "Qty")}</th><th style={th}>{t("التفاصيل", "Details")}</th><th style={th}>{t("بواسطة", "By")}</th></tr></thead>
            <tbody>
              {moves.map((m) => (
                <tr key={m.id}>
                  <td style={td}>{m.date}</td>
                  <td style={{ ...td, fontWeight: 700, color: m.type === "in" ? C.success : C.danger }}>{m.type === "in" ? "📥 " + t("وارد", "In") : "📤 " + t("صادر", "Out")}</td>
                  <td style={{ ...td, fontWeight: 700 }}>{m.type === "in" ? "+" : "-"}{fmt(m.qty)}</td>
                  <td style={td}>{m.type === "in" ? (m.supplierName || t("بدون مورد", "No supplier")) : (t("لفرع:", "To branch:") + " " + (m.branch || "—"))} {m.note ? " — " + m.note : ""}</td>
                  <td style={td}>{m.enteredBy}</td>
                </tr>
              ))}
              {moves.length === 0 && <tr><td colSpan={5} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد حركات مسجّلة لهذا الصنف بعد", "No movements recorded for this item yet")}</td></tr>}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ============ طباعة ملصقات بالجملة: تحديد كذا صنف وطباعتهم كلهم في ورقة واحدة مرتّبة ============ */
function BulkLabelsTab({ lang, t }) {
  const [items, setItems] = useState([]);
  const [selected, setSelected] = useState({});
  const [showPrint, setShowPrint] = useState(false);

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);

  function toggle(id) { setSelected((s) => ({ ...s, [id]: !s[id] })); }
  function selectAll() { const all = {}; items.forEach((it) => (all[it.id] = true)); setSelected(all); }
  function clearAll() { setSelected({}); }

  const selectedItems = items.filter((it) => selected[it.id]);

  if (showPrint) {
    return (
      <div>
        <div className="no-print" style={{ display: "flex", gap: 10, marginBottom: 14 }}>
          <button onClick={() => window.print()} style={smallBtn}>🖨️ {t("طباعة كل الملصقات", "Print all labels")}</button>
          <button onClick={() => setShowPrint(false)} style={ghostBtn}>{t("رجوع", "Back")}</button>
        </div>
        <div className="print-area" style={{ display: "flex", flexWrap: "wrap", gap: 14 }}>
          {selectedItems.map((it) => (
            <div key={it.id} style={{ width: 160, border: "1px dashed " + C.border, borderRadius: 8, padding: 12, textAlign: "center", pageBreakInside: "avoid" }}>
              <div style={{ fontWeight: 800, fontSize: 12.5, color: C.navy, marginBottom: 4 }}>{lang === "ar" ? (it.nameAr || it.nameEn) : (it.nameEn || it.nameAr)}</div>
              <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 6 }}>{fmt(it.price)} {t("ر.س", "SAR")} / {it.unit}</div>
              <div style={{ display: "flex", justifyContent: "center" }}><ItemQRCode code={it.sku} size={100} /></div>
              <div style={{ fontSize: 10, color: C.muted, marginTop: 6, fontFamily: "monospace" }}>{it.sku}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
          <div style={{ ...cardTitle, marginBottom: 0, border: "none", padding: 0 }}>🖨️ {t("طباعة ملصقات بالجملة", "Bulk Label Printing")}</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={selectAll} style={ghostBtn}>{t("تحديد الكل", "Select all")}</button>
            <button onClick={clearAll} style={ghostBtn}>{t("إلغاء التحديد", "Clear")}</button>
            <button onClick={() => setShowPrint(true)} disabled={selectedItems.length === 0} style={smallBtn}>
              {t(`معاينة وطباعة (${selectedItems.length})`, `Preview & print (${selectedItems.length})`)}
            </button>
          </div>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
          {items.map((it) => (
            <label key={it.id} style={{
              display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", borderRadius: 20, cursor: "pointer",
              border: "1px solid " + (selected[it.id] ? C.blue : C.border), background: selected[it.id] ? C.blueSoft : "#fff",
              fontSize: 13, fontWeight: selected[it.id] ? 700 : 400, color: selected[it.id] ? C.blue : C.text,
            }}>
              <input type="checkbox" checked={!!selected[it.id]} onChange={() => toggle(it.id)} />
              {lang === "ar" ? (it.nameAr || it.nameEn) : (it.nameEn || it.nameAr)}
            </label>
          ))}
          {items.length === 0 && <div style={{ color: "#9ca3af", fontSize: 13 }}>{t("لا يوجد أصناف", "No items")}</div>}
        </div>
      </div>
    </div>
  );
}

/* ============ منتقي صنف بالبحث أو مسح الكاميرا — مستخدم في الوارد/الصادر/الجرد ============ */
function ItemPicker({ items, lang, t, onPick, selectedItem }) {
  const [search, setSearch] = useState("");
  const [showScanner, setShowScanner] = useState(false);
  const filtered = items.filter((it) => {
    const s = search.trim().toLowerCase();
    if (!s) return false;
    return (it.nameAr || "").toLowerCase().includes(s) || (it.nameEn || "").toLowerCase().includes(s) || (it.sku || "").toLowerCase().includes(s);
  }).slice(0, 8);

  function onScanFound(code) {
    setShowScanner(false);
    const found = items.find((it) => it.sku === code);
    if (found) onPick(found);
    else alert(t("الكود ده مش مسجّل لأي صنف", "This code isn't registered to any item"));
  }

  return (
    <div>
      <label style={smallLabel}>{t("اختر الصنف (اكتب أو امسح بالكاميرا)", "Choose item (type or scan)")}</label>
      <div style={{ display: "flex", gap: 6, position: "relative" }}>
        <input value={selectedItem ? (lang === "ar" ? (selectedItem.nameAr || selectedItem.nameEn) : (selectedItem.nameEn || selectedItem.nameAr)) : search}
          onChange={(e) => { setSearch(e.target.value); onPick(null); }} style={inputStyle2}
          placeholder={t("اكتب اسم الصنف...", "Type item name...")} />
        <button type="button" onClick={() => setShowScanner(true)} style={{ ...smallBtn, padding: "0 16px" }}>📷</button>
        {!selectedItem && search && filtered.length > 0 && (
          <div style={{ position: "absolute", top: "100%", right: 0, left: 60, background: "#fff", border: "1px solid " + C.border, borderRadius: 8, marginTop: 4, zIndex: 10, boxShadow: "0 8px 20px rgba(0,0,0,0.1)" }}>
            {filtered.map((it) => (
              <div key={it.id} onClick={() => { onPick(it); setSearch(""); }} style={{ padding: "8px 12px", cursor: "pointer", fontSize: 13, borderBottom: "1px solid " + C.border }}>
                <div style={{ fontWeight: 700 }}>{lang === "ar" ? (it.nameAr || it.nameEn) : (it.nameEn || it.nameAr)} {it.institution && <span style={{ fontSize: 10.5, color: C.blue, fontWeight: 700 }}>({it.institution})</span>}</div>
                <div style={{ fontSize: 11, color: C.muted }}>{it.sku} — {t("الرصيد", "Qty")}: {fmt(it.qty)}</div>
              </div>
            ))}
          </div>
        )}
      </div>
      {showScanner && <CameraScanner onScan={onScanFound} onClose={() => setShowScanner(false)} />}
    </div>
  );
}

/* ============ شاشة وارد للمستودع (استلام بضاعة) ============ */
function StockInTab({ currentUser, lang, t }) {
  const [items, setItems] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [recent, setRecent] = useState([]);
  const [msg, setMsg] = useState("");
  const [saving, setSaving] = useState(false);

  // بيانات الفاتورة (تتكتب مرة واحدة لكل الأصناف)
  const [supplierName, setSupplierName] = useState("");
  const [taxNumber, setTaxNumber] = useState("");
  const [invoiceNo, setInvoiceNo] = useState("");
  const [invoiceDate, setInvoiceDate] = useState(todayStr());

  // سطر الصنف الحالي قبل ما يضاف للفاتورة
  const [selectedItem, setSelectedItem] = useState(null);
  const [qty, setQty] = useState("");
  const [unitCost, setUnitCost] = useState("");
  const [expiryDate, setExpiryDate] = useState("");

  // كل الأصناف اللي اتضافت للفاتورة الحالية
  const [lines, setLines] = useState([]);

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = SUPPLIERS_COL.orderBy("name").onSnapshot((snap) => setSuppliers(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = MOVES_COL.where("type", "==", "in").orderBy("createdAt", "desc").limit(15).onSnapshot(
      (snap) => setRecent(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      () => {
        MOVES_COL.orderBy("createdAt", "desc").limit(60).onSnapshot((snap) => {
          setRecent(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((m) => m.type === "in").slice(0, 15));
        });
      }
    );
    return unsub;
  }, []);

  useEffect(() => { if (selectedItem && !unitCost) setUnitCost(selectedItem.price || ""); }, [selectedItem]);

  function onSupplierNameChange(val) {
    setSupplierName(val);
    const found = suppliers.find((s) => s.name === val);
    if (found) setTaxNumber(found.taxNumber || "");
  }

  function addLine() {
    const q = Number(qty);
    if (!selectedItem) { setMsg(t("اختر الصنف أولًا", "Choose an item first")); return; }
    if (!q || q <= 0) { setMsg(t("أدخل كمية صحيحة أكبر من صفر", "Enter a quantity greater than zero")); return; }
    setLines((ls) => [...ls, {
      key: uid(), itemId: selectedItem.id, itemName: selectedItem.nameAr, itemNameEn: selectedItem.nameEn, unit: selectedItem.unit,
      qty: q, unitCost: Number(unitCost) || 0, expiryDate,
    }]);
    setSelectedItem(null); setQty(""); setUnitCost(""); setExpiryDate(""); setMsg("");
  }
  function removeLine(key) { setLines((ls) => ls.filter((l) => l.key !== key)); }

  const linesTotal = lines.reduce((s, l) => s + l.qty * l.unitCost, 0);
  const linesVat = linesTotal * 0.15;

  async function submitInvoice() {
    if (lines.length === 0) { setMsg(t("ضيف صنف واحد على الأقل للفاتورة قبل الحفظ", "Add at least one item to the invoice before saving")); return; }
    setSaving(true); setMsg("");
    try {
      if (supplierName.trim()) {
        const exists = suppliers.find((s) => s.name === supplierName.trim());
        if (!exists) await SUPPLIERS_COL.add({ name: supplierName.trim(), taxNumber: taxNumber.trim(), institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      }
      for (const line of lines) {
        const purchaseValue = line.qty * line.unitCost;
        const vatAmount = purchaseValue * 0.15;
        await db.runTransaction(async (tx) => {
          const ref = ITEMS_COL.doc(line.itemId);
          const snap = await tx.get(ref);
          const curQty = Number(snap.data().qty) || 0;
          tx.update(ref, { qty: curQty + line.qty });
          tx.set(MOVES_COL.doc(), {
            itemId: line.itemId, itemName: line.itemName, itemNameEn: line.itemNameEn, unit: line.unit,
            type: "in", qty: line.qty, unitCost: line.unitCost, purchaseValue, vatAmount, date: invoiceDate,
            supplierName: supplierName.trim(), taxNumber: taxNumber.trim(), invoiceNo: invoiceNo.trim(),
            paymentStatus: "unpaid", paidAmount: 0,
            enteredBy: currentUser.name, institutionId: DEFAULT_INSTITUTION_ID,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
        });
        if (line.expiryDate) {
          await BATCHES_COL.add({
            itemId: line.itemId, itemName: line.itemName, itemNameEn: line.itemNameEn, unit: line.unit,
            qty: line.qty, remainingQty: line.qty, expiryDate: line.expiryDate, receivedDate: invoiceDate, invoiceNo: invoiceNo.trim(),
            institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
        }
      }
      setMsg("✅ " + t(`تم حفظ الفاتورة بنجاح (${lines.length} صنف) وإضافتهم للمخزون`, `Invoice saved successfully (${lines.length} item(s)) and added to stock`));
      setLines([]); setSupplierName(""); setTaxNumber(""); setInvoiceNo(""); setInvoiceDate(todayStr());
    } catch (e) { setMsg("Error: " + e.message); }
    setSaving(false);
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>📥 {t("وارد للمستودع (فاتورة بعدة أصناف)", "Stock In (Multi-Item Invoice)")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("اكتب بيانات الفاتورة مرة واحدة، وضيف كل الأصناف اللي فيها واحد ورا التاني، وبعدين احفظ الفاتورة كلها مرة واحدة.", "Enter the invoice details once, add every item in it one after another, then save the whole invoice at once.")}</div>

        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 16, paddingBottom: 16, borderBottom: "1px dashed " + C.border }}>
          <div style={{ flex: "1 1 180px", position: "relative" }}>
            <label style={smallLabel}>{t("اسم المورد", "Supplier name")}</label>
            <input value={supplierName} onChange={(e) => onSupplierNameChange(e.target.value)} style={inputStyle2} list="wh-suppliers-list" />
            <datalist id="wh-suppliers-list">
              {suppliers.map((s) => <option key={s.id} value={s.name} />)}
            </datalist>
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>{t("الرقم الضريبي للمورد", "Supplier tax number")}</label>
            <input value={taxNumber} onChange={(e) => setTaxNumber(e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 140px" }}>
            <label style={smallLabel}>{t("رقم الفاتورة", "Invoice number")}</label>
            <input value={invoiceNo} onChange={(e) => setInvoiceNo(e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 140px" }}>
            <label style={smallLabel}>{t("تاريخ الفاتورة", "Invoice date")}</label>
            <input type="date" value={invoiceDate} onChange={(e) => setInvoiceDate(e.target.value)} style={inputStyle2} />
          </div>
        </div>

        <div style={{ fontWeight: 700, fontSize: 13.5, color: C.navy, marginBottom: 10 }}>➕ {t("أضف صنف للفاتورة", "Add item to invoice")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 240px" }}>
            <ItemPicker items={items} lang={lang} t={t} onPick={setSelectedItem} selectedItem={selectedItem} />
          </div>
          <div style={{ flex: "1 1 110px" }}>
            <label style={smallLabel}>{t("الكمية", "Quantity")} {selectedItem && `(${selectedItem.unit})`}</label>
            <input type="number" step="0.01" value={qty} onChange={(e) => setQty(e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 120px" }}>
            <label style={smallLabel}>{t("تكلفة الوحدة", "Unit cost")}</label>
            <input type="number" step="0.01" value={unitCost} onChange={(e) => setUnitCost(e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 140px" }}>
            <label style={smallLabel}>📅 {t("الصلاحية (اختياري)", "Expiry (optional)")}</label>
            <input type="date" value={expiryDate} onChange={(e) => setExpiryDate(e.target.value)} style={inputStyle2} />
          </div>
        </div>
        <button onClick={addLine} style={{
          ...smallBtn, width: "100%", marginTop: 14, padding: "13px 0", fontSize: 15,
        }}>➕ {t("أضف هذا الصنف للفاتورة", "Add this item to the invoice")}</button>
        {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}

        {lines.length > 0 && (
          <div style={{ marginTop: 18 }}>
            <div style={{ fontWeight: 700, fontSize: 13.5, color: C.navy, marginBottom: 10 }}>🧾 {t("أصناف هذه الفاتورة", "Items in this invoice")} ({lines.length})</div>
            <div style={{ overflowX: "auto" }}>
              <table>
                <thead><tr><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكمية", "Qty")}</th><th style={th}>{t("تكلفة الوحدة", "Unit cost")}</th><th style={th}>{t("القيمة", "Value")}</th><th style={th}>{t("الصلاحية", "Expiry")}</th><th style={th}></th></tr></thead>
                <tbody>
                  {lines.map((l) => (
                    <tr key={l.key}>
                      <td style={{ ...td, fontWeight: 700 }}>{lang === "ar" ? l.itemName : (l.itemNameEn || l.itemName)}</td>
                      <td style={td}>{fmt(l.qty)} {l.unit}</td>
                      <td style={td}>{fmt(l.unitCost)}</td>
                      <td style={{ ...td, fontWeight: 700 }}>{fmt(l.qty * l.unitCost)}</td>
                      <td style={td}>{l.expiryDate || "—"}</td>
                      <td style={td}><span onClick={() => removeLine(l.key)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700 }}>{t("حذف", "Remove")}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{ marginTop: 12, fontSize: 13, color: C.muted }}>
              {t("قيمة الفاتورة (قبل الضريبة):", "Invoice value (before VAT):")} <b>{fmt(linesTotal)}</b> — {t("الضريبة 15%:", "15% VAT:")} <b>{fmt(linesVat)}</b> — {t("الإجمالي:", "Total:")} <b>{fmt(linesTotal + linesVat)}</b>
            </div>
            <button onClick={submitInvoice} disabled={saving} style={{ ...smallBtn, marginTop: 14, padding: "12px 26px", fontSize: 15 }}>
              {saving ? t("جارِ الحفظ...", "Saving...") : "💾 " + t(`حفظ الفاتورة كاملة (${lines.length} صنف)`, `Save full invoice (${lines.length} item(s))`)}
            </button>
          </div>
        )}
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>🕒 {t("آخر عمليات الوارد", "Recent stock-in entries")}</div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكمية", "Qty")}</th><th style={th}>{t("المورد", "Supplier")}</th><th style={th}>{t("الفاتورة", "Invoice")}</th><th style={th}>{t("بواسطة", "By")}</th></tr></thead>
            <tbody>
              {recent.map((m) => (
                <tr key={m.id}><td style={td}>{m.date}</td><td style={td}>{m.itemName}</td><td style={{ ...td, color: C.success, fontWeight: 700 }}>+{fmt(m.qty)}</td><td style={td}>{m.supplierName || "—"}</td><td style={td}>{m.invoiceNo || "—"}</td><td style={td}>{m.enteredBy}</td></tr>
              ))}
              {recent.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد بعد", "None yet")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============ شاشة صرف للفروع (صادر) — بتسمح بصرف أكتر من المتاح مع تنبيه واضح، والقرار يبقى للمستخدم ============ */
function StockOutTab({ currentUser, meta, lang, t, institutionName }) {
  const [items, setItems] = useState([]);
  const [selectedItem, setSelectedItem] = useState(null);
  const [qty, setQty] = useState("");
  const [branch, setBranch] = useState("");
  const [note, setNote] = useState("");
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const [freshVoucher, setFreshVoucher] = useState(null);

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => { if (!branch && meta.branches?.length) setBranch(meta.branches[0]); }, [meta.branches]);

  const availableQty = selectedItem ? Number(selectedItem.qty) || 0 : null;
  const exceeds = selectedItem && Number(qty) > availableQty;

  async function submit() {
    const q = Number(qty);
    if (!selectedItem) { setMsg(t("اختر الصنف أولًا", "Choose an item first")); return; }
    if (!q || q <= 0) { setMsg(t("أدخل كمية صحيحة أكبر من صفر", "Enter a quantity greater than zero")); return; }
    if (!branch) { setMsg(t("اختر الفرع المستلم", "Choose the receiving branch")); return; }
    if (exceeds && !confirm(t(
      `المتاح فعليًا ${fmt(availableQty)} بس، وأنت بتصرف ${fmt(q)}. هيصبح الرصيد سالب. متأكد تكمّل؟`,
      `Only ${fmt(availableQty)} available, but you're issuing ${fmt(q)}. Stock will go negative. Continue?`
    ))) return;

    setSaving(true); setMsg("");
    try {
      let moveId;
      const bsRef = BRANCH_STOCK_COL.doc(branchStockDocId(branch, selectedItem.id));
      await db.runTransaction(async (tx) => {
        const ref = ITEMS_COL.doc(selectedItem.id);
        const snap = await tx.get(ref);
        const curQty = Number(snap.data().qty) || 0;
        tx.update(ref, { qty: curQty - q });

        const bsSnap = await tx.get(bsRef);
        const curBranchQty = bsSnap.exists ? (Number(bsSnap.data().qty) || 0) : 0;
        tx.set(bsRef, { branch, itemId: selectedItem.id, itemName: selectedItem.nameAr, qty: curBranchQty + q, institutionId: DEFAULT_INSTITUTION_ID }, { merge: true });

        const moveRef = MOVES_COL.doc();
        moveId = moveRef.id;
        tx.set(moveRef, {
          itemId: selectedItem.id, itemName: selectedItem.nameAr, itemNameEn: selectedItem.nameEn, unit: selectedItem.unit,
          price: selectedItem.price, type: "out", qty: q, branch, date: todayStr(),
          note: note.trim(), enteredBy: currentUser.name, institutionId: DEFAULT_INSTITUTION_ID,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      });
      setMsg("✅ " + t(`تم صرف ${fmt(q)} ${selectedItem.unit} لفرع ${branch}`, `Issued ${fmt(q)} ${selectedItem.unit} to ${branch}`));
      setFreshVoucher({ id: moveId, itemName: selectedItem.nameAr, itemNameEn: selectedItem.nameEn, unit: selectedItem.unit, qty: q, price: selectedItem.price, branch, date: todayStr(), note, enteredBy: currentUser.name });
      setSelectedItem(null); setQty(""); setNote("");
    } catch (e) { setMsg("Error: " + e.message); }
    setSaving(false);
  }

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={cardTitle}>📤 {t("صرف بضاعة لفرع", "Issue Goods to Branch")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ flex: "1 1 260px" }}>
            <ItemPicker items={items} lang={lang} t={t} onPick={setSelectedItem} selectedItem={selectedItem} />
          </div>
          <div style={{ flex: "1 1 130px" }}>
            <label style={smallLabel}>{t("الكمية", "Quantity")} {selectedItem && `(${selectedItem.unit})`}</label>
            <input type="number" step="0.01" value={qty} onChange={(e) => setQty(e.target.value)} style={{ ...inputStyle2, borderColor: exceeds ? C.warn : C.border }} />
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>{t("الفرع المستلم", "Receiving branch")}</label>
            <select value={branch} onChange={(e) => setBranch(e.target.value)} style={inputStyle2}>
              <GroupedBranchOptions meta={meta} />
            </select>
          </div>
          <div style={{ flex: "1 1 180px" }}>
            <label style={smallLabel}>{t("ملاحظة (اختياري)", "Note (optional)")}</label>
            <input value={note} onChange={(e) => setNote(e.target.value)} style={inputStyle2} />
          </div>
          <button onClick={submit} disabled={saving} style={smallBtn}>{saving ? t("جارِ الحفظ...", "Saving...") : "💾 " + t("تسجيل الصرف", "Record issue")}</button>
        </div>
        {selectedItem && (
          <div style={{ marginTop: 10, fontSize: 12.5, color: exceeds ? C.warn : C.muted }}>
            {exceeds ? "⚠️ " : ""}{t("المتاح فعليًا:", "Available:")} {fmt(availableQty)} {selectedItem.unit}
            {exceeds && " — " + t("الكمية المطلوبة أكبر من المتاح", "Requested quantity exceeds available stock")}
          </div>
        )}
        {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
      </div>

      {freshVoucher && <StockOutVoucher voucher={freshVoucher} institutionName={institutionName} lang={lang} t={t} onClose={() => setFreshVoucher(null)} />}
    </div>
  );
}

            <div style={{ textAlign: "center", flex: 1 }}><div style={{ borderTop: "1px solid " + C.text, width: 130, margin: "0 auto 6px" }} /> {t("مستلم الفرع", "Branch receiver")}</div>

/* ============ وضع مسح سريع للصرف: مسح صنف، إدخال كمية، تأكيد، وينتقل للصنف التالي مباشرة — لموظف واقف بالمخزن بجواله ============ */
function QuickScanTab({ currentUser, meta, lang, t, institutionName }) {
  const [items, setItems] = useState([]);
  const [branch, setBranch] = useState("");
  const [showScanner, setShowScanner] = useState(false);
  const [pendingItem, setPendingItem] = useState(null);
  const [qty, setQty] = useState("1");
  const [sessionLog, setSessionLog] = useState([]);
  const [msg, setMsg] = useState("");
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => { if (!branch && meta.branches?.length) setBranch(meta.branches[0]); }, [meta.branches]);

  function onScanFound(code) {
    setShowScanner(false);
    const found = items.find((it) => it.sku === code);
    if (found) { setPendingItem(found); setQty("1"); setMsg(""); }
    else setMsg(t("الكود ده مش مسجّل لأي صنف", "This code isn't registered to any item"));
  }

  async function confirmAndNext() {
    const q = Number(qty);
    if (!pendingItem || !q || q <= 0) return;
    setSaving(true);
    try {
      const bsRef = BRANCH_STOCK_COL.doc(branchStockDocId(branch, pendingItem.id));
      await db.runTransaction(async (tx) => {
        const ref = ITEMS_COL.doc(pendingItem.id);
        const snap = await tx.get(ref);
        const curQty = Number(snap.data().qty) || 0;
        tx.update(ref, { qty: curQty - q });
        const bsSnap = await tx.get(bsRef);
        const curBranchQty = bsSnap.exists ? (Number(bsSnap.data().qty) || 0) : 0;
        tx.set(bsRef, { branch, itemId: pendingItem.id, itemName: pendingItem.nameAr, qty: curBranchQty + q, institutionId: DEFAULT_INSTITUTION_ID }, { merge: true });
        tx.set(MOVES_COL.doc(), {
          itemId: pendingItem.id, itemName: pendingItem.nameAr, itemNameEn: pendingItem.nameEn, unit: pendingItem.unit,
          price: pendingItem.price, type: "out", qty: q, branch, date: todayStr(),
          note: t("مسح سريع", "Quick scan"), enteredBy: currentUser.name, institutionId: DEFAULT_INSTITUTION_ID,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      });
      setSessionLog((log) => [{ name: lang === "ar" ? pendingItem.nameAr : (pendingItem.nameEn || pendingItem.nameAr), qty: q, unit: pendingItem.unit }, ...log]);
      setPendingItem(null); setQty("1");
      setShowScanner(true); // يفتح الكاميرا تلقائيًا للصنف التالي
    } catch (e) { setMsg("Error: " + e.message); }
    setSaving(false);
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>⚡ {t("وضع المسح السريع — صرف لأكتر من صنف", "Quick Scan Mode — Issue Multiple Items")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("اختر الفرع مرة واحدة، وبعدها امسح صنف، أدخل الكمية، أكّد — والكاميرا هتفتح تلقائيًا للصنف اللي بعده.", "Choose the branch once, then scan an item, enter quantity, confirm — the camera reopens automatically for the next item.")}</div>
        <div style={{ marginBottom: 14 }}>
          <label style={smallLabel}>{t("الفرع المستلم", "Receiving branch")}</label>
          <select value={branch} onChange={(e) => setBranch(e.target.value)} style={{ ...inputStyle2, maxWidth: 240 }}>
            <GroupedBranchOptions meta={meta} />
          </select>
        </div>

        {pendingItem ? (
          <div style={{ background: C.blueSoft, borderRadius: 12, padding: 16 }}>
            <div style={{ fontWeight: 800, fontSize: 15, color: C.navy, marginBottom: 10 }}>{lang === "ar" ? pendingItem.nameAr : (pendingItem.nameEn || pendingItem.nameAr)}</div>
            <div style={{ fontSize: 12, color: C.muted, marginBottom: 10 }}>{t("المتاح:", "Available:")} {fmt(pendingItem.qty)} {pendingItem.unit}</div>
            <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
              <div>
                <label style={smallLabel}>{t("الكمية", "Quantity")}</label>
                <input type="number" step="0.01" value={qty} onChange={(e) => setQty(e.target.value)} autoFocus style={{ ...inputStyle2, width: 120, fontSize: 18, fontWeight: 700 }} />
              </div>
              <button onClick={confirmAndNext} disabled={saving} style={{ ...smallBtn, padding: "12px 26px", fontSize: 15 }}>
                {saving ? "..." : "✅ " + t("تأكيد وصنف تالي", "Confirm & next")}
              </button>
              <button onClick={() => { setPendingItem(null); setShowScanner(true); }} style={ghostBtn}>{t("تخطي", "Skip")}</button>
            </div>
          </div>
        ) : (
          <button onClick={() => setShowScanner(true)} disabled={!branch} style={{ ...smallBtn, width: "100%", padding: "18px 0", fontSize: 17 }}>
            📷 {t("امسح الصنف التالي", "Scan next item")}
          </button>
        )}
        {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: C.danger }}>{msg}</div>}
      </div>

      {sessionLog.length > 0 && (
        <div style={cardStyle}>
          <div style={cardTitle}>📋 {t("أصناف اتصرفت في هذه الجلسة", "Items issued this session")} ({sessionLog.length})</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {sessionLog.map((s, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", background: "#f0fdf4", borderRadius: 8, padding: "8px 12px", fontSize: 13 }}>
                <span style={{ fontWeight: 700 }}>{s.name}</span><span>{fmt(s.qty)} {s.unit}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {showScanner && <CameraScanner onScan={onScanFound} onClose={() => setShowScanner(false)} />}
    </div>
  );
}

/* ============ شاشة جرد الفروع: تحديد الكمية الفعلية لكل صنف بفرع معيّن، ومقارنتها بالمتوقع، وإرسال إشعار نقص ============ */
/* ============ طلب الفرع من المستودع الرئيسي: الشيف/موظف الفرع يطلب أصناف، وأمين المستودع يوافق (كلي/جزئي) أو يرفض ============ */
function BranchRequestTab({ currentUser, meta, lang, t, isWhAdmin }) {
  const [items, setItems] = useState([]);
  const [branch, setBranch] = useState("");
  const [lines, setLines] = useState([]);
  const [selectedItem, setSelectedItem] = useState(null);
  const [qty, setQty] = useState("");
  const [note, setNote] = useState("");
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const [myRequests, setMyRequests] = useState([]);
  const [allRequests, setAllRequests] = useState([]);
  const [filterStatus, setFilterStatus] = useState("pending");
  const [approveQtys, setApproveQtys] = useState({}); // { requestId_lineIdx: qty }
  const [freshApproval, setFreshApproval] = useState(null); // طلب اتوافق عليه حالًا، عشان نعرض ورقة طباعة فورية

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => { if (!branch && meta.branches?.length) setBranch(meta.branches[0]); }, [meta.branches]);

  useEffect(() => {
    const unsub = REQUESTS_COL.orderBy("createdAt", "desc").limit(100).onSnapshot((snap) => {
      const all = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      setAllRequests(all);
      setMyRequests(all.filter((r) => r.requestedBy === currentUser.name));
    });
    return unsub;
  }, [currentUser.name]);

  function addLine() {
    const q = Number(qty);
    if (!selectedItem) { setMsg(t("اختر الصنف أولًا", "Choose an item first")); return; }
    if (!q || q <= 0) { setMsg(t("أدخل كمية صحيحة أكبر من صفر", "Enter a quantity greater than zero")); return; }
    setLines((ls) => [...ls, { key: uid(), itemId: selectedItem.id, itemName: selectedItem.nameAr, itemNameEn: selectedItem.nameEn, unit: selectedItem.unit, qtyRequested: q }]);
    setSelectedItem(null); setQty(""); setMsg("");
  }
  function removeLine(key) { setLines((ls) => ls.filter((l) => l.key !== key)); }

  async function submitRequest() {
    if (lines.length === 0) { setMsg(t("ضيف صنف واحد على الأقل قبل إرسال الطلب", "Add at least one item before sending the request")); return; }
    setSaving(true); setMsg("");
    try {
      await REQUESTS_COL.add({
        branch, lines: lines.map((l) => ({ itemId: l.itemId, itemName: l.itemName, itemNameEn: l.itemNameEn, unit: l.unit, qtyRequested: l.qtyRequested, qtyApproved: 0 })),
        note: note.trim(), status: "pending", requestedBy: currentUser.name, institutionId: DEFAULT_INSTITUTION_ID,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setLines([]); setNote("");
      setMsg("✅ " + t("تم إرسال الطلب للمستودع الرئيسي للمراجعة", "Request sent to the main warehouse for review"));
    } catch (e) { setMsg("Error: " + e.message); }
    setSaving(false);
  }

  async function approveRequest(req, fulfillAll) {
    setSaving(true); setMsg("");
    try {
      const finalLines = req.lines.map((l, i) => {
        const key = req.id + "_" + i;
        const q = fulfillAll ? l.qtyRequested : (Number(approveQtys[key]) || 0);
        return { ...l, qtyApproved: q };
      });
      for (const l of finalLines) {
        if (l.qtyApproved <= 0) continue;
        const bsRef = BRANCH_STOCK_COL.doc(branchStockDocId(req.branch, l.itemId));
        await db.runTransaction(async (tx) => {
          const ref = ITEMS_COL.doc(l.itemId);
          const snap = await tx.get(ref);
          const curQty = Number(snap.data().qty) || 0;
          tx.update(ref, { qty: curQty - l.qtyApproved });
          const bsSnap = await tx.get(bsRef);
          const curBranchQty = bsSnap.exists ? (Number(bsSnap.data().qty) || 0) : 0;
          tx.set(bsRef, { branch: req.branch, itemId: l.itemId, itemName: l.itemName, qty: curBranchQty + l.qtyApproved, institutionId: DEFAULT_INSTITUTION_ID }, { merge: true });
          tx.set(MOVES_COL.doc(), {
            itemId: l.itemId, itemName: l.itemName, itemNameEn: l.itemNameEn, unit: l.unit,
            type: "out", qty: l.qtyApproved, branch: req.branch, date: todayStr(),
            note: t("تنفيذ طلب فرع", "Branch request fulfillment") + " #" + req.id.slice(0, 6),
            enteredBy: currentUser.name, institutionId: DEFAULT_INSTITUTION_ID,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
        });
      }
      const allFulfilled = finalLines.every((l) => l.qtyApproved >= l.qtyRequested);
      await REQUESTS_COL.doc(req.id).update({
        lines: finalLines, status: allFulfilled ? "approved" : "partial",
        reviewedBy: currentUser.name, reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setMsg("✅ " + t("تم تنفيذ الطلب وصرف الأصناف للفرع", "Request fulfilled and items issued to the branch"));
      setFreshApproval({ ...req, lines: finalLines, reviewedBy: currentUser.name, reviewedAtDate: todayStr() });
    } catch (e) { setMsg("Error: " + e.message); }
    setSaving(false);
  }

  async function rejectRequest(req) {
    if (!confirm(t("هل تريد رفض هذا الطلب؟", "Reject this request?"))) return;
    await REQUESTS_COL.doc(req.id).update({ status: "rejected", reviewedBy: currentUser.name, reviewedAt: firebase.firestore.FieldValue.serverTimestamp() });
  }

  const STATUS_LABEL = { pending: t("قيد المراجعة", "Pending"), approved: t("تم التنفيذ بالكامل", "Fully fulfilled"), partial: t("تم التنفيذ جزئيًا", "Partially fulfilled"), rejected: t("مرفوض", "Rejected") };
  const STATUS_COLOR = { pending: C.warn, approved: C.success, partial: "#a16207", rejected: C.danger };

  const displayedRequests = isWhAdmin ? allRequests.filter((r) => filterStatus === "all" || r.status === filterStatus) : myRequests;

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>📋 {t("طلب أصناف من المستودع الرئيسي", "Request Items from Main Warehouse")}</div>
        <div style={{ marginBottom: 14 }}>
          <label style={smallLabel}>{t("الفرع الطالب", "Requesting branch")}</label>
          <select value={branch} onChange={(e) => setBranch(e.target.value)} style={{ ...inputStyle2, maxWidth: 240 }}>
            <GroupedBranchOptions meta={meta} />
          </select>
        </div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 260px" }}>
            <ItemPicker items={items} lang={lang} t={t} onPick={setSelectedItem} selectedItem={selectedItem} />
          </div>
          <div style={{ flex: "1 1 120px" }}>
            <label style={smallLabel}>{t("الكمية المطلوبة", "Requested qty")} {selectedItem && `(${selectedItem.unit})`}</label>
            <input type="number" step="0.01" value={qty} onChange={(e) => setQty(e.target.value)} style={inputStyle2} />
          </div>
        </div>
        <button onClick={addLine} style={{ ...smallBtn, width: "100%", marginTop: 14, padding: "13px 0", fontSize: 15 }}>➕ {t("أضف هذا الصنف للطلب", "Add this item to the request")}</button>

        {lines.length > 0 && (
          <div style={{ marginTop: 18 }}>
            <div style={{ fontWeight: 700, fontSize: 13.5, color: C.navy, marginBottom: 10 }}>🧾 {t("أصناف هذا الطلب", "Items in this request")} ({lines.length})</div>
            <table>
              <thead><tr><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكمية المطلوبة", "Requested qty")}</th><th style={th}></th></tr></thead>
              <tbody>
                {lines.map((l) => (
                  <tr key={l.key}>
                    <td style={{ ...td, fontWeight: 700 }}>{lang === "ar" ? l.itemName : (l.itemNameEn || l.itemName)}</td>
                    <td style={td}>{fmt(l.qtyRequested)} {l.unit}</td>
                    <td style={td}><span onClick={() => removeLine(l.key)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700 }}>{t("حذف", "Remove")}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{ marginTop: 12 }}>
              <label style={smallLabel}>{t("ملاحظة (اختياري)", "Note (optional)")}</label>
              <input value={note} onChange={(e) => setNote(e.target.value)} style={{ ...inputStyle2, maxWidth: 400 }} />
            </div>
            <button onClick={submitRequest} disabled={saving} style={{ ...smallBtn, marginTop: 14, padding: "12px 26px", fontSize: 15 }}>
              {saving ? t("جارِ الإرسال...", "Sending...") : "📤 " + t(`إرسال الطلب (${lines.length} صنف)`, `Send request (${lines.length} item(s))`)}
            </button>
          </div>
        )}
        {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
      </div>

      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
          <div style={{ ...cardTitle, marginBottom: 0, border: "none", padding: 0 }}>🕒 {isWhAdmin ? t("كل طلبات الفروع", "All branch requests") : t("طلباتي السابقة", "My previous requests")}</div>
          {isWhAdmin && (
            <div style={{ display: "flex", gap: 8 }}>
              {["pending", "approved", "partial", "rejected", "all"].map((s) => (
                <button key={s} onClick={() => setFilterStatus(s)} style={filterStatus === s ? smallBtn : ghostBtn}>{s === "all" ? t("الكل", "All") : STATUS_LABEL[s]}</button>
              ))}
            </div>
          )}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {displayedRequests.map((r) => (
            <div key={r.id} style={{ border: "1px solid " + C.border, borderRadius: 10, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
                <div>
                  <span style={{ fontWeight: 800, color: C.navy }}>{r.branch}</span>
                  {isWhAdmin && <span style={{ fontSize: 12, color: C.muted }}> — {t("من:", "from:")} {r.requestedBy}</span>}
                </div>
                <span style={{ fontWeight: 700, color: STATUS_COLOR[r.status] }}>{STATUS_LABEL[r.status]}</span>
              </div>
              <table>

              {isWhAdmin && r.status === "pending" && (
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <button onClick={() => approveRequest(r, true)} disabled={saving} style={smallBtn}>✅ {t("موافقة كاملة (الكميات المطلوبة كلها)", "Approve fully (all requested quantities)")}</button>
                  <button onClick={() => approveRequest(r, false)} disabled={saving} style={ghostBtn}>{t("موافقة بالكميات المكتوبة فوق", "Approve with amounts entered above")}</button>
                  <button onClick={() => rejectRequest(r)} style={{ ...ghostBtn, color: C.danger, borderColor: C.danger }}>{t("رفض", "Reject")}</button>
                </div>
              )}
            </div>
          ))}
          {displayedRequests.length === 0 && <div style={{ color: "#9ca3af", fontSize: 13, textAlign: "center" }}>{t("لا يوجد طلبات", "No requests")}</div>}
        </div>
      </div>

      {freshApproval && <BranchRequestVoucher req={freshApproval} lang={lang} t={t} onClose={() => setFreshApproval(null)} />}
    </div>
  );
}

function BranchCountTab({ currentUser, meta, lang, t }) {
  const [branch, setBranch] = useState("");
  const [branchStock, setBranchStock] = useState([]);
  const [counted, setCounted] = useState({}); // { itemId: countedQty }
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const [history, setHistory] = useState([]);

  useEffect(() => { if (!branch && meta.branches?.length) setBranch(meta.branches[0]); }, [meta.branches]);
  useEffect(() => {
    if (!branch) return;
    const unsub = BRANCH_STOCK_COL.where("branch", "==", branch).onSnapshot(
      (snap) => setBranchStock(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      () => { BRANCH_STOCK_COL.onSnapshot((snap) => setBranchStock(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((b) => b.branch === branch))); }
    );
    return unsub;
  }, [branch]);
  useEffect(() => {
    if (!branch) return;
    const unsub = COUNTS_COL.orderBy("createdAt", "desc").limit(20).onSnapshot(
      (snap) => setHistory(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((c) => c.branch === branch)),
      () => {}
    );
    return unsub;
  }, [branch]);

  function setCountedQty(itemId, val) { setCounted((c) => ({ ...c, [itemId]: val })); }

  async function submitCounts() {
    const toSubmit = branchStock.filter((b) => counted[b.itemId] !== undefined && counted[b.itemId] !== "");
    if (toSubmit.length === 0) { setMsg(t("أدخل كمية فعلية لصنف واحد على الأقل", "Enter a counted quantity for at least one item")); return; }
    setSaving(true); setMsg("");
    try {
      const shortages = [];
      for (const b of toSubmit) {
        const countedQty = Number(counted[b.itemId]) || 0;
        const systemQty = Number(b.qty) || 0;
        const diff = countedQty - systemQty;
        await COUNTS_COL.add({
          branch, itemId: b.itemId, itemName: b.itemName, systemQty, countedQty, diff, date: todayStr(),
          countedBy: currentUser.name, institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        await BRANCH_STOCK_COL.doc(b.id).update({ qty: countedQty }); // الجرد بيصحّح الرصيد ليبقى نقطة البداية الجديدة
        if (countedQty <= 0 || diff < -0.009) {
          shortages.push({ itemName: b.itemName, countedQty, diff });
        }
      }
      if (shortages.length > 0) {
        await WH_NOTIF_COL.add({
          type: "shortage", branch, items: shortages, date: todayStr(), createdBy: currentUser.name,
          institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(), readBy: [],
        });
      }
      setCounted({});
      setMsg("✅ " + t(`تم حفظ الجرد (${toSubmit.length} صنف)` + (shortages.length ? ` — ⚠️ ${shortages.length} صنف فيه نقص وتم إرسال إشعار` : ""), `Count saved (${toSubmit.length} items)` + (shortages.length ? ` — ⚠️ ${shortages.length} shortage(s) notified` : "")));
    } catch (e) { setMsg("Error: " + e.message); }
    setSaving(false);
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>🧮 {t("جرد الفروع", "Branch Stock Count")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("اختر الفرع، وسجّل الكمية الفعلية الموجودة عنده لكل صنف. أي نقص عن المتوقع بيتبعت كإشعار تلقائي.", "Choose the branch and record the actual counted quantity for each item. Any shortage below the expected amount triggers an automatic notification.")}</div>
        <div style={{ marginBottom: 14 }}>
          <label style={smallLabel}>{t("الفرع", "Branch")}</label>
          <select value={branch} onChange={(e) => { setBranch(e.target.value); setCounted({}); }} style={{ ...inputStyle2, maxWidth: 260 }}>
            <GroupedBranchOptions meta={meta} />
          </select>
        </div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("المتوقع (حسب النظام)", "Expected (system)")}</th><th style={th}>{t("الكمية الفعلية المجرودة", "Actual counted qty")}</th><th style={th}>{t("الفرق", "Diff")}</th></tr></thead>
            <tbody>
              {branchStock.map((b) => {
                const c = counted[b.itemId];
                const diff = c !== undefined && c !== "" ? Number(c) - Number(b.qty) : null;
                return (
                  <tr key={b.id}>
                    <td style={{ ...td, fontWeight: 700 }}>{b.itemName}</td>
                    <td style={td}>{fmt(b.qty)}</td>
                    <td style={td}><input type="number" step="0.01" value={c || ""} onChange={(e) => setCountedQty(b.itemId, e.target.value)} style={{ ...inputStyle2, width: 110 }} /></td>
                    <td style={{ ...td, fontWeight: 700, color: diff === null ? C.muted : diff < 0 ? C.danger : diff > 0 ? C.success : C.muted }}>{diff === null ? "—" : (diff > 0 ? "+" : "") + fmt(diff)}</td>
                  </tr>
                );
              })}
              {branchStock.length === 0 && <tr><td colSpan={4} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("مفيش أصناف اتصرفت لهذا الفرع بعد", "No items have been issued to this branch yet")}</td></tr>}
            </tbody>
          </table>
        </div>
        {branchStock.length > 0 && (
          <div style={{ marginTop: 14 }}>
            <button onClick={submitCounts} disabled={saving} style={smallBtn}>{saving ? t("جارِ الحفظ...", "Saving...") : "💾 " + t("حفظ الجرد", "Save count")}</button>
          </div>
        )}
        {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>🕒 {t("آخر عمليات الجرد لهذا الفرع", "Recent counts for this branch")}</div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("متوقع", "Expected")}</th><th style={th}>{t("فعلي", "Counted")}</th><th style={th}>{t("الفرق", "Diff")}</th><th style={th}>{t("بواسطة", "By")}</th></tr></thead>
            <tbody>
              {history.map((h) => (
                <tr key={h.id}>
                  <td style={td}>{h.date}</td><td style={td}>{h.itemName}</td><td style={td}>{fmt(h.systemQty)}</td><td style={td}>{fmt(h.countedQty)}</td>
                  <td style={{ ...td, fontWeight: 700, color: h.diff < 0 ? C.danger : h.diff > 0 ? C.success : C.muted }}>{h.diff > 0 ? "+" : ""}{fmt(h.diff)}</td>
                  <td style={td}>{h.countedBy}</td>
                </tr>
              ))}
              {history.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد جرد سابق", "No previous counts")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============ شاشة الإشعارات (نقص الأصناف عند الفروع) ============ */
/* ============ شاشة تتبّع تواريخ الصلاحية: كل الدفعات مرتّبة، مع تلوين القريب من الانتهاء أو المنتهي ============ */
function ExpiryTab({ lang, t }) {
  const [batches, setBatches] = useState(null);
  const [markingId, setMarkingId] = useState(null);

  useEffect(() => {
    const unsub = BATCHES_COL.orderBy("expiryDate").onSnapshot((snap) => setBatches(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);

  function daysUntil(dateStr) {
    return Math.ceil((new Date(dateStr) - new Date(todayStr())) / 86400000);
  }
  function statusOf(days) {
    if (days < 0) return "expired";
    if (days <= 7) return "urgent";
    if (days <= 30) return "soon";
    return "ok";
  }
  const STATUS_STYLE = {
    expired: { bg: "#fef2f2", color: C.danger, label: t("منتهي الصلاحية", "Expired") },
    urgent: { bg: "#fff7ed", color: C.warn, label: t("قريب جدًا (أسبوع أو أقل)", "Very soon (≤7 days)") },
    soon: { bg: "#fefce8", color: "#a16207", label: t("خلال شهر", "Within a month") },
    ok: { bg: "#f0fdf4", color: C.success, label: t("سليم", "OK") },
  };

  async function markConsumed(id) {
    setMarkingId(id);
    await BATCHES_COL.doc(id).update({ remainingQty: 0 });
    setMarkingId(null);
  }

  if (batches === null) return <div style={{ color: C.muted, padding: 20 }}>...</div>;
  const activeBatches = batches.filter((b) => (b.remainingQty ?? b.qty) > 0);
  const sorted = [...activeBatches].sort((a, b) => daysUntil(a.expiryDate) - daysUntil(b.expiryDate));

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>📅 {t("تتبّع تواريخ الصلاحية", "Expiry Date Tracking")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("كل دفعة بضاعة سجّلت لها تاريخ صلاحية وقت الوارد، هتظهر هنا مرتّبة من الأقرب انتهاءً.", "Every batch you gave an expiry date to when receiving stock appears here, sorted by nearest expiry.")}</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
          {Object.entries(STATUS_STYLE).map(([key, s]) => {
            const count = sorted.filter((b) => statusOf(daysUntil(b.expiryDate)) === key).length;
            if (count === 0) return null;
            return <div key={key} style={{ background: s.bg, borderRadius: 10, padding: "8px 14px", fontSize: 13, fontWeight: 700, color: s.color }}>{s.label}: {count}</div>;
          })}
        </div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكمية المتبقية", "Remaining qty")}</th><th style={th}>{t("تاريخ الاستلام", "Received")}</th><th style={th}>{t("تاريخ الصلاحية", "Expiry date")}</th><th style={th}>{t("الحالة", "Status")}</th><th style={th}></th></tr></thead>
            <tbody>
              {sorted.map((b) => {
                const days = daysUntil(b.expiryDate);
                const status = statusOf(days);
                const s = STATUS_STYLE[status];
                return (
                  <tr key={b.id} style={{ background: s.bg }}>
                    <td style={{ ...td, fontWeight: 700 }}>{lang === "ar" ? (b.itemName || b.itemNameEn) : (b.itemNameEn || b.itemName)}</td>
                    <td style={td}>{fmt(b.remainingQty ?? b.qty)} {b.unit}</td>
                    <td style={td}>{b.receivedDate}</td>
                    <td style={td}>{b.expiryDate}</td>
                    <td style={{ ...td, color: s.color, fontWeight: 700 }}>{s.label} {status !== "expired" && status !== "ok" ? `(${days} ${t("يوم", "days")})` : ""}</td>
                    <td style={td}><span onClick={() => markConsumed(b.id)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700 }}>{markingId === b.id ? "..." : t("تعليم كمستهلكة", "Mark consumed")}</span></td>
                  </tr>
                );
              })}
              {sorted.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد دفعات مسجّل لها تاريخ صلاحية", "No batches with an expiry date recorded")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============ تقرير المخزون: القيمة الإجمالية + استهلاك كل فرع ============ */
function ReportsTab({ lang, t, institutionName }) {
  const [items, setItems] = useState([]);
  const [moves, setMoves] = useState([]);
  const [fromDate, setFromDate] = useState(new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0, 10));
  const [toDate, setToDate] = useState(todayStr());
  const [mode, setMode] = useState("stock"); // stock | branch | purchases | payments | vat
  const [branchFilter, setBranchFilter] = useState("all");
  const [meta, setMeta] = useState({ branches: [] });

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = MOVES_COL.orderBy("createdAt", "desc").limit(3000).onSnapshot((snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = META_DOC.onSnapshot((doc) => setMeta(doc.exists ? doc.data() : { branches: [] }));
    return unsub;
  }, []);

  const totalValue = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  const lowStockItems = items.filter((it) => it.minStock > 0 && (it.qty || 0) <= it.minStock);

  const rangeMoves = moves.filter((m) => m.date >= fromDate && m.date <= toDate);
  const rangeOutMoves = rangeMoves.filter((m) => m.type === "out" && (branchFilter === "all" || m.branch === branchFilter));
  const rangeInMoves = rangeMoves.filter((m) => m.type === "in");

  const byBranch = useMemo(() => {
    const map = {};
    rangeMoves.filter((m) => m.type === "out").forEach((m) => {
      const key = m.branch || "—";
      if (!map[key]) map[key] = { branch: key, qtyTotal: 0, valueTotal: 0, items: {} };
      map[key].qtyTotal += Number(m.qty) || 0;
      map[key].valueTotal += (Number(m.qty) || 0) * (Number(m.price) || 0);
      const itKey = m.itemName;
      map[key].items[itKey] = (map[key].items[itKey] || 0) + (Number(m.qty) || 0);
    });
    return Object.values(map).sort((a, b) => b.valueTotal - a.valueTotal);
    // eslint-disable-next-line
  }, [rangeMoves]);

  /* ============ تحليل ذكي إحصائي (بدون أي API خارجي) — أنماط استهلاك، فروع شاذة، أصناف قريبة من النفاد ============ */
  const smartInsights = useMemo(() => {
    const list = [];
    if (byBranch.length > 1) {
      const top = byBranch[0];
      const totalAll = byBranch.reduce((s, b) => s + b.valueTotal, 0);
      const pct = totalAll > 0 ? (top.valueTotal / totalAll) * 100 : 0;
      if (pct >= 40) list.push({ kind: "info", text: t(`فرع "${top.branch}" بياخد ${pct.toFixed(0)}% من إجمالي قيمة المسحوبات في هذه الفترة — تركّز عالي يستاهل مراجعة.`, `Branch "${top.branch}" accounts for ${pct.toFixed(0)}% of total withdrawn value this period — worth reviewing.`) });
    }
    // أصناف معدل استهلاكها هيخلّص المخزون قريب (بناءً على متوسط الاستهلاك اليومي في الفترة)
    const daysInRange = Math.max(1, (new Date(toDate) - new Date(fromDate)) / 86400000);
    const consumedByItem = {};
    rangeMoves.filter((m) => m.type === "out").forEach((m) => { consumedByItem[m.itemId] = (consumedByItem[m.itemId] || 0) + (Number(m.qty) || 0); });
    items.forEach((it) => {
      const consumed = consumedByItem[it.id] || 0;
      if (consumed <= 0) return;
      const dailyRate = consumed / daysInRange;
      if (dailyRate <= 0) return;
      const daysLeft = (it.qty || 0) / dailyRate;
      if (daysLeft <= 7 && (it.qty || 0) > 0) {
        list.push({ kind: "warning", text: t(`صنف "${it.nameAr}" هيخلص تقريبًا خلال ${Math.round(daysLeft)} يوم لو استمر معدل الاستهلاك الحالي.`, `"${it.nameEn || it.nameAr}" will likely run out in about ${Math.round(daysLeft)} days at the current consumption rate.`) });
      }
    });
    if (lowStockItems.length > 0) {
      list.push({ kind: "warning", text: t(`${lowStockItems.length} صنف تحت الحد الأدنى المسموح به دلوقتي.`, `${lowStockItems.length} item(s) are currently below minimum stock.`) });
    }
    if (list.length === 0) list.push({ kind: "success", text: t("لا توجد ملاحظات شاذة — المخزون والاستهلاك مستقران في هذه الفترة.", "No anomalies detected — stock and consumption look stable this period.") });
    return list;
    // eslint-disable-next-line
  }, [byBranch, items, rangeMoves, fromDate, toDate]);

  // تقرير المشتريات والمدفوعات والضريبة
  const purchasesTotal = rangeInMoves.reduce((s, m) => s + (Number(m.purchaseValue) || 0), 0);
  const vatTotal = rangeInMoves.reduce((s, m) => s + (Number(m.vatAmount) || 0), 0);
  const paidTotal = rangeInMoves.reduce((s, m) => s + (Number(m.paidAmount) || 0), 0);
  const unpaidTotal = (purchasesTotal + vatTotal) - paidTotal;

  async function markPaid(moveId, amount) {
    await MOVES_COL.doc(moveId).update({ paidAmount: amount, paymentStatus: "paid" });
  }

  function doPrint() { window.print(); }

  const KIND_STYLE = {
    warning: { bg: "#fef2f2", border: "#fecaca", icon: "⚠️", color: "#991b1b" },
    success: { bg: "#f0fdf4", border: "#bbf7d0", icon: "✅", color: "#166534" },
    info: { bg: "#eff6ff", border: "#bfdbfe", icon: "ℹ️", color: "#1e40af" },
  };

  return (

          <button onClick={() => setMode("payments")} style={mode === "payments" ? smallBtn : ghostBtn}>{t("المدفوعات", "Payments")}</button>

        </div>
        {mode !== "stock" && (
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
            <div><label style={smallLabel}>{t("من تاريخ", "From")}</label><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} style={inputStyle2} /></div>
            <div><label style={smallLabel}>{t("إلى تاريخ", "To")}</label><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} style={inputStyle2} /></div>
            {mode === "branch" && (
              <div>
                <label style={smallLabel}>{t("الفرع", "Branch")}</label>
                <select value={branchFilter} onChange={(e) => setBranchFilter(e.target.value)} style={inputStyle2}>
                  <option value="all">{t("كل الفروع", "All branches")}</option>
                  <GroupedBranchOptions meta={meta} />
                </select>
              </div>
            )}
          </div>
        )}
      </div>

      {mode === "branch" && (
        <div style={{ background: "linear-gradient(135deg,#faf5ff,#f5f3ff)", border: "1px solid #ddd6fe", borderRadius: 14, padding: 20, marginBottom: 18 }} className="no-print">
          <div style={{ fontWeight: 800, fontSize: 15, color: "#5b21b6", marginBottom: 10 }}>🤖 {t("تحليل ذكي تلقائي", "Automatic smart analysis")}</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {smartInsights.map((it, i) => {
              const s = KIND_STYLE[it.kind];
              return <div key={i} style={{ background: s.bg, border: "1px solid " + s.border, borderRadius: 10, padding: "10px 13px", fontSize: 13, color: s.color, display: "flex", gap: 8 }}><span>{s.icon}</span><span>{it.text}</span></div>;
            })}
          </div>
        </div>
      )}

      <div className="print-area">
        <div className="print-only-header"><h2>{institutionName}</h2><div>{t("تقرير", "Report")}</div></div>

        {mode === "stock" && (
          <>
            <div style={cardStyle}>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <div style={{ flex: "1 1 220px", background: "linear-gradient(135deg,#0f2557,#1d4ed8)", borderRadius: 10, padding: "14px 16px" }}>

                </div>

                  <tr key={b.branch}>
                    <td style={{ ...td, fontWeight: 700 }}>{b.branch}</td>

              </tbody>
            </table>
          </div>
        )}

        {mode === "purchases" && (
          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>🧾 {t("تقرير المشتريات", "Purchases report")}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
            </div>
            <div style={{ marginBottom: 14, fontSize: 14, fontWeight: 700, color: C.navy }}>{t("إجمالي المشتريات (قبل الضريبة):", "Total purchases (before VAT):")} {fmt(purchasesTotal)} {t("ر.س", "SAR")}</div>
            <table>
              <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكمية", "Qty")}</th><th style={th}>{t("تكلفة الوحدة", "Unit cost")}</th><th style={th}>{t("القيمة", "Value")}</th><th style={th}>{t("المورد", "Supplier")}</th><th style={th}>{t("الفاتورة", "Invoice")}</th></tr></thead>
              <tbody>
                {rangeInMoves.map((m) => (

                    <td style={td}>{m.supplierName || "—"}</td><td style={td}>{m.invoiceNo || "—"}</td>

                {rangeInMoves.length === 0 && <tr><td colSpan={7} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد مشتريات في هذه الفترة", "No purchases in this period")}</td></tr>}
              </tbody>
            </table>
          </div>

        {mode === "payments" && (
          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>💳 {t("تقرير المدفوعات للموردين", "Supplier payments report")}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("إجمالي المدفوع", "Total paid")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.success }}>{fmt(paidTotal)}</div>
              </div>
              <div style={{ flex: "1 1 200px", background: unpaidTotal > 0 ? "#fef2f2" : C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("متبقي غير مدفوع", "Remaining unpaid")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: unpaidTotal > 0 ? C.danger : C.success }}>{fmt(unpaidTotal)}</div>
              </div>
            </div>
            <table className="no-print">
              <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("المورد", "Supplier")}</th><th style={th}>{t("الفاتورة", "Invoice")}</th><th style={th}>{t("الإجمالي مع الضريبة", "Total incl. VAT")}</th><th style={th}>{t("الحالة", "Status")}</th><th style={th}></th></tr></thead>
              <tbody>
                {rangeInMoves.map((m) => {
                  const totalWithVat = (Number(m.purchaseValue) || 0) + (Number(m.vatAmount) || 0);
                  return (
                    <tr key={m.id}>
                      <td style={td}>{m.date}</td><td style={td}>{m.supplierName || "—"}</td><td style={td}>{m.invoiceNo || "—"}</td>
                      <td style={{ ...td, fontWeight: 700 }}>{fmt(totalWithVat)}</td>
                      <td style={{ ...td, color: m.paymentStatus === "paid" ? C.success : C.danger, fontWeight: 700 }}>{m.paymentStatus === "paid" ? t("مدفوعة", "Paid") : t("غير مدفوعة", "Unpaid")}</td>
                      <td style={td}>{m.paymentStatus !== "paid" && <span onClick={() => markPaid(m.id, totalWithVat)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700 }}>{t("تعليم كمدفوعة", "Mark as paid")}</span>}</td>
                    </tr>
                  );
                })}
                {rangeInMoves.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد فواتير في هذه الفترة", "No invoices in this period")}</td></tr>}
              </tbody>
            </table>
          </div>
        )}

        {mode === "vat" && (
          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>📊 {t("تقرير ضريبة القيمة المضافة 15%", "15% VAT Report")}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("إجمالي المشتريات (قبل الضريبة)", "Total purchases (excl. VAT)")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.navy }}>{fmt(purchasesTotal)}</div>
              </div>
              <div style={{ flex: "1 1 200px", background: "linear-gradient(135deg,#0f2557,#1d4ed8)", borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: "#dbe6ff" }}>{t("إجمالي ضريبة القيمة المضافة (15%)", "Total 15% VAT")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: "#fff" }}>{fmt(vatTotal)}</div>
              </div>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("الإجمالي شامل الضريبة", "Total incl. VAT")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.navy }}>{fmt(purchasesTotal + vatTotal)}</div>
              </div>
            </div>
            <table>
              <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("المورد", "Supplier")}</th><th style={th}>{t("الرقم الضريبي", "Tax number")}</th><th style={th}>{t("القيمة قبل الضريبة", "Value before VAT")}</th><th style={th}>{t("الضريبة 15%", "15% VAT")}</th><th style={th}>{t("الإجمالي", "Total")}</th></tr></thead>
              <tbody>
                {rangeInMoves.map((m) => (
                  <tr key={m.id}>
                    <td style={td}>{m.date}</td><td style={td}>{m.supplierName || "—"}</td><td style={td}>{m.taxNumber || "—"}</td>
                    <td style={td}>{fmt(m.purchaseValue)}</td><td style={td}>{fmt(m.vatAmount)}</td>
                    <td style={{ ...td, fontWeight: 700 }}>{fmt((Number(m.purchaseValue) || 0) + (Number(m.vatAmount) || 0))}</td>
                  </tr>
                ))}
                {rangeInMoves.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد فواتير في هذه الفترة", "No invoices in this period")}</td></tr>}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}
const TAB_DEFS_WH = [
  { id: "dashboard", labelAr: "🏠 لوحة التحكم", labelEn: "🏠 Dashboard" },
