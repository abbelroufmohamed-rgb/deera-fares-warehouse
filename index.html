<script type="text/babel" data-presets="react">

/* ============ ألوان الهوية (نفس هوية تطبيق الكاشير للتناسق البصري) ============ */
const C = {

function fmt(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

const DEFAULT_INSTITUTION_ID = "default";
const DEFAULT_INSTITUTION_NAME = "مؤسسة ديرة فارس للتجارة";

/* Firestore collections — منفصلة تمامًا عن مجموعات تطبيق الكاشير، لكن بنفس المشروع */
const USERS_DOC = db.collection("cashRecon").doc("users"); // نفس مستخدمي تطبيق الكاشير بالظبط
const META_DOC = db.collection("institutionMeta").doc(DEFAULT_INSTITUTION_ID); // نفس فروع تطبيق الكاشير بالظبط (نفس مكان الحفظ الحقيقي)
const ITEMS_COL = db.collection("whItems");
const MOVES_COL = db.collection("whMoves");
const REQUESTS_COL = db.collection("whRequests");

const WH_META_DOC = db.collection("whMeta").doc("default");
const BRANCH_STOCK_COL = db.collection("whBranchStock"); // مخزون كل فرع لكل صنف: doc id = branch__itemId
const WH_NOTIF_COL = db.collection("whNotifications");

const ROLE_LABELS = {
  admin: "أدمن", financial_manager: "مدير مالي", accountant: "محاسب",
  branch_manager: "مدير فرع", cashier: "كاشير", custody_holder: "أمين عهدة",
};
/* صلاحيات المستودع مبنية على نفس أدوار تطبيق الكاشير: الأدمن = تحكم كامل، مدير الفرع/الكاشير = يطلبوا بضاعة لفرعهم بس */
function canManageWarehouse(role) { return role === "admin"; }
function canRequestForBranch(role) { return ["admin", "branch_manager", "cashier"].includes(role); }

/* ============ توليد QR لصنف (يشفّر كود الصنف فقط) — بيستخدم مكتبة qrcode-generator الموثوقة، بيرسم كصورة data URL ============ */
function ItemQRCode({ code, size = 110 }) {
  const [dataUrl, setDataUrl] = useState("");
  useEffect(() => {
    if (window.qrcode && code) {
      try {
        const qr = window.qrcode(0, "M");
        qr.addData(String(code));
        qr.make();
        const cellSize = Math.max(2, Math.floor(size / qr.getModuleCount()));
        setDataUrl(qr.createDataURL(cellSize, 4));
      } catch (e) { setDataUrl(""); }
    }
  }, [code, size]);
  if (!dataUrl) return <div style={{ width: size, height: size, background: "#f3f4f6", borderRadius: 6 }} />;
  return <img src={dataUrl} alt="QR" style={{ width: size, height: size }} />;
}

/* ============ ماسح كاميرا حي لقراءة كود الصنف — بيستخدم مكتبة html5-qrcode، بيفتح الكاميرا مباشرة من المتصفح ============ */
function CameraScanner({ onScan, onClose }) {
  const regionId = "qr-scan-region-" + useRef(uid()).current;
  const scannerRef = useRef(null);
  const [error, setError] = useState("");

  useEffect(() => {
    let stopped = false;
    const scanner = new Html5Qrcode(regionId);
    scannerRef.current = scanner;
    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 230, height: 230 } },
      (decodedText) => {
        if (stopped) return;
        stopped = true;
        scanner.stop().catch(() => {}).finally(() => onScan(decodedText));
      },
      () => {}
    ).catch((e) => setError("تعذر فتح الكاميرا: " + (e.message || e) + " — تأكد من السماح بالوصول للكاميرا من إعدادات المتصفح"));

    return () => {
      if (!stopped) scanner.stop().catch(() => {});
    };
    // eslint-disable-next-line
  }, []);

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(8,15,35,0.92)", zIndex: 1000,
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20,
    }}>
      <div style={{ color: "#fff", fontWeight: 700, marginBottom: 14, fontSize: 15 }}>📷 وجّه الكاميرا على كود الصنف</div>
      <div id={regionId} style={{ width: 280, maxWidth: "90vw", borderRadius: 14, overflow: "hidden" }} />
      {error && <div style={{ color: "#fca5a5", marginTop: 14, fontSize: 13, textAlign: "center", maxWidth: 320 }}>{error}</div>}
      <button onClick={onClose} style={{ ...ghostBtn, marginTop: 20, background: "#fff" }}>إلغاء</button>
    </div>
  );
}

/* ============ شاشة تسجيل الدخول — نفس حسابات تطبيق الكاشير بالظبط ============ */
function LoginScreen({ users, onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  function submit(e) {
    e.preventDefault();
    const u = users.find((x) => x.username.trim() === username.trim() && x.password === password);
    if (!u) { setError("اسم المستخدم أو كلمة المرور غير صحيحة"); return; }
    onLogin(u);
  }

  return (
    <div style={{
      minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
      background: "radial-gradient(circle at 20% 20%, #1d4ed8 0%, #0f2557 45%, #081633 100%)", padding: 16,
    }}>
      <form onSubmit={submit} style={{ background: "#fff", borderRadius: 20, padding: "40px 32px", width: 360, boxShadow: "0 30px 70px rgba(3,10,30,0.5)" }}>
        <div style={{ textAlign: "center", marginBottom: 26 }}>
          <div style={{
            width: 60, height: 60, borderRadius: 16, margin: "0 auto 14px", background: "linear-gradient(135deg,#1d4ed8,#0f2557)",
            display: "flex", alignItems: "center", justifyContent: "center", fontSize: 27,
          }}>📦</div>
          <h2 style={{ margin: "4px 0 4px", color: C.navy, fontSize: 19, fontWeight: 800 }}>نظام إدارة المستودع</h2>
          <div style={{ color: C.muted, fontSize: 13 }}>نفس بيانات دخولك في نظام الكاشير</div>
        </div>
        <label style={smallLabel}>اسم المستخدم</label>
        <input value={username} onChange={(e) => setUsername(e.target.value)} style={{ ...inputStyle2, marginBottom: 14 }} autoFocus />
        <label style={smallLabel}>كلمة المرور</label>
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} style={{ ...inputStyle2, marginBottom: 6 }} />
        {error && <div style={{ color: C.danger, fontSize: 13, marginTop: 6 }}>⚠️ {error}</div>}
        <button type="submit" style={{ ...smallBtn, marginTop: 16, width: "100%", padding: "12px 0", fontSize: 15 }}>دخول</button>
      </form>
    </div>
  );
}

const DEFAULT_UNITS = ["كيلو", "جرام", "لتر", "مل", "قطعة", "كرتون", "علبة", "كيس", "دستة"];
function branchStockDocId(branch, itemId) { return branch + "__" + itemId; }

/* ============ شاشة إدارة الأصناف: إضافة/تعديل صنف بكوده وسعره وحده الأدنى — ثنائية اللغة ============ */
function ItemsTab({ currentUser, lang, t, whMeta }) {
  const [items, setItems] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyItem());
  const [search, setSearch] = useState("");
  const [msg, setMsg] = useState("");
  const [showScanner, setShowScanner] = useState(false);
  const [qrItem, setQrItem] = useState(null);
  const [importing, setImporting] = useState(false);
  const [importErrors, setImportErrors] = useState([]);
  const [importSummary, setImportSummary] = useState("");
  const fileInputRef = useRef(null);

  function emptyItem() { return { nameAr: "", nameEn: "", sku: "", unit: "قطعة", price: "", minStock: "", category: "", qty: 0 }; }

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => {
      setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, []);

  function set(key, val) { setForm((f) => ({ ...f, [key]: val })); }

  // أعمدة ملف Excel (نفس الترتيب للتصدير والاستيراد)
  const EXPORT_HEADERS = [
    { key: "nameAr", labelAr: "اسم الصنف (عربي)", labelEn: "Item name (Arabic)" },
    { key: "nameEn", labelAr: "اسم الصنف (إنجليزي)", labelEn: "Item name (English)" },
    { key: "sku", labelAr: "الكود", labelEn: "Code" },
    { key: "unit", labelAr: "وحدة القياس", labelEn: "Unit" },
    { key: "price", labelAr: "السعر", labelEn: "Price" },
    { key: "minStock", labelAr: "الحد الأدنى", labelEn: "Min stock" },
    { key: "category", labelAr: "الفئة", labelEn: "Category" },
    { key: "qty", labelAr: "الرصيد الحالي (للعرض فقط، متغيّرش)", labelEn: "Current qty (read-only, don't edit)" },
  ];

  function exportExcel() {
    const headerRow = EXPORT_HEADERS.map((h) => lang === "ar" ? h.labelAr : h.labelEn);
    const rows = (items || []).map((it) => EXPORT_HEADERS.map((h) => it[h.key] ?? ""));
    const ws = window.XLSX.utils.aoa_to_sheet([headerRow, ...rows]);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, "Items");
    window.XLSX.writeFile(wb, "warehouse-items.xlsx");
  }
  function downloadTemplate() {
    const headerRow = EXPORT_HEADERS.filter((h) => h.key !== "qty").map((h) => lang === "ar" ? h.labelAr : h.labelEn);
    const ws = window.XLSX.utils.aoa_to_sheet([headerRow]);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, "Template");
    window.XLSX.writeFile(wb, "warehouse-items-template.xlsx");
  }

  function buildErrorMailto(errors) {
    if (!currentUser.email) return null;
    const subject = t(`أخطاء استيراد أصناف المستودع (${errors.length})`, `Warehouse items import errors (${errors.length})`);
    const body = errors.map((e) => `${t("صف", "Row")} ${e.row}: ${e.reason}`).join("\n");
    return "mailto:" + currentUser.email + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }

  async function importExcel(file) {
    setImporting(true); setImportErrors([]); setImportSummary("");
    try {
      const buf = await file.arrayBuffer();
      const wb = window.XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false });
      const dataRows = rows.slice(1); // تجاهل صف العناوين

      let added = 0, updated = 0;
      const errors = [];
      for (let i = 0; i < dataRows.length; i++) {
        const r = dataRows[i];
        const rowNum = i + 2; // رقم الصف الحقيقي في الملف (1 = العناوين)
        const nameAr = String(r[0] || "").trim();
        const nameEn = String(r[1] || "").trim();
        const sku = String(r[2] || "").trim();
        const unit = String(r[3] || "").trim() || "قطعة";
        const price = Number(r[4]) || 0;
        const minStock = Number(r[5]) || 0;
        const category = String(r[6] || "").trim();

        if (!nameAr && !nameEn) { errors.push({ row: rowNum, reason: t("الصف فاضي من اسم الصنف (عربي أو إنجليزي)", "Row is missing item name (Arabic or English)") }); continue; }
        try {
          const existing = sku ? (items || []).find((it) => it.sku === sku) : null;
          if (existing) {
            await ITEMS_COL.doc(existing.id).update({ nameAr, nameEn, unit, price, minStock, category });
            updated++;
          } else {
            await ITEMS_COL.add({
              nameAr, nameEn, sku: sku || uid().toUpperCase(), unit, price, minStock, category,
              qty: 0, institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
            added++;
          }
        } catch (e) {
          errors.push({ row: rowNum, reason: e.message });
        }
      }
      setImportErrors(errors);
      setImportSummary(t(`تم الاستيراد: ${added} صنف جديد، ${updated} صنف اتحدّث` + (errors.length ? `، ${errors.length} صف فيه خطأ` : ""), `Import done: ${added} new, ${updated} updated` + (errors.length ? `, ${errors.length} row(s) with errors` : "")));
    } catch (e) {
      setImportErrors([{ row: "—", reason: t("تعذر قراءة الملف: ", "Could not read file: ") + e.message }]);
    }
    setImporting(false);
  }

  async function save() {
    if (!form.nameAr.trim() && !form.nameEn.trim()) { setMsg(t("اكتب اسم الصنف بالعربي أو الإنجليزي", "Enter the item name in Arabic or English")); return; }
    const code = form.sku.trim() || uid().toUpperCase();
    try {
      if (editingId) {
        await ITEMS_COL.doc(editingId).update({
          nameAr: form.nameAr.trim(), nameEn: form.nameEn.trim(), sku: code, unit: form.unit,
          price: Number(form.price) || 0, minStock: Number(form.minStock) || 0, category: form.category.trim(),
        });
        setMsg(t("✅ تم تحديث الصنف", "✅ Item updated"));
      } else {
        await ITEMS_COL.add({
          nameAr: form.nameAr.trim(), nameEn: form.nameEn.trim(), sku: code, unit: form.unit,
          price: Number(form.price) || 0, minStock: Number(form.minStock) || 0, category: form.category.trim(),
          qty: 0, institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        setMsg(t("✅ تم إضافة الصنف — سجّل أول كمية وارد من تبويب \"وارد للمستودع\"", "✅ Item added — record first stock-in from the \"Stock In\" tab"));
      }
      setForm(emptyItem()); setEditingId(null);
    } catch (e) { setMsg("Error: " + e.message); }
  }

  function editItem(it) {
    setForm({ nameAr: it.nameAr || "", nameEn: it.nameEn || "", sku: it.sku || "", unit: it.unit || "قطعة", price: it.price || "", minStock: it.minStock || "", category: it.category || "" });
    setEditingId(it.id);
  }
  async function removeItem(it) {
    if (!confirm(t(`حذف الصنف "${it.nameAr}"؟`, `Delete item "${it.nameEn || it.nameAr}"?`))) return;
    await ITEMS_COL.doc(it.id).delete();
  }

  const filtered = (items || []).filter((it) => {
    const s = search.trim().toLowerCase();
    if (!s) return true;
    return (it.nameAr || "").toLowerCase().includes(s) || (it.nameEn || "").toLowerCase().includes(s) || (it.sku || "").toLowerCase().includes(s);
  });

  function onScanFound(code) {
    setShowScanner(false);
    const found = (items || []).find((it) => it.sku === code);
    if (found) { editItem(found); setMsg(t("تم العثور على الصنف بالمسح", "Item found by scan")); }
    else { setMsg(t("الكود ده مش مسجّل لأي صنف", "This code isn't registered to any item")); }
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>{editingId ? t("✏️ تعديل صنف", "✏️ Edit item") : t("➕ صنف جديد", "➕ New item")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>{t("اسم الصنف (عربي)", "Item name (Arabic)")}</label>
            <input value={form.nameAr} onChange={(e) => set("nameAr", e.target.value)} style={inputStyle2} placeholder="بن قهوة عربي" />
          </div>
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>{t("اسم الصنف (إنجليزي)", "Item name (English)")}</label>
            <input value={form.nameEn} onChange={(e) => set("nameEn", e.target.value)} style={inputStyle2} placeholder="Arabic Coffee Beans" />
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>{t("كود الصنف (اختياري)", "Item code (optional)")}</label>
            <div style={{ display: "flex", gap: 6 }}>
              <input value={form.sku} onChange={(e) => set("sku", e.target.value)} style={inputStyle2} placeholder={t("سيتولّد تلقائيًا", "Auto-generated")} />
              <button type="button" onClick={() => setShowScanner(true)} style={{ ...ghostBtn, padding: "0 12px" }}>📷</button>
            </div>
          </div>
          <div style={{ flex: "1 1 120px" }}>
            <label style={smallLabel}>{t("وحدة القياس", "Unit")}</label>
            <select value={form.unit} onChange={(e) => set("unit", e.target.value)} style={inputStyle2}>
              {(whMeta.units || DEFAULT_UNITS).map((u) => <option key={u} value={u}>{u}</option>)}
            </select>
          </div>
          <div style={{ flex: "1 1 130px" }}>
            <label style={smallLabel}>{t("سعر الوحدة (ر.س)", "Unit price (SAR)")}</label>
            <input type="number" step="0.01" value={form.price} onChange={(e) => set("price", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 130px" }}>
            <label style={smallLabel}>{t("حد أدنى للتنبيه", "Min stock alert")}</label>
            <input type="number" step="0.01" value={form.minStock} onChange={(e) => set("minStock", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 150px" }}>
            <label style={smallLabel}>{t("الفئة (اختياري)", "Category (optional)")}</label>
            <input value={form.category} onChange={(e) => set("category", e.target.value)} style={inputStyle2} />
          </div>
        </div>
        <div style={{ marginTop: 14, display: "flex", gap: 10, alignItems: "center" }}>
          <button onClick={save} style={smallBtn}>{editingId ? t("💾 حفظ التعديل", "💾 Save changes") : t("➕ إضافة الصنف", "➕ Add item")}</button>
          {editingId && <button onClick={() => { setForm(emptyItem()); setEditingId(null); }} style={ghostBtn}>{t("إلغاء", "Cancel")}</button>}
          {msg && <span style={{ fontSize: 13, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</span>}
        </div>
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>📊 {t("تصدير واستيراد الأصناف عبر Excel", "Export/Import items via Excel")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>
          {t("حمّل نموذج فاضي، عبّيه بالأصناف اللي تحبها، وارفعه تاني — أي كود موجود مسبقًا هيتحدّث، وأي كود جديد هيتضاف كصنف جديد.", "Download an empty template, fill it in, then upload it back — existing codes update, new codes get added as new items.")}
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
          <button onClick={downloadTemplate} style={ghostBtn}>📄 {t("تحميل نموذج فاضي", "Download empty template")}</button>
          <button onClick={exportExcel} style={ghostBtn}>⬇️ {t("تصدير كل الأصناف الحالية", "Export all current items")}</button>
          <input type="file" accept=".xlsx,.xls" ref={fileInputRef} style={{ display: "none" }}
            onChange={(e) => { if (e.target.files[0]) importExcel(e.target.files[0]); e.target.value = ""; }} />
          <button onClick={() => fileInputRef.current?.click()} disabled={importing} style={smallBtn}>
            {importing ? t("جارِ الاستيراد...", "Importing...") : "⬆️ " + t("رفع ملف Excel معبّى", "Upload filled Excel file")}
          </button>
        </div>
        {importSummary && <div style={{ marginTop: 12, fontSize: 13.5, fontWeight: 700, color: importErrors.length ? C.warn : C.success }}>{importSummary}</div>}
        {importErrors.length > 0 && (
          <div style={{ marginTop: 10, background: "#fef2f2", border: "1px solid #fecaca", borderRadius: 10, padding: "12px 14px" }}>
            <div style={{ fontWeight: 700, color: C.danger, marginBottom: 8, fontSize: 13 }}>⚠️ {t("أخطاء أثناء الاستيراد", "Errors during import")}:</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 10 }}>
              {importErrors.map((e, i) => (
                <div key={i} style={{ fontSize: 12.5, color: "#991b1b" }}>{t("صف", "Row")} {e.row}: {e.reason}</div>
              ))}
            </div>
            {currentUser.email ? (
              <a href={buildErrorMailto(importErrors)} style={{
                display: "inline-flex", alignItems: "center", gap: 6, background: C.blue, color: "#fff",
                borderRadius: 20, padding: "6px 14px", fontSize: 12.5, fontWeight: 700, textDecoration: "none",
              }}>📧 {t("راسلني بتفاصيل الأخطاء دي", "Email me these error details")}</a>
            ) : (
              <div style={{ fontSize: 11.5, color: C.muted }}>{t("ملاحظة: أضف إيميلك في نظام الكاشير (إدارة المستخدمين) عشان يظهر زرار المراسلة هنا.", "Note: add your email in the cashier system (user management) to enable the email button here.")}</div>
            )}
          </div>
        )}
      </div>

      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
          <div style={{ ...cardTitle, marginBottom: 0, border: "none", padding: 0 }}>📋 {t("كل الأصناف", "All items")} ({(items || []).length})</div>
          <input value={search} onChange={(e) => setSearch(e.target.value)} style={{ ...inputStyle2, maxWidth: 240 }} placeholder={t("بحث بالاسم أو الكود...", "Search name or code...")} />
        </div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr>
              <th style={th}>{t("الاسم", "Name")}</th><th style={th}>{t("الكود", "Code")}</th><th style={th}>{t("الوحدة", "Unit")}</th>
              <th style={th}>{t("السعر", "Price")}</th><th style={th}>{t("الرصيد الحالي", "Current qty")}</th><th style={th}>{t("قيمة المخزون", "Stock value")}</th>
              <th style={th}>QR</th><th style={th}></th>
            </tr></thead>
            <tbody>
              {filtered.map((it) => {
                const low = it.minStock > 0 && (it.qty || 0) <= it.minStock;
                return (
                  <tr key={it.id} style={{ background: low ? "#fef2f2" : undefined }}>
                    <td style={td}>
                      <div style={{ fontWeight: 700 }}>{lang === "ar" ? (it.nameAr || it.nameEn) : (it.nameEn || it.nameAr)}</div>
                      {it.category && <div style={{ fontSize: 11, color: C.muted }}>{it.category}</div>}
                    </td>
                    <td style={td}>{it.sku}</td>
                    <td style={td}>{it.unit}</td>
                    <td style={td}>{fmt(it.price)}</td>
                    <td style={{ ...td, fontWeight: 800, color: low ? C.danger : C.navy }}>{fmt(it.qty)} {low && "⚠️"}</td>
                    <td style={td}>{fmt((it.qty || 0) * (it.price || 0))}</td>
                    <td style={td}><span onClick={() => setQrItem(it)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700 }}>{t("عرض/طباعة", "View/Print")}</span></td>
                    <td style={td}>
                      <span onClick={() => editItem(it)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700, marginLeft: 10 }}>{t("تعديل", "Edit")}</span>
                      <span onClick={() => removeItem(it)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700 }}>{t("حذف", "Delete")}</span>
                    </td>
                  </tr>
                );
              })}
              {filtered.length === 0 && <tr><td colSpan={8} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد أصناف", "No items")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {showScanner && <CameraScanner onScan={onScanFound} onClose={() => setShowScanner(false)} />}
      {qrItem && <ItemLabelModal item={qrItem} lang={lang} t={t} onClose={() => setQrItem(null)} />}
    </div>
  );
}

/* ============ شاشة الإعدادات: إدارة الفروع (مشتركة مع الكاشير) ووحدات القياس ============ */
function WarehouseSettingsTab({ meta, whMeta, t }) {
  const [newBranch, setNewBranch] = useState("");
  const [newUnit, setNewUnit] = useState("");
  const [msg, setMsg] = useState("");

  async function addBranch() {
    const name = newBranch.trim();
    if (!name) return;
    if ((meta.branches || []).includes(name)) { setMsg(t("الفرع ده موجود بالفعل", "Branch already exists")); return; }
    await META_DOC.update({ branches: firebase.firestore.FieldValue.arrayUnion(name) });
    setNewBranch(""); setMsg("✅ " + t("تمت إضافة الفرع", "Branch added"));
  }
  async function removeBranch(name) {
    if (!confirm(t(`حذف فرع "${name}"؟`, `Delete branch "${name}"?`))) return;
    await META_DOC.update({ branches: firebase.firestore.FieldValue.arrayRemove(name) });
  }

  async function addUnit() {
    const name = newUnit.trim();
    if (!name) return;
    const current = whMeta.units || DEFAULT_UNITS;
    if (current.includes(name)) { setMsg(t("وحدة القياس دي موجودة بالفعل", "Unit already exists")); return; }
    await WH_META_DOC.set({ units: firebase.firestore.FieldValue.arrayUnion(name) }, { merge: true });
    setNewUnit(""); setMsg("✅ " + t("تمت إضافة وحدة القياس", "Unit added"));
  }
  async function removeUnit(name) {
    if (!confirm(t(`حذف وحدة "${name}"؟`, `Delete unit "${name}"?`))) return;
    const current = whMeta.units || DEFAULT_UNITS;
    await WH_META_DOC.set({ units: current.filter((u) => u !== name) }, { merge: true });
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>🏬 {t("إدارة الفروع", "Manage Branches")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("نفس الفروع المستخدمة في نظام الكاشير — أي تعديل هنا بينعكس هناك كمان", "Same branches used in the cashier system — changes here reflect there too")}</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          {(meta.branches || []).map((b) => (
            <div key={b} style={{ background: C.blueSoft, borderRadius: 20, padding: "6px 12px", fontSize: 13.5, display: "flex", alignItems: "center", gap: 8, color: C.navy, fontWeight: 600 }}>
              {b}<span onClick={() => removeBranch(b)} style={{ cursor: "pointer", color: C.danger, fontWeight: 800 }}>×</span>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={newBranch} onChange={(e) => setNewBranch(e.target.value)} style={{ ...inputStyle2, maxWidth: 240 }} placeholder={t("اسم الفرع الجديد", "New branch name")} />
          <button onClick={addBranch} style={smallBtn}>➕ {t("إضافة", "Add")}</button>
        </div>
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>📏 {t("وحدات القياس", "Units of Measure")}</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          {(whMeta.units || DEFAULT_UNITS).map((u) => (
            <div key={u} style={{ background: C.blueSoft, borderRadius: 20, padding: "6px 12px", fontSize: 13.5, display: "flex", alignItems: "center", gap: 8, color: C.navy, fontWeight: 600 }}>
              {u}<span onClick={() => removeUnit(u)} style={{ cursor: "pointer", color: C.danger, fontWeight: 800 }}>×</span>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={newUnit} onChange={(e) => setNewUnit(e.target.value)} style={{ ...inputStyle2, maxWidth: 240 }} placeholder={t("وحدة قياس جديدة (مثال: طن)", "New unit (e.g. Ton)")} />
          <button onClick={addUnit} style={smallBtn}>➕ {t("إضافة", "Add")}</button>
        </div>
        {msg && <div style={{ marginTop: 10, fontSize: 13, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
      </div>
    </div>
  );
}

/* ============ منتقي صنف بالبحث أو مسح الكاميرا — مستخدم في الوارد/الصادر/الجرد ============ */
function ItemPicker({ items, lang, t, onPick, selectedItem }) {
  const [search, setSearch] = useState("");
  const [showScanner, setShowScanner] = useState(false);
  const filtered = items.filter((it) => {
    const s = search.trim().toLowerCase();
    if (!s) return false;
    return (it.nameAr || "").toLowerCase().includes(s) || (it.nameEn || "").toLowerCase().includes(s) || (it.sku || "").toLowerCase().includes(s);
  }).slice(0, 8);

  function onScanFound(code) {
    setShowScanner(false);
    const found = items.find((it) => it.sku === code);
    if (found) onPick(found);
    else alert(t("الكود ده مش مسجّل لأي صنف", "This code isn't registered to any item"));
  }

  return (
    <div>
      <label style={smallLabel}>{t("اختر الصنف (اكتب أو امسح بالكاميرا)", "Choose item (type or scan)")}</label>
      <div style={{ display: "flex", gap: 6, position: "relative" }}>
        <input value={selectedItem ? (lang === "ar" ? (selectedItem.nameAr || selectedItem.nameEn) : (selectedItem.nameEn || selectedItem.nameAr)) : search}
          onChange={(e) => { setSearch(e.target.value); onPick(null); }} style={inputStyle2}
          placeholder={t("اكتب اسم الصنف...", "Type item name...")} />
        <button type="button" onClick={() => setShowScanner(true)} style={{ ...smallBtn, padding: "0 16px" }}>📷</button>
        {!selectedItem && search && filtered.length > 0 && (
          <div style={{ position: "absolute", top: "100%", right: 0, left: 60, background: "#fff", border: "1px solid " + C.border, borderRadius: 8, marginTop: 4, zIndex: 10, boxShadow: "0 8px 20px rgba(0,0,0,0.1)" }}>
            {filtered.map((it) => (
              <div key={it.id} onClick={() => { onPick(it); setSearch(""); }} style={{ padding: "8px 12px", cursor: "pointer", fontSize: 13, borderBottom: "1px solid " + C.border }}>
                <div style={{ fontWeight: 700 }}>{lang === "ar" ? (it.nameAr || it.nameEn) : (it.nameEn || it.nameAr)}</div>
                <div style={{ fontSize: 11, color: C.muted }}>{it.sku} — {t("الرصيد", "Qty")}: {fmt(it.qty)}</div>
              </div>
            ))}
          </div>
        )}
      </div>
      {showScanner && <CameraScanner onScan={onScanFound} onClose={() => setShowScanner(false)} />}
    </div>
  );
}

/* ============ شاشة وارد للمستودع (استلام بضاعة) ============ */
function StockInTab({ currentUser, lang, t }) {
  const [items, setItems] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [selectedItem, setSelectedItem] = useState(null);
  const [qty, setQty] = useState("");
  const [unitCost, setUnitCost] = useState("");
  const [supplierName, setSupplierName] = useState("");
  const [taxNumber, setTaxNumber] = useState("");
  const [invoiceNo, setInvoiceNo] = useState("");
  const [note, setNote] = useState("");
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const [recent, setRecent] = useState([]);

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = SUPPLIERS_COL.orderBy("name").onSnapshot((snap) => setSuppliers(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = MOVES_COL.where("type", "==", "in").orderBy("createdAt", "desc").limit(15).onSnapshot(
      (snap) => setRecent(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      () => {
        MOVES_COL.orderBy("createdAt", "desc").limit(60).onSnapshot((snap) => {
          setRecent(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((m) => m.type === "in").slice(0, 15));
        });
      }
    );
    return unsub;
  }, []);

  useEffect(() => { if (selectedItem && !unitCost) setUnitCost(selectedItem.price || ""); }, [selectedItem]);

  function onSupplierNameChange(val) {
    setSupplierName(val);
    const found = suppliers.find((s) => s.name === val);
    if (found) setTaxNumber(found.taxNumber || "");
  }

  async function submit() {
    const q = Number(qty);
    const cost = Number(unitCost) || 0;
    if (!selectedItem) { setMsg(t("اختر الصنف أولًا", "Choose an item first")); return; }
    if (!q || q <= 0) { setMsg(t("أدخل كمية صحيحة أكبر من صفر", "Enter a quantity greater than zero")); return; }
    setSaving(true); setMsg("");
    try {
      if (supplierName.trim()) {
        const exists = suppliers.find((s) => s.name === supplierName.trim());
        if (!exists) await SUPPLIERS_COL.add({ name: supplierName.trim(), taxNumber: taxNumber.trim(), institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      }
      const purchaseValue = q * cost;
      const vatAmount = purchaseValue * 0.15;
      await db.runTransaction(async (tx) => {
        const ref = ITEMS_COL.doc(selectedItem.id);
        const snap = await tx.get(ref);
        const curQty = Number(snap.data().qty) || 0;
        tx.update(ref, { qty: curQty + q });
        tx.set(MOVES_COL.doc(), {
          itemId: selectedItem.id, itemName: selectedItem.nameAr, itemNameEn: selectedItem.nameEn, unit: selectedItem.unit,
          type: "in", qty: q, unitCost: cost, purchaseValue, vatAmount, date: todayStr(),
          supplierName: supplierName.trim(), taxNumber: taxNumber.trim(), invoiceNo: invoiceNo.trim(),
          paymentStatus: "unpaid", paidAmount: 0,
          note: note.trim(), enteredBy: currentUser.name, institutionId: DEFAULT_INSTITUTION_ID,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      });
      setMsg("✅ " + t(`تم إضافة ${fmt(q)} ${selectedItem.unit} للمخزون`, `Added ${fmt(q)} ${selectedItem.unit} to stock`));
      setSelectedItem(null); setQty(""); setUnitCost(""); setSupplierName(""); setTaxNumber(""); setInvoiceNo(""); setNote("");
    } catch (e) { setMsg("Error: " + e.message); }
    setSaving(false);
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>📥 {t("وارد للمستودع (استلام بضاعة)", "Stock In (Goods Receipt)")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ flex: "1 1 260px" }}>
            <ItemPicker items={items} lang={lang} t={t} onPick={setSelectedItem} selectedItem={selectedItem} />
          </div>
          <div style={{ flex: "1 1 110px" }}>
            <label style={smallLabel}>{t("الكمية", "Quantity")} {selectedItem && `(${selectedItem.unit})`}</label>
            <input type="number" step="0.01" value={qty} onChange={(e) => setQty(e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 130px" }}>
            <label style={smallLabel}>{t("تكلفة الوحدة", "Unit cost")}</label>
            <input type="number" step="0.01" value={unitCost} onChange={(e) => setUnitCost(e.target.value)} style={inputStyle2} />
          </div>
        </div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end", marginTop: 12 }}>
          <div style={{ flex: "1 1 180px", position: "relative" }}>
            <label style={smallLabel}>{t("اسم المورد", "Supplier name")}</label>
            <input value={supplierName} onChange={(e) => onSupplierNameChange(e.target.value)} style={inputStyle2} list="wh-suppliers-list" />
            <datalist id="wh-suppliers-list">
              {suppliers.map((s) => <option key={s.id} value={s.name} />)}
            </datalist>
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>{t("الرقم الضريبي للمورد", "Supplier tax number")}</label>
            <input value={taxNumber} onChange={(e) => setTaxNumber(e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 140px" }}>
            <label style={smallLabel}>{t("رقم الفاتورة", "Invoice number")}</label>
            <input value={invoiceNo} onChange={(e) => setInvoiceNo(e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 180px" }}>
            <label style={smallLabel}>{t("ملاحظة (اختياري)", "Note (optional)")}</label>
            <input value={note} onChange={(e) => setNote(e.target.value)} style={inputStyle2} />
          </div>
          <button onClick={submit} disabled={saving} style={smallBtn}>{saving ? t("جارِ الحفظ...", "Saving...") : "💾 " + t("تسجيل الوارد", "Record receipt")}</button>
        </div>
        {qty && unitCost && (
          <div style={{ marginTop: 10, fontSize: 12.5, color: C.muted }}>
            {t("قيمة الفاتورة (قبل الضريبة):", "Invoice value (before VAT):")} {fmt(Number(qty) * Number(unitCost))} — {t("الضريبة 15%:", "15% VAT:")} {fmt(Number(qty) * Number(unitCost) * 0.15)} — {t("الإجمالي:", "Total:")} {fmt(Number(qty) * Number(unitCost) * 1.15)}
          </div>
        )}
        {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>🕒 {t("آخر عمليات الوارد", "Recent stock-in entries")}</div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكمية", "Qty")}</th><th style={th}>{t("المورد", "Supplier")}</th><th style={th}>{t("الفاتورة", "Invoice")}</th><th style={th}>{t("بواسطة", "By")}</th></tr></thead>
            <tbody>
              {recent.map((m) => (
                <tr key={m.id}><td style={td}>{m.date}</td><td style={td}>{m.itemName}</td><td style={{ ...td, color: C.success, fontWeight: 700 }}>+{fmt(m.qty)}</td><td style={td}>{m.supplierName || "—"}</td><td style={td}>{m.invoiceNo || "—"}</td><td style={td}>{m.enteredBy}</td></tr>
              ))}
              {recent.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد بعد", "None yet")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============ شاشة صرف للفروع (صادر) — بتسمح بصرف أكتر من المتاح مع تنبيه واضح، والقرار يبقى للمستخدم ============ */
function StockOutTab({ currentUser, meta, lang, t, institutionName }) {
  const [items, setItems] = useState([]);
  const [selectedItem, setSelectedItem] = useState(null);
  const [qty, setQty] = useState("");
  const [branch, setBranch] = useState("");
  const [note, setNote] = useState("");
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const [freshVoucher, setFreshVoucher] = useState(null);

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => { if (!branch && meta.branches?.length) setBranch(meta.branches[0]); }, [meta.branches]);

  const availableQty = selectedItem ? Number(selectedItem.qty) || 0 : null;
  const exceeds = selectedItem && Number(qty) > availableQty;

  async function submit() {
    const q = Number(qty);
    if (!selectedItem) { setMsg(t("اختر الصنف أولًا", "Choose an item first")); return; }
    if (!q || q <= 0) { setMsg(t("أدخل كمية صحيحة أكبر من صفر", "Enter a quantity greater than zero")); return; }
    if (!branch) { setMsg(t("اختر الفرع المستلم", "Choose the receiving branch")); return; }
    if (exceeds && !confirm(t(
      `المتاح فعليًا ${fmt(availableQty)} بس، وأنت بتصرف ${fmt(q)}. هيصبح الرصيد سالب. متأكد تكمّل؟`,
      `Only ${fmt(availableQty)} available, but you're issuing ${fmt(q)}. Stock will go negative. Continue?`
    ))) return;

    setSaving(true); setMsg("");
    try {
      let moveId;
      const bsRef = BRANCH_STOCK_COL.doc(branchStockDocId(branch, selectedItem.id));
      await db.runTransaction(async (tx) => {
        const ref = ITEMS_COL.doc(selectedItem.id);
        const snap = await tx.get(ref);
        const curQty = Number(snap.data().qty) || 0;
        tx.update(ref, { qty: curQty - q });

        const bsSnap = await tx.get(bsRef);
        const curBranchQty = bsSnap.exists ? (Number(bsSnap.data().qty) || 0) : 0;
        tx.set(bsRef, { branch, itemId: selectedItem.id, itemName: selectedItem.nameAr, qty: curBranchQty + q, institutionId: DEFAULT_INSTITUTION_ID }, { merge: true });

        const moveRef = MOVES_COL.doc();
        moveId = moveRef.id;
        tx.set(moveRef, {
          itemId: selectedItem.id, itemName: selectedItem.nameAr, itemNameEn: selectedItem.nameEn, unit: selectedItem.unit,
          price: selectedItem.price, type: "out", qty: q, branch, date: todayStr(),
          note: note.trim(), enteredBy: currentUser.name, institutionId: DEFAULT_INSTITUTION_ID,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      });
      setMsg("✅ " + t(`تم صرف ${fmt(q)} ${selectedItem.unit} لفرع ${branch}`, `Issued ${fmt(q)} ${selectedItem.unit} to ${branch}`));
      setFreshVoucher({ id: moveId, itemName: selectedItem.nameAr, itemNameEn: selectedItem.nameEn, unit: selectedItem.unit, qty: q, price: selectedItem.price, branch, date: todayStr(), note, enteredBy: currentUser.name });
      setSelectedItem(null); setQty(""); setNote("");
    } catch (e) { setMsg("Error: " + e.message); }
    setSaving(false);
  }

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={cardTitle}>📤 {t("صرف بضاعة لفرع", "Issue Goods to Branch")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ flex: "1 1 260px" }}>
            <ItemPicker items={items} lang={lang} t={t} onPick={setSelectedItem} selectedItem={selectedItem} />
          </div>
          <div style={{ flex: "1 1 130px" }}>
            <label style={smallLabel}>{t("الكمية", "Quantity")} {selectedItem && `(${selectedItem.unit})`}</label>
            <input type="number" step="0.01" value={qty} onChange={(e) => setQty(e.target.value)} style={{ ...inputStyle2, borderColor: exceeds ? C.warn : C.border }} />
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>{t("الفرع المستلم", "Receiving branch")}</label>
            <select value={branch} onChange={(e) => setBranch(e.target.value)} style={inputStyle2}>
              {(meta.branches || []).map((b) => <option key={b} value={b}>{b}</option>)}
            </select>
          </div>
          <div style={{ flex: "1 1 180px" }}>
            <label style={smallLabel}>{t("ملاحظة (اختياري)", "Note (optional)")}</label>
            <input value={note} onChange={(e) => setNote(e.target.value)} style={inputStyle2} />
          </div>
          <button onClick={submit} disabled={saving} style={smallBtn}>{saving ? t("جارِ الحفظ...", "Saving...") : "💾 " + t("تسجيل الصرف", "Record issue")}</button>
        </div>
        {selectedItem && (
          <div style={{ marginTop: 10, fontSize: 12.5, color: exceeds ? C.warn : C.muted }}>
            {exceeds ? "⚠️ " : ""}{t("المتاح فعليًا:", "Available:")} {fmt(availableQty)} {selectedItem.unit}
            {exceeds && " — " + t("الكمية المطلوبة أكبر من المتاح", "Requested quantity exceeds available stock")}
          </div>
        )}
        {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
      </div>

      {freshVoucher && <StockOutVoucher voucher={freshVoucher} institutionName={institutionName} lang={lang} t={t} onClose={() => setFreshVoucher(null)} />}
    </div>
  );
}

/* ============ شاشة جرد الفروع: تحديد الكمية الفعلية لكل صنف بفرع معيّن، ومقارنتها بالمتوقع، وإرسال إشعار نقص ============ */
function BranchCountTab({ currentUser, meta, lang, t }) {
  const [branch, setBranch] = useState("");
  const [branchStock, setBranchStock] = useState([]);
  const [counted, setCounted] = useState({}); // { itemId: countedQty }
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const [history, setHistory] = useState([]);

  useEffect(() => { if (!branch && meta.branches?.length) setBranch(meta.branches[0]); }, [meta.branches]);
  useEffect(() => {
    if (!branch) return;
    const unsub = BRANCH_STOCK_COL.where("branch", "==", branch).onSnapshot(
      (snap) => setBranchStock(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      () => { BRANCH_STOCK_COL.onSnapshot((snap) => setBranchStock(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((b) => b.branch === branch))); }
    );
    return unsub;
  }, [branch]);
  useEffect(() => {
    if (!branch) return;
    const unsub = COUNTS_COL.orderBy("createdAt", "desc").limit(20).onSnapshot(
      (snap) => setHistory(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((c) => c.branch === branch)),
      () => {}
    );
    return unsub;
  }, [branch]);

  function setCountedQty(itemId, val) { setCounted((c) => ({ ...c, [itemId]: val })); }

  async function submitCounts() {
    const toSubmit = branchStock.filter((b) => counted[b.itemId] !== undefined && counted[b.itemId] !== "");
    if (toSubmit.length === 0) { setMsg(t("أدخل كمية فعلية لصنف واحد على الأقل", "Enter a counted quantity for at least one item")); return; }
    setSaving(true); setMsg("");
    try {
      const shortages = [];
      for (const b of toSubmit) {
        const countedQty = Number(counted[b.itemId]) || 0;
        const systemQty = Number(b.qty) || 0;
        const diff = countedQty - systemQty;
        await COUNTS_COL.add({
          branch, itemId: b.itemId, itemName: b.itemName, systemQty, countedQty, diff, date: todayStr(),
          countedBy: currentUser.name, institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        await BRANCH_STOCK_COL.doc(b.id).update({ qty: countedQty }); // الجرد بيصحّح الرصيد ليبقى نقطة البداية الجديدة
        if (countedQty <= 0 || diff < -0.009) {
          shortages.push({ itemName: b.itemName, countedQty, diff });
        }
      }
      if (shortages.length > 0) {
        await WH_NOTIF_COL.add({
          type: "shortage", branch, items: shortages, date: todayStr(), createdBy: currentUser.name,
          institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(), readBy: [],
        });
      }
      setCounted({});
      setMsg("✅ " + t(`تم حفظ الجرد (${toSubmit.length} صنف)` + (shortages.length ? ` — ⚠️ ${shortages.length} صنف فيه نقص وتم إرسال إشعار` : ""), `Count saved (${toSubmit.length} items)` + (shortages.length ? ` — ⚠️ ${shortages.length} shortage(s) notified` : "")));
    } catch (e) { setMsg("Error: " + e.message); }
    setSaving(false);
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>🧮 {t("جرد الفروع", "Branch Stock Count")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("اختر الفرع، وسجّل الكمية الفعلية الموجودة عنده لكل صنف. أي نقص عن المتوقع بيتبعت كإشعار تلقائي.", "Choose the branch and record the actual counted quantity for each item. Any shortage below the expected amount triggers an automatic notification.")}</div>
        <div style={{ marginBottom: 14 }}>
          <label style={smallLabel}>{t("الفرع", "Branch")}</label>
          <select value={branch} onChange={(e) => { setBranch(e.target.value); setCounted({}); }} style={{ ...inputStyle2, maxWidth: 260 }}>
            {(meta.branches || []).map((b) => <option key={b} value={b}>{b}</option>)}
          </select>
        </div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("المتوقع (حسب النظام)", "Expected (system)")}</th><th style={th}>{t("الكمية الفعلية المجرودة", "Actual counted qty")}</th><th style={th}>{t("الفرق", "Diff")}</th></tr></thead>
            <tbody>
              {branchStock.map((b) => {
                const c = counted[b.itemId];
                const diff = c !== undefined && c !== "" ? Number(c) - Number(b.qty) : null;
                return (
                  <tr key={b.id}>
                    <td style={{ ...td, fontWeight: 700 }}>{b.itemName}</td>
                    <td style={td}>{fmt(b.qty)}</td>
                    <td style={td}><input type="number" step="0.01" value={c || ""} onChange={(e) => setCountedQty(b.itemId, e.target.value)} style={{ ...inputStyle2, width: 110 }} /></td>
                    <td style={{ ...td, fontWeight: 700, color: diff === null ? C.muted : diff < 0 ? C.danger : diff > 0 ? C.success : C.muted }}>{diff === null ? "—" : (diff > 0 ? "+" : "") + fmt(diff)}</td>
                  </tr>
                );
              })}
              {branchStock.length === 0 && <tr><td colSpan={4} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("مفيش أصناف اتصرفت لهذا الفرع بعد", "No items have been issued to this branch yet")}</td></tr>}
            </tbody>
          </table>
        </div>
        {branchStock.length > 0 && (
          <div style={{ marginTop: 14 }}>
            <button onClick={submitCounts} disabled={saving} style={smallBtn}>{saving ? t("جارِ الحفظ...", "Saving...") : "💾 " + t("حفظ الجرد", "Save count")}</button>
          </div>
        )}
        {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>🕒 {t("آخر عمليات الجرد لهذا الفرع", "Recent counts for this branch")}</div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("متوقع", "Expected")}</th><th style={th}>{t("فعلي", "Counted")}</th><th style={th}>{t("الفرق", "Diff")}</th><th style={th}>{t("بواسطة", "By")}</th></tr></thead>
            <tbody>
              {history.map((h) => (
                <tr key={h.id}>
                  <td style={td}>{h.date}</td><td style={td}>{h.itemName}</td><td style={td}>{fmt(h.systemQty)}</td><td style={td}>{fmt(h.countedQty)}</td>
                  <td style={{ ...td, fontWeight: 700, color: h.diff < 0 ? C.danger : h.diff > 0 ? C.success : C.muted }}>{h.diff > 0 ? "+" : ""}{fmt(h.diff)}</td>
                  <td style={td}>{h.countedBy}</td>
                </tr>
              ))}
              {history.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد جرد سابق", "No previous counts")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============ تقرير المخزون: القيمة الإجمالية + استهلاك كل فرع ============ */
function ReportsTab({ lang, t, institutionName }) {
  const [items, setItems] = useState([]);
  const [moves, setMoves] = useState([]);
  const [fromDate, setFromDate] = useState(new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0, 10));
  const [toDate, setToDate] = useState(todayStr());
  const [mode, setMode] = useState("stock"); // stock | branch | purchases | payments | vat
  const [branchFilter, setBranchFilter] = useState("all");
  const [meta, setMeta] = useState({ branches: [] });

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = MOVES_COL.orderBy("createdAt", "desc").limit(3000).onSnapshot((snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = META_DOC.onSnapshot((doc) => setMeta(doc.exists ? doc.data() : { branches: [] }));
    return unsub;
  }, []);

  const totalValue = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  const lowStockItems = items.filter((it) => it.minStock > 0 && (it.qty || 0) <= it.minStock);

  const rangeMoves = moves.filter((m) => m.date >= fromDate && m.date <= toDate);
  const rangeOutMoves = rangeMoves.filter((m) => m.type === "out" && (branchFilter === "all" || m.branch === branchFilter));
  const rangeInMoves = rangeMoves.filter((m) => m.type === "in");

  const byBranch = useMemo(() => {
    const map = {};
    rangeMoves.filter((m) => m.type === "out").forEach((m) => {
      const key = m.branch || "—";
      if (!map[key]) map[key] = { branch: key, qtyTotal: 0, valueTotal: 0, items: {} };
      map[key].qtyTotal += Number(m.qty) || 0;
      map[key].valueTotal += (Number(m.qty) || 0) * (Number(m.price) || 0);
      const itKey = m.itemName;
      map[key].items[itKey] = (map[key].items[itKey] || 0) + (Number(m.qty) || 0);
    });
    return Object.values(map).sort((a, b) => b.valueTotal - a.valueTotal);
    // eslint-disable-next-line
  }, [rangeMoves]);

  /* ============ تحليل ذكي إحصائي (بدون أي API خارجي) — أنماط استهلاك، فروع شاذة، أصناف قريبة من النفاد ============ */
  const smartInsights = useMemo(() => {
    const list = [];
    if (byBranch.length > 1) {
      const top = byBranch[0];
      const totalAll = byBranch.reduce((s, b) => s + b.valueTotal, 0);
      const pct = totalAll > 0 ? (top.valueTotal / totalAll) * 100 : 0;
      if (pct >= 40) list.push({ kind: "info", text: t(`فرع "${top.branch}" بياخد ${pct.toFixed(0)}% من إجمالي قيمة المسحوبات في هذه الفترة — تركّز عالي يستاهل مراجعة.`, `Branch "${top.branch}" accounts for ${pct.toFixed(0)}% of total withdrawn value this period — worth reviewing.`) });
    }
    // أصناف معدل استهلاكها هيخلّص المخزون قريب (بناءً على متوسط الاستهلاك اليومي في الفترة)
    const daysInRange = Math.max(1, (new Date(toDate) - new Date(fromDate)) / 86400000);
    const consumedByItem = {};
    rangeMoves.filter((m) => m.type === "out").forEach((m) => { consumedByItem[m.itemId] = (consumedByItem[m.itemId] || 0) + (Number(m.qty) || 0); });
    items.forEach((it) => {
      const consumed = consumedByItem[it.id] || 0;
      if (consumed <= 0) return;
      const dailyRate = consumed / daysInRange;
      if (dailyRate <= 0) return;
      const daysLeft = (it.qty || 0) / dailyRate;
      if (daysLeft <= 7 && (it.qty || 0) > 0) {
        list.push({ kind: "warning", text: t(`صنف "${it.nameAr}" هيخلص تقريبًا خلال ${Math.round(daysLeft)} يوم لو استمر معدل الاستهلاك الحالي.`, `"${it.nameEn || it.nameAr}" will likely run out in about ${Math.round(daysLeft)} days at the current consumption rate.`) });
      }
    });
    if (lowStockItems.length > 0) {
      list.push({ kind: "warning", text: t(`${lowStockItems.length} صنف تحت الحد الأدنى المسموح به دلوقتي.`, `${lowStockItems.length} item(s) are currently below minimum stock.`) });
    }
    if (list.length === 0) list.push({ kind: "success", text: t("لا توجد ملاحظات شاذة — المخزون والاستهلاك مستقران في هذه الفترة.", "No anomalies detected — stock and consumption look stable this period.") });
    return list;
    // eslint-disable-next-line
  }, [byBranch, items, rangeMoves, fromDate, toDate]);

  // تقرير المشتريات والمدفوعات والضريبة
  const purchasesTotal = rangeInMoves.reduce((s, m) => s + (Number(m.purchaseValue) || 0), 0);
  const vatTotal = rangeInMoves.reduce((s, m) => s + (Number(m.vatAmount) || 0), 0);
  const paidTotal = rangeInMoves.reduce((s, m) => s + (Number(m.paidAmount) || 0), 0);
  const unpaidTotal = (purchasesTotal + vatTotal) - paidTotal;

  async function markPaid(moveId, amount) {
    await MOVES_COL.doc(moveId).update({ paidAmount: amount, paymentStatus: "paid" });
  }

  function doPrint() { window.print(); }

  const KIND_STYLE = {
    warning: { bg: "#fef2f2", border: "#fecaca", icon: "⚠️", color: "#991b1b" },
    success: { bg: "#f0fdf4", border: "#bbf7d0", icon: "✅", color: "#166534" },
    info: { bg: "#eff6ff", border: "#bfdbfe", icon: "ℹ️", color: "#1e40af" },
  };

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
          <button onClick={() => setMode("stock")} style={mode === "stock" ? smallBtn : ghostBtn}>{t("المخزون والقيمة", "Stock & value")}</button>
          <button onClick={() => setMode("branch")} style={mode === "branch" ? smallBtn : ghostBtn}>{t("استهلاك الفروع", "Branch consumption")}</button>
          <button onClick={() => setMode("purchases")} style={mode === "purchases" ? smallBtn : ghostBtn}>{t("المشتريات", "Purchases")}</button>
          <button onClick={() => setMode("payments")} style={mode === "payments" ? smallBtn : ghostBtn}>{t("المدفوعات", "Payments")}</button>
          <button onClick={() => setMode("vat")} style={mode === "vat" ? smallBtn : ghostBtn}>{t("الضريبة 15%", "15% VAT")}</button>
        </div>
        {mode !== "stock" && (
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
            <div><label style={smallLabel}>{t("من تاريخ", "From")}</label><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} style={inputStyle2} /></div>
            <div><label style={smallLabel}>{t("إلى تاريخ", "To")}</label><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} style={inputStyle2} /></div>
            {mode === "branch" && (
              <div>
                <label style={smallLabel}>{t("الفرع", "Branch")}</label>
                <select value={branchFilter} onChange={(e) => setBranchFilter(e.target.value)} style={inputStyle2}>
                  <option value="all">{t("كل الفروع", "All branches")}</option>
                  {(meta.branches || []).map((b) => <option key={b} value={b}>{b}</option>)}
                </select>
              </div>
            )}
          </div>
        )}
      </div>

      {mode === "branch" && (
        <div style={{ background: "linear-gradient(135deg,#faf5ff,#f5f3ff)", border: "1px solid #ddd6fe", borderRadius: 14, padding: 20, marginBottom: 18 }} className="no-print">
          <div style={{ fontWeight: 800, fontSize: 15, color: "#5b21b6", marginBottom: 10 }}>🤖 {t("تحليل ذكي تلقائي", "Automatic smart analysis")}</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {smartInsights.map((it, i) => {
              const s = KIND_STYLE[it.kind];
              return <div key={i} style={{ background: s.bg, border: "1px solid " + s.border, borderRadius: 10, padding: "10px 13px", fontSize: 13, color: s.color, display: "flex", gap: 8 }}><span>{s.icon}</span><span>{it.text}</span></div>;
            })}
          </div>
        </div>
      )}

      <div className="print-area">
        <div className="print-only-header"><h2>{institutionName}</h2><div>{t("تقرير", "Report")}</div></div>

        {mode === "stock" && (
          <>
            <div style={cardStyle}>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <div style={{ flex: "1 1 220px", background: "linear-gradient(135deg,#0f2557,#1d4ed8)", borderRadius: 10, padding: "14px 16px" }}>
                  <div style={{ fontSize: 12, color: "#dbe6ff" }}>{t("قيمة المخزون الإجمالية", "Total stock value")}</div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: "#fff" }}>{fmt(totalValue)} {t("ر.س", "SAR")}</div>
                </div>
                <div style={{ flex: "1 1 220px", background: C.blueSoft, borderRadius: 10, padding: "14px 16px" }}>
                  <div style={{ fontSize: 12, color: C.muted }}>{t("عدد الأصناف", "Number of items")}</div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: C.navy }}>{items.length}</div>
                </div>
                <div style={{ flex: "1 1 220px", background: lowStockItems.length > 0 ? "#fef2f2" : C.blueSoft, border: lowStockItems.length > 0 ? "1px solid #fecaca" : "none", borderRadius: 10, padding: "14px 16px" }}>
                  <div style={{ fontSize: 12, color: lowStockItems.length > 0 ? C.danger : C.muted }}>{t("أصناف تحت الحد الأدنى", "Items below minimum")}</div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: lowStockItems.length > 0 ? C.danger : C.navy }}>{lowStockItems.length}</div>
                </div>
              </div>
            </div>
            <div style={cardStyle}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
                <div style={cardTitle}>📋 {t("تفاصيل المخزون", "Stock details")}</div>
                <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
              </div>
              <table>
                <thead><tr><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكود", "Code")}</th><th style={th}>{t("الرصيد", "Qty")}</th><th style={th}>{t("السعر", "Price")}</th><th style={th}>{t("القيمة", "Value")}</th></tr></thead>
                <tbody>
                  {items.map((it) => (
                    <tr key={it.id} style={{ background: it.minStock > 0 && it.qty <= it.minStock ? "#fef2f2" : undefined }}>
                      <td style={td}>{lang === "ar" ? (it.nameAr || it.nameEn) : (it.nameEn || it.nameAr)}</td>
                      <td style={td}>{it.sku}</td>
                      <td style={{ ...td, fontWeight: 700 }}>{fmt(it.qty)} {it.unit}</td>
                      <td style={td}>{fmt(it.price)}</td>
                      <td style={{ ...td, fontWeight: 700 }}>{fmt((it.qty || 0) * (it.price || 0))}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </>
        )}

        {mode === "branch" && (
          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>🏬 {t("استهلاك كل فرع", "Consumption per branch")}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
            </div>
            <table>
              <thead><tr><th style={th}>{t("الفرع", "Branch")}</th><th style={th}>{t("إجمالي الكمية المسحوبة", "Total qty withdrawn")}</th><th style={th}>{t("القيمة الإجمالية", "Total value")}</th></tr></thead>
              <tbody>
                {byBranch.filter((b) => branchFilter === "all" || b.branch === branchFilter).map((b) => (
                  <tr key={b.branch}>
                    <td style={{ ...td, fontWeight: 700 }}>{b.branch}</td>
                    <td style={td}>{fmt(b.qtyTotal)}</td>
                    <td style={{ ...td, fontWeight: 700 }}>{fmt(b.valueTotal)} {t("ر.س", "SAR")}</td>
                  </tr>
                ))}
                {byBranch.length === 0 && <tr><td colSpan={3} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد حركات صرف في هذه الفترة", "No issue movements in this period")}</td></tr>}
              </tbody>
            </table>
          </div>
        )}

        {mode === "purchases" && (
          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>🧾 {t("تقرير المشتريات", "Purchases report")}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
            </div>
            <div style={{ marginBottom: 14, fontSize: 14, fontWeight: 700, color: C.navy }}>{t("إجمالي المشتريات (قبل الضريبة):", "Total purchases (before VAT):")} {fmt(purchasesTotal)} {t("ر.س", "SAR")}</div>
            <table>
              <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكمية", "Qty")}</th><th style={th}>{t("تكلفة الوحدة", "Unit cost")}</th><th style={th}>{t("القيمة", "Value")}</th><th style={th}>{t("المورد", "Supplier")}</th><th style={th}>{t("الفاتورة", "Invoice")}</th></tr></thead>
              <tbody>
                {rangeInMoves.map((m) => (
                  <tr key={m.id}>
                    <td style={td}>{m.date}</td><td style={td}>{m.itemName}</td><td style={td}>{fmt(m.qty)}</td>
                    <td style={td}>{fmt(m.unitCost)}</td><td style={{ ...td, fontWeight: 700 }}>{fmt(m.purchaseValue)}</td>
                    <td style={td}>{m.supplierName || "—"}</td><td style={td}>{m.invoiceNo || "—"}</td>
                  </tr>
                ))}
                {rangeInMoves.length === 0 && <tr><td colSpan={7} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد مشتريات في هذه الفترة", "No purchases in this period")}</td></tr>}
              </tbody>
            </table>
          </div>
        )}

        {mode === "payments" && (
          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>💳 {t("تقرير المدفوعات للموردين", "Supplier payments report")}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("إجمالي المدفوع", "Total paid")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.success }}>{fmt(paidTotal)}</div>
              </div>
              <div style={{ flex: "1 1 200px", background: unpaidTotal > 0 ? "#fef2f2" : C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("متبقي غير مدفوع", "Remaining unpaid")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: unpaidTotal > 0 ? C.danger : C.success }}>{fmt(unpaidTotal)}</div>
              </div>
            </div>
            <table className="no-print">
              <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("المورد", "Supplier")}</th><th style={th}>{t("الفاتورة", "Invoice")}</th><th style={th}>{t("الإجمالي مع الضريبة", "Total incl. VAT")}</th><th style={th}>{t("الحالة", "Status")}</th><th style={th}></th></tr></thead>
              <tbody>
                {rangeInMoves.map((m) => {
                  const totalWithVat = (Number(m.purchaseValue) || 0) + (Number(m.vatAmount) || 0);
                  return (
                    <tr key={m.id}>
                      <td style={td}>{m.date}</td><td style={td}>{m.supplierName || "—"}</td><td style={td}>{m.invoiceNo || "—"}</td>
                      <td style={{ ...td, fontWeight: 700 }}>{fmt(totalWithVat)}</td>
                      <td style={{ ...td, color: m.paymentStatus === "paid" ? C.success : C.danger, fontWeight: 700 }}>{m.paymentStatus === "paid" ? t("مدفوعة", "Paid") : t("غير مدفوعة", "Unpaid")}</td>
                      <td style={td}>{m.paymentStatus !== "paid" && <span onClick={() => markPaid(m.id, totalWithVat)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700 }}>{t("تعليم كمدفوعة", "Mark as paid")}</span>}</td>
                    </tr>
                  );
                })}
                {rangeInMoves.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد فواتير في هذه الفترة", "No invoices in this period")}</td></tr>}
              </tbody>
            </table>
          </div>
        )}

        {mode === "vat" && (
          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>📊 {t("تقرير ضريبة القيمة المضافة 15%", "15% VAT Report")}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("إجمالي المشتريات (قبل الضريبة)", "Total purchases (excl. VAT)")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.navy }}>{fmt(purchasesTotal)}</div>
              </div>
              <div style={{ flex: "1 1 200px", background: "linear-gradient(135deg,#0f2557,#1d4ed8)", borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: "#dbe6ff" }}>{t("إجمالي ضريبة القيمة المضافة (15%)", "Total 15% VAT")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: "#fff" }}>{fmt(vatTotal)}</div>
              </div>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("الإجمالي شامل الضريبة", "Total incl. VAT")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.navy }}>{fmt(purchasesTotal + vatTotal)}</div>
              </div>
            </div>
            <table>
              <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("المورد", "Supplier")}</th><th style={th}>{t("الرقم الضريبي", "Tax number")}</th><th style={th}>{t("القيمة قبل الضريبة", "Value before VAT")}</th><th style={th}>{t("الضريبة 15%", "15% VAT")}</th><th style={th}>{t("الإجمالي", "Total")}</th></tr></thead>
              <tbody>
                {rangeInMoves.map((m) => (
                  <tr key={m.id}>
                    <td style={td}>{m.date}</td><td style={td}>{m.supplierName || "—"}</td><td style={td}>{m.taxNumber || "—"}</td>
                    <td style={td}>{fmt(m.purchaseValue)}</td><td style={td}>{fmt(m.vatAmount)}</td>
                    <td style={{ ...td, fontWeight: 700 }}>{fmt((Number(m.purchaseValue) || 0) + (Number(m.vatAmount) || 0))}</td>
                  </tr>
                ))}
                {rangeInMoves.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد فواتير في هذه الفترة", "No invoices in this period")}</td></tr>}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}
const TAB_DEFS_WH = [
  { id: "in", labelAr: "وارد للمستودع", labelEn: "Stock In" },
  { id: "out", labelAr: "صرف للفروع", labelEn: "Issue to Branch" },
  { id: "count", labelAr: "جرد الفروع", labelEn: "Branch Count" },
  { id: "items", labelAr: "الأصناف", labelEn: "Items" },
  { id: "reports", labelAr: "التقارير", labelEn: "Reports" },
  { id: "notifs", labelAr: "الإشعارات", labelEn: "Notifications" },
  { id: "settings", labelAr: "الإعدادات", labelEn: "Settings" },
];

function App() {
  const [users, setUsers] = useState(null);
  const [meta, setMeta] = useState(null);
  const [whMeta, setWhMeta] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [tab, setTab] = useState("in");
  const [lang, setLang] = useState(localStorage.getItem("wh-lang") || "ar");

  function t(ar, en) { return lang === "ar" ? ar : en; }

  useEffect(() => {
    const savedSession = localStorage.getItem("wh-session");
    if (savedSession) { try { setCurrentUser(JSON.parse(savedSession)); } catch (e) {} }
  }, []);

  useEffect(() => {
    const unsub = USERS_DOC.onSnapshot((doc) => {
      setUsers(doc.exists ? (doc.data().list || []) : []);
    });
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = META_DOC.onSnapshot((doc) => {
      setMeta(doc.exists ? doc.data() : { branches: [] });
    });
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = WH_META_DOC.onSnapshot((doc) => {
      setWhMeta(doc.exists ? doc.data() : {});
    });
    return unsub;
  }, []);

  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    localStorage.setItem("wh-lang", lang);
  }, [lang]);

  function handleLogin(u) {
    setCurrentUser(u);
    localStorage.setItem("wh-session", JSON.stringify(u));
  }
  function handleLogout() {
    setCurrentUser(null);
    localStorage.removeItem("wh-session");
  }

  if (users === null || meta === null || whMeta === null) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.muted }}>...</div>;
  }
  if (!currentUser) return <LoginScreen users={users} onLogin={handleLogin} />;

  const visibleTabs = TAB_DEFS_WH.filter((tb) => {
    if (["items", "in", "settings", "notifs"].includes(tb.id)) return canManageWarehouse(currentUser.role);
    return true; // out, count, reports متاحة لكل الأدوار
  });

  return (
    <div style={{ minHeight: "100vh" }}>
      <div style={{
        background: "linear-gradient(90deg,#0f2557,#1d4ed8)", color: "#fff", padding: "14px 22px",
        display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12,
      }} className="no-print">
        <div style={{ fontWeight: 800, fontSize: 15 }}>📦 {t("نظام إدارة المستودع", "Warehouse Management")}</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {visibleTabs.map((tb) => (
            <button key={tb.id} onClick={() => setTab(tb.id)} style={{
              padding: "8px 14px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700,
              background: tab === tb.id ? "#fff" : "rgba(255,255,255,0.12)", color: tab === tb.id ? C.navy : "#fff",
            }}>{lang === "ar" ? tb.labelAr : tb.labelEn}</button>
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 13 }}>
          <a href="https://abbelroufmohamed-rgb.github.io/deera-fares-cash/" target="_blank" rel="noreferrer" title={t("نظام الكاشير والخزينة", "Cashier & Treasury System")} style={{
            width: 34, height: 34, borderRadius: 8, background: "rgba(255,255,255,0.14)",
            display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16,
            textDecoration: "none", cursor: "pointer",
          }}>💼</a>
          <button onClick={() => setLang(lang === "ar" ? "en" : "ar")} style={{
            background: "rgba(255,255,255,0.15)", color: "#fff", border: "none", borderRadius: 7, padding: "6px 12px", cursor: "pointer", fontWeight: 700,
          }}>{lang === "ar" ? "EN" : "AR"}</button>
          <span style={{ background: "rgba(255,255,255,0.12)", padding: "6px 12px", borderRadius: 20 }}>{currentUser.name} · {ROLE_LABELS[currentUser.role]}</span>
          <button onClick={handleLogout} style={{ background: "#fff", color: C.danger, border: "none", borderRadius: 7, padding: "6px 12px", cursor: "pointer", fontWeight: 700 }}>
            {t("خروج", "Logout")}
          </button>
        </div>
      </div>

      <div style={{ padding: 20, maxWidth: 1300, margin: "0 auto" }}>
        {tab === "in" && canManageWarehouse(currentUser.role) && <StockInTab currentUser={currentUser} lang={lang} t={t} />}
        {tab === "out" && <StockOutTab currentUser={currentUser} meta={meta} lang={lang} t={t} institutionName={DEFAULT_INSTITUTION_NAME} />}
        {tab === "count" && <BranchCountTab currentUser={currentUser} meta={meta} lang={lang} t={t} />}
        {tab === "items" && canManageWarehouse(currentUser.role) && <ItemsTab currentUser={currentUser} lang={lang} t={t} whMeta={whMeta} />}
        {tab === "reports" && <ReportsTab lang={lang} t={t} institutionName={DEFAULT_INSTITUTION_NAME} />}
        {tab === "notifs" && canManageWarehouse(currentUser.role) && <WarehouseNotificationsPanel lang={lang} t={t} />}
        {tab === "settings" && canManageWarehouse(currentUser.role) && <WarehouseSettingsTab meta={meta} whMeta={whMeta} t={t} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
