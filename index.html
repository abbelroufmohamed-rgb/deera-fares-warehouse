          <div style={{ flex: "1 1 140px" }}>
            <label style={smallLabel}>{t("الكمية لكل وحدة مباعة", "Qty per unit sold")} {selectedItem && `(${selectedItem.unit})`}</label>
            <input type="number" step="0.001" value={qtyPerUnit} onChange={(e) => setQtyPerUnit(e.target.value)} style={inputStyle2} placeholder={t("مثال: 0.018 (18 جرام)", "e.g. 0.018 (18 grams)")} />
          </div>
          <button onClick={addIngredient} style={ghostBtn}>➕ {t("أضف مكوّن", "Add ingredient")}</button>
        </div>

        {ingredients.length > 0 && (
          <div style={{ marginTop: 14 }}>
            <table>
              <thead><tr><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الكمية لكل وحدة", "Qty per unit")}</th><th style={th}></th></tr></thead>
              <tbody>
                {ingredients.map((i) => (
                  <tr key={i.key}>
                    <td style={{ ...td, fontWeight: 700 }}>{lang === "ar" ? i.itemName : (i.itemNameEn || i.itemName)}</td>
                    <td style={td}>{fmt(i.qtyPerUnit)} {i.unit}</td>
                    <td style={td}><span onClick={() => removeIngredient(i.key)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700 }}>{t("حذف", "Remove")}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        <div style={{ marginTop: 14, display: "flex", gap: 10, alignItems: "center" }}>
          <button onClick={saveRecipe} style={smallBtn}>{editingId ? t("💾 حفظ التعديل", "💾 Save changes") : t("➕ حفظ الريسبي", "➕ Save recipe")}</button>
          {editingId && <button onClick={() => { setProductName(""); setIngredients([]); setEditingId(null); }} style={ghostBtn}>{t("إلغاء", "Cancel")}</button>}
          {msg && <span style={{ fontSize: 13, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</span>}
        </div>
      </div>

      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
          <div style={{ ...cardTitle, marginBottom: 0, border: "none", padding: 0 }}>📋 {t("كل الريسبيهات", "All recipes")} ({(recipes || []).length})</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {entities.length > 0 && (
              <select value={entityFilter} onChange={(e) => setEntityFilter(e.target.value)} style={{ ...inputStyle2, maxWidth: 180 }}>
                <option value="all">{t("كل الكيانات", "All entities")}</option>
                {entities.map((e) => <option key={e} value={e}>{e}</option>)}
              </select>
            )}
            <input value={search} onChange={(e) => setSearch(e.target.value)} style={{ ...inputStyle2, maxWidth: 220 }} placeholder={t("بحث...", "Search...")} />
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {filtered.map((r) => (
            <div key={r.id} style={{ border: "1px solid " + C.border, borderRadius: 10, padding: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ fontWeight: 800, color: C.navy }}>{r.productName} {r.institution && <span style={{ fontSize: 11.5, fontWeight: 700, color: C.blue, background: C.blueSoft, borderRadius: 12, padding: "2px 8px", marginRight: 6 }}>🏢 {r.institution}</span>}</div>
                <div>
                  <span onClick={() => editRecipe(r)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700, fontSize: 13, marginLeft: 10 }}>{t("تعديل", "Edit")}</span>
                  <span onClick={() => removeRecipe(r)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700, fontSize: 13 }}>{t("حذف", "Delete")}</span>
                </div>
              </div>
              <div style={{ fontSize: 12.5, color: C.muted, marginTop: 4 }}>
                {r.ingredients.map((i) => `${lang === "ar" ? i.itemName : (i.itemNameEn || i.itemName)} (${fmt(i.qtyPerUnit)} ${i.unit})`).join(" + ")}
              </div>
            </div>
          ))}
          {filtered.length === 0 && <div style={{ color: "#9ca3af", fontSize: 13, textAlign: "center" }}>{t("لا يوجد ريسبيهات مسجّلة", "No recipes registered")}</div>}
        </div>
      </div>
    </div>
  );
}

/* ============ رفع مبيعات فودكس ومقارنة الاستهلاك النظري (حسب الريسبي) بالفعلي (المصروف من المستودع) ============ */
function ConsumptionVarianceTab({ meta, lang, t, institutionName }) {
  const [recipes, setRecipes] = useState([]);
  const [moves, setMoves] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [msg, setMsg] = useState("");
  const [branch, setBranch] = useState("");
  const [fromDate, setFromDate] = useState(new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0, 10));
  const [toDate, setToDate] = useState(todayStr());
  const [salesRows, setSalesRows] = useState(null); // [{ productName, qty }] من آخر ملف مرفوع
  const [unmatchedProducts, setUnmatchedProducts] = useState([]);
  const fileInputRef = useRef(null);

  useEffect(() => {
    const unsub = RECIPES_COL.onSnapshot((snap) => setRecipes(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = MOVES_COL.where("type", "==", "out").orderBy("createdAt", "desc").limit(3000).onSnapshot(
      (snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      () => { MOVES_COL.orderBy("createdAt", "desc").limit(4000).onSnapshot((snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((m) => m.type === "out"))); }
    );
    return unsub;
  }, []);
  useEffect(() => { if (!branch && meta.branches?.length) setBranch(meta.branches[0]); }, [meta.branches]);

  // نلاقي الكيان الأب للفرع المختار تلقائيًا من شجرة الفروع — عشان نستخدم ريسبي نفس الكيان بالظبط
  const branchEntity = findEntityForBranch(branch, meta.branchTree);

  async function uploadSalesFile(file) {
    setUploading(true); setMsg("");
    try {
      const buf = await file.arrayBuffer();
      const wb = window.XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false });
      const dataRows = rows.slice(1);
      // نتوقّع عمودين على الأقل: اسم المنتج، والكمية المباعة (أي أعمدة زيادة بيتم تجاهلها)
      const parsed = dataRows.map((r) => ({ productName: String(r[0] || "").trim(), qty: Number(r[1]) || 0 })).filter((r) => r.productName && r.qty > 0);
      setSalesRows(parsed);
      // نبحث عن ريسبي مطابق لنفس اسم المنتج ونفس كيان الفرع تحديدًا (أو ريسبي عام من غير كيان كحل احتياطي)
      const matchableNames = new Set(recipes.filter((r) => (r.institution || "") === branchEntity || !r.institution).map((r) => r.productName));
      setUnmatchedProducts([...new Set(parsed.filter((r) => !matchableNames.has(r.productName)).map((r) => r.productName))]);
      setMsg("✅ " + t(`تم رفع ${parsed.length} منتج من ملف المبيعات`, `${parsed.length} product(s) uploaded from the sales file`));
    } catch (e) { setMsg("Error: " + e.message); }
    setUploading(false);
  }

  // الاستهلاك النظري: لكل منتج مباع في الملف، نضرب الكمية المباعة × مكوّنات ريسبي نفس كيان الفرع (أو ريسبي عام لو مفيش ريسبي خاص بالكيان)
  const theoretical = useMemo(() => {
    if (!salesRows) return {};
    const map = {}; // { itemName: totalQty }
    salesRows.forEach((sr) => {
      const recipe = recipes.find((r) => r.productName === sr.productName && (r.institution || "") === branchEntity)
        || recipes.find((r) => r.productName === sr.productName && !r.institution); // ريسبي عام كحل احتياطي لو مفيش نسخة خاصة بالكيان
      if (!recipe) return;
      recipe.ingredients.forEach((ing) => {
        const key = ing.itemId;
        if (!map[key]) map[key] = { itemName: ing.itemName, unit: ing.unit, qty: 0 };
        map[key].qty += ing.qtyPerUnit * sr.qty;
      });
    });
    return map;
    // eslint-disable-next-line
  }, [salesRows, recipes, branchEntity]);

  // الاستهلاك الفعلي: من حركات الصرف الحقيقية لنفس الفرع ونفس الفترة
  const actual = useMemo(() => {
    const map = {};
    moves.filter((m) => m.branch === branch && m.date >= fromDate && m.date <= toDate).forEach((m) => {
      if (!map[m.itemId]) map[m.itemId] = { itemName: m.itemName, unit: m.unit, qty: 0 };
      map[m.itemId].qty += Number(m.qty) || 0;
    });
    return map;
    // eslint-disable-next-line
  }, [moves, branch, fromDate, toDate]);

  const comparisonRows = useMemo(() => {
    const allItemIds = new Set([...Object.keys(theoretical), ...Object.keys(actual)]);
    return Array.from(allItemIds).map((itemId) => {
      const th = theoretical[itemId]?.qty || 0;
      const ac = actual[itemId]?.qty || 0;
      const name = theoretical[itemId]?.itemName || actual[itemId]?.itemName;
      const unit = theoretical[itemId]?.unit || actual[itemId]?.unit;
      const diff = ac - th; // موجب = مصروف فعليًا أكتر من المفروض (فاقد محتمل)
      const diffPct = th > 0 ? (diff / th) * 100 : (ac > 0 ? 100 : 0);
      return { itemId, name, unit, theoretical: th, actual: ac, diff, diffPct };
    }).sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
    // eslint-disable-next-line
  }, [theoretical, actual]);

  function doPrint() { window.print(); }

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={cardTitle}>📊 {t("مقارنة الاستهلاك: النظري (ريسبي) مقابل الفعلي (مستودع)", "Consumption Comparison: Theoretical (Recipe) vs Actual (Warehouse)")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("ارفع ملف مبيعات فودكس (عمود اسم المنتج، وعمود الكمية المباعة)، واختار الفرع والفترة اللي الملف بيغطيها بالظبط.", "Upload the Foodics sales file (product name column, quantity sold column), and choose the branch and period the file covers exactly.")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div>
            <label style={smallLabel}>{t("الفرع", "Branch")}</label>
            <select value={branch} onChange={(e) => setBranch(e.target.value)} style={{ ...inputStyle2, maxWidth: 220 }}>
              <GroupedBranchOptions meta={meta} />
            </select>
          </div>
          <div><label style={smallLabel}>{t("من تاريخ", "From")}</label><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} style={inputStyle2} /></div>
          <div><label style={smallLabel}>{t("إلى تاريخ", "To")}</label><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} style={inputStyle2} /></div>
          <div>
            <input type="file" accept=".xlsx,.xls" ref={fileInputRef} style={{ display: "none" }} onChange={(e) => { if (e.target.files[0]) uploadSalesFile(e.target.files[0]); e.target.value = ""; }} />
            <button onClick={() => fileInputRef.current?.click()} disabled={uploading} style={smallBtn}>{uploading ? t("جارِ الرفع...", "Uploading...") : "⬆️ " + t("رفع ملف مبيعات فودكس", "Upload Foodics sales file")}</button>
          </div>
        </div>
        {branchEntity && <div style={{ marginTop: 10, fontSize: 12.5, fontWeight: 700, color: C.blue }}>🏢 {t(`الفرع ده تابع لكيان "${branchEntity}" — هيتم استخدام ريسبي "${branchEntity}" تلقائيًا في الحساب`, `This branch belongs to entity "${branchEntity}" — "${branchEntity}"'s recipes will be used automatically`)}</div>}
        {msg && <div style={{ marginTop: 10, fontSize: 13, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
        {unmatchedProducts.length > 0 && (
          <div style={{ marginTop: 10, background: "#fff7ed", border: "1px solid #fed7aa", borderRadius: 8, padding: "8px 12px", fontSize: 12 }}>
            ⚠️ {t(`${unmatchedProducts.length} منتج في ملف المبيعات مالوش ريسبي مسجّل (هيتجاهل من الحساب النظري): `, `${unmatchedProducts.length} product(s) in the sales file have no recipe registered (excluded from theoretical calc): `)}
            {unmatchedProducts.slice(0, 8).join("، ")}{unmatchedProducts.length > 8 ? "..." : ""}
          </div>
        )}
      </div>

      {salesRows && (
        <div className="print-area">
          <div className="print-only-header"><h2>{institutionName}</h2><div>{t("تقرير مقارنة الاستهلاك", "Consumption Comparison Report")} — {branch} ({fromDate} → {toDate})</div></div>
          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>{t("جدول المقارنة", "Comparison table")}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة", "Print")}</button>
            </div>
            <table>
              <thead><tr>
                <th style={th}>{t("الصنف", "Item")}</th>
                <th style={th}>{t("النظري (حسب الريسبي)", "Theoretical (per recipe)")}</th>
                <th style={th}>{t("الفعلي (مصروف من المستودع)", "Actual (issued from warehouse)")}</th>
                <th style={th}>{t("الفرق", "Difference")}</th>
                <th style={th}>{t("النسبة", "%")}</th>
              </tr></thead>
              <tbody>
                {comparisonRows.map((r) => (
                  <tr key={r.itemId} style={{ background: Math.abs(r.diffPct) >= 10 ? "#fef2f2" : undefined }}>
                    <td style={{ ...td, fontWeight: 700 }}>{r.name}</td>
                    <td style={td}>{fmt(r.theoretical)} {r.unit}</td>
                    <td style={td}>{fmt(r.actual)} {r.unit}</td>
                    <td style={{ ...td, fontWeight: 700, color: r.diff > 0 ? C.danger : r.diff < 0 ? C.success : C.muted }}>{r.diff > 0 ? "+" : ""}{fmt(r.diff)}</td>
                    <td style={{ ...td, fontWeight: 700, color: Math.abs(r.diffPct) >= 10 ? C.danger : C.muted }}>{r.diffPct > 0 ? "+" : ""}{r.diffPct.toFixed(1)}%</td>
                  </tr>
                ))}
                {comparisonRows.length === 0 && <tr><td colSpan={5} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد بيانات للمقارنة", "No data to compare")}</td></tr>}
              </tbody>
            </table>
            <div style={{ marginTop: 12, fontSize: 11.5, color: C.muted }}>
              {t("الفرق الموجب (أحمر) = اتصرف من المستودع فعليًا أكتر من المفروض حسب الريسبي (فاقد/هدر محتمل). الفرق السالب (أخضر) = اتصرف أقل من المفروض.", "Positive difference (red) = actually issued from warehouse more than the recipe implies (possible waste/loss). Negative (green) = issued less than expected.")}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MaintenanceRequestTab({ currentUser, lang, t, isResponsible }) {
  const [equipment, setEquipment] = useState([]);
  const [requests, setRequests] = useState([]);
  const [equipmentId, setEquipmentId] = useState("");
  const [issue, setIssue] = useState("");
  const [urgency, setUrgency] = useState("normal");
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const [filterStatus, setFilterStatus] = useState("pending");
  const [assignInputs, setAssignInputs] = useState({}); // { requestId: assignedToText }
  const [busyId, setBusyId] = useState(null);
  const [quoteFormId, setQuoteFormId] = useState(null); // بلاغ عرض فورم عرض السعر بتاعه
  const [quoteForm, setQuoteForm] = useState({ vendor: "", cost: "", note: "" });

  const isFinancialApprover = currentUser.role === "financial_manager" || currentUser.role === "admin"; // من أدوار الكاشير المشتركة
  const canApproveExpense = isResponsible || isFinancialApprover;

  useEffect(() => {
    const unsub = EQUIPMENT_COL.orderBy("name").onSnapshot((snap) => setEquipment(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = MAINTENANCE_REQUESTS_COL.orderBy("createdAt", "desc").limit(150).onSnapshot((snap) => setRequests(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), () => {});
    return unsub;
  }, []);

  const URGENCY_LABEL = { normal: t("عادي", "Normal"), urgent: t("عاجل", "Urgent") };
  const STATUS_LABEL = {
    pending: t("قيد الانتظار", "Pending"), in_progress: t("جارِ التنفيذ", "In progress"), done: t("تم الإصلاح", "Resolved"), rejected: t("مرفوض", "Rejected"),
    awaiting_expense_approval: t("بانتظار اعتماد الصرف", "Awaiting expense approval"),
  };
  const STATUS_COLOR = { pending: C.warn, in_progress: C.blue, done: C.success, rejected: C.danger, awaiting_expense_approval: "#7c3aed" };

  async function submitRequest() {
    const eq = equipment.find((e) => e.id === equipmentId);
    if (!eq) { setMsg(t("اختر المعدة أولًا", "Choose the equipment first")); return; }
    if (!issue.trim()) { setMsg(t("اكتب وصف العطل/المشكلة", "Describe the fault/issue")); return; }
    setSaving(true); setMsg("");
    try {
      await MAINTENANCE_REQUESTS_COL.add({
        equipmentId: eq.id, equipmentName: eq.name, equipmentLocation: eq.currentLocation || eq.branch || t("المستودع الرئيسي", "Main Warehouse"),
        issue: issue.trim(), urgency, status: "pending", requestedBy: currentUser.name, assignedTo: "",
        institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setEquipmentId(""); setIssue(""); setUrgency("normal");
      setMsg("✅ " + t("تم إرسال بلاغ الصيانة للمسؤول", "Maintenance report sent to the responsible person"));
    } catch (e) { setMsg("Error: " + e.message); }
    setSaving(false);
  }

  async function submitQuote(r) {
    if (!quoteForm.vendor.trim()) { setMsg(t("اكتب اسم مقدّم الخدمة الخارجي", "Enter the external vendor's name")); return; }
    if (!Number(quoteForm.cost) || Number(quoteForm.cost) <= 0) { setMsg(t("أدخل تكلفة عرض السعر", "Enter the quote cost")); return; }
    try {
      await MAINTENANCE_REQUESTS_COL.doc(r.id).update({
        status: "awaiting_expense_approval", isExternal: true,
        quoteVendor: quoteForm.vendor.trim(), quoteCost: Number(quoteForm.cost), quoteNote: quoteForm.note.trim(),
        quoteSubmittedBy: currentUser.name, quoteSubmittedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setQuoteFormId(null); setQuoteForm({ vendor: "", cost: "", note: "" });
      setMsg("✅ " + t("تم إرسال عرض السعر لاعتماد مدير المستودع/المدير المالي", "Quote sent for warehouse/financial manager approval"));
    } catch (e) { setMsg("Error: " + e.message); }
  }

  async function approveExpense(r, approve) {
    setBusyId(r.id);
    try {
      if (approve) {
        await MAINTENANCE_REQUESTS_COL.doc(r.id).update({
          status: "in_progress", assignedTo: r.quoteVendor,
          expenseApprovedBy: currentUser.name, expenseApprovedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      } else {
        await MAINTENANCE_REQUESTS_COL.doc(r.id).update({
          status: "rejected", expenseApprovedBy: currentUser.name, expenseApprovedAt: firebase.firestore.FieldValue.serverTimestamp(), resolvedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
    } catch (e) { setMsg("Error: " + e.message); }
    setBusyId(null);
  }

  async function updateStatus(r, status) {
    setBusyId(r.id);
    try {
      const payload = { status };
      if (status === "in_progress") payload.assignedTo = (assignInputs[r.id] || "").trim() || currentUser.name;
      if (status === "done" || status === "rejected") payload.resolvedAt = firebase.firestore.FieldValue.serverTimestamp();
      await MAINTENANCE_REQUESTS_COL.doc(r.id).update(payload);
      // لو اتقفل كـ"تم الإصلاح"، نسجّله تلقائيًا في سجل صيانة المعدة الرسمي
      if (status === "done") {
        await MAINTENANCE_COL.add({
          equipmentId: r.equipmentId, date: todayStr(), description: r.issue, cost: r.quoteCost || 0,
          performedBy: r.assignedTo || currentUser.name, institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
    } catch (e) { setMsg("Error: " + e.message); }
    setBusyId(null);
  }

  const filtered = requests.filter((r) => filterStatus === "all" || r.status === filterStatus);
  const pendingCount = requests.filter((r) => r.status === "pending").length;

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>🔧📋 {t("الإبلاغ عن عطل / طلب صيانة", "Report a Fault / Maintenance Request")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("لو معدة عندها عطل أو محتاجة صيانة، بلّغ عنها هنا وهيوصل للمسؤول مباشرة.", "If a piece of equipment has a fault or needs maintenance, report it here and it goes straight to the responsible person.")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div style={{ flex: "1 1 220px" }}>
            <label style={smallLabel}>{t("المعدة", "Equipment")}</label>
            <select value={equipmentId} onChange={(e) => setEquipmentId(e.target.value)} style={inputStyle2}>
              <option value="">{t("اختر المعدة", "Choose equipment")}</option>
              {equipment.map((eq) => <option key={eq.id} value={eq.id}>{eq.name} ({eq.currentLocation || eq.branch || t("المستودع الرئيسي", "Main WH")})</option>)}
            </select>
          </div>
          <div>
            <label style={smallLabel}>{t("الأولوية", "Priority")}</label>
            <select value={urgency} onChange={(e) => setUrgency(e.target.value)} style={inputStyle2}>
              <option value="normal">{t("عادي", "Normal")}</option>
              <option value="urgent">{t("عاجل", "Urgent")}</option>
            </select>
          </div>
          <div style={{ flex: "1 1 260px" }}>
            <label style={smallLabel}>{t("وصف العطل/المشكلة", "Fault/issue description")}</label>
            <input value={issue} onChange={(e) => setIssue(e.target.value)} style={inputStyle2} placeholder={t("مثال: الماكينة بتسخّن كتير ومش بتضبط الضغط", "e.g. machine overheats and won't hold pressure")} />
          </div>
          <button onClick={submitRequest} disabled={saving} style={smallBtn}>{saving ? t("جارِ الإرسال...", "Sending...") : "📤 " + t("إرسال البلاغ", "Send report")}</button>
        </div>
        {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
      </div>

      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
          <div style={{ ...cardTitle, marginBottom: 0, border: "none", padding: 0 }}>🕒 {t("بلاغات الصيانة", "Maintenance Reports")} {pendingCount > 0 && <span style={{ background: C.danger, color: "#fff", borderRadius: 20, padding: "2px 10px", fontSize: 12, marginRight: 8 }}>{pendingCount} {t("قيد الانتظار", "pending")}</span>}</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {["pending", "awaiting_expense_approval", "in_progress", "done", "rejected", "all"].map((s) => (
              <button key={s} onClick={() => setFilterStatus(s)} style={filterStatus === s ? smallBtn : ghostBtn}>{s === "all" ? t("الكل", "All") : STATUS_LABEL[s]}</button>
            ))}
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {filtered.map((r) => (
            <div key={r.id} style={{
              border: "1px solid " + (r.urgency === "urgent" && r.status === "pending" ? "#fecaca" : C.border), borderRadius: 10, padding: 14,
              background: r.urgency === "urgent" && r.status === "pending" ? "#fef2f2" : "#fff",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 6 }}>
                <div>
                  <span style={{ fontWeight: 800, color: C.navy }}>{r.equipmentName}</span>
                  {r.urgency === "urgent" && <span style={{ marginRight: 8, background: C.danger, color: "#fff", borderRadius: 12, padding: "2px 8px", fontSize: 11, fontWeight: 700 }}>⚡ {t("عاجل", "Urgent")}</span>}
                  <div style={{ fontSize: 12, color: C.muted }}>📍 {r.equipmentLocation} — {t("بلّغ عنه:", "Reported by:")} {r.requestedBy}</div>
                </div>
                <span style={{ fontWeight: 700, color: STATUS_COLOR[r.status] }}>{STATUS_LABEL[r.status]}</span>
              </div>
              <div style={{ fontSize: 13.5, color: C.text, marginBottom: 8 }}>{r.issue}</div>
              {r.assignedTo && <div style={{ fontSize: 12, color: C.muted, marginBottom: 8 }}>{t("مسؤول عنها:", "Assigned to:")} {r.assignedTo}</div>}
              {r.quoteVendor && (
                <div style={{ fontSize: 12.5, background: "#faf5ff", border: "1px solid #ddd6fe", borderRadius: 8, padding: "8px 12px", marginBottom: 8 }}>
                  🧾 {t("عرض سعر خارجي:", "External quote:")} <b>{r.quoteVendor}</b> — {fmt(r.quoteCost)} {t("ر.س", "SAR")} {r.quoteNote && "— " + r.quoteNote}
                </div>
              )}
              {isResponsible && r.status === "pending" && (
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                  <input value={assignInputs[r.id] || ""} onChange={(e) => setAssignInputs((a) => ({ ...a, [r.id]: e.target.value }))} placeholder={t("اسم اللي هيتابعها (اختياري)", "Who's handling it (optional)")} style={{ ...inputStyle2, maxWidth: 220 }} />
                  <button onClick={() => updateStatus(r, "in_progress")} disabled={busyId === r.id} style={smallBtn}>▶️ {t("بدء المعالجة الداخلية", "Start internal handling")}</button>
                  <button onClick={() => setQuoteFormId(quoteFormId === r.id ? null : r.id)} disabled={busyId === r.id} style={{ ...ghostBtn, color: "#7c3aed", borderColor: "#7c3aed" }}>🧾 {t("صيانة خارجية (عرض سعر)", "External maintenance (quote)")}</button>
                  <button onClick={() => updateStatus(r, "rejected")} disabled={busyId === r.id} style={{ ...ghostBtn, color: C.danger, borderColor: C.danger }}>{t("رفض", "Reject")}</button>
                </div>
              )}
              {isResponsible && quoteFormId === r.id && (
                <div style={{ marginTop: 10, background: "#faf5ff", borderRadius: 8, padding: 12, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
                  <div><label style={smallLabel}>{t("مقدّم الخدمة الخارجي", "External vendor")}</label><input value={quoteForm.vendor} onChange={(e) => setQuoteForm((f) => ({ ...f, vendor: e.target.value }))} style={{ ...inputStyle2, width: 180 }} /></div>
                  <div><label style={smallLabel}>{t("تكلفة عرض السعر", "Quote cost")}</label><input type="number" step="0.01" value={quoteForm.cost} onChange={(e) => setQuoteForm((f) => ({ ...f, cost: e.target.value }))} style={{ ...inputStyle2, width: 130 }} /></div>
                  <div style={{ flex: "1 1 180px" }}><label style={smallLabel}>{t("ملاحظة (اختياري)", "Note (optional)")}</label><input value={quoteForm.note} onChange={(e) => setQuoteForm((f) => ({ ...f, note: e.target.value }))} style={inputStyle2} /></div>
                  <button onClick={() => submitQuote(r)} style={smallBtn}>📤 {t("إرسال للاعتماد", "Send for approval")}</button>
                </div>
              )}
              {r.status === "awaiting_expense_approval" && (
                canApproveExpense ? (
                  <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
                    <button onClick={() => approveExpense(r, true)} disabled={busyId === r.id} style={smallBtn}>✅ {t("اعتماد الصرف", "Approve expense")}</button>
                    <button onClick={() => approveExpense(r, false)} disabled={busyId === r.id} style={{ ...ghostBtn, color: C.danger, borderColor: C.danger }}>{t("إلغاء", "Cancel")}</button>
                  </div>
                ) : (
                  <div style={{ fontSize: 11.5, color: C.muted, marginTop: 6 }}>{t("بانتظار اعتماد مدير المستودع أو المدير المالي", "Awaiting warehouse or financial manager approval")}</div>
                )
              )}
              {isResponsible && r.status === "in_progress" && (
                <button onClick={() => updateStatus(r, "done")} disabled={busyId === r.id} style={smallBtn}>✅ {t("تم الإصلاح", "Mark as resolved")}</button>
              )}
            </div>
          ))}
          {filtered.length === 0 && <div style={{ color: "#9ca3af", fontSize: 13, textAlign: "center" }}>{t("لا يوجد بلاغات", "No reports")}</div>}
        </div>
      </div>
    </div>
  );
}

function EquipmentTab({ currentUser, meta, lang, t }) {
  const [equipment, setEquipment] = useState(null);
  const [form, setForm] = useState(emptyEquip());
  const [editingId, setEditingId] = useState(null);
  const [photo, setPhoto] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [msg, setMsg] = useState("");
  const [openId, setOpenId] = useState(null); // معدة مفتوحة لعرض سجل صيانتها
  const [maintenance, setMaintenance] = useState({}); // { equipmentId: [...] }
  const [maintForm, setMaintForm] = useState({ date: todayStr(), description: "", cost: "", performedBy: "" });
  const [moves, setMoves] = useState([]);
  const [openMovesId, setOpenMovesId] = useState(null); // معدة مفتوح سجل حركتها
  const [transferFormId, setTransferFormId] = useState(null); // معدة عرض فورم النقل بتاعها
  const [transferForm, setTransferForm] = useState({ destType: "branch", destBranch: "", reason: "" });
  const [receiveFormId, setReceiveFormId] = useState(null); // معدة عرض فورم "استلام من فرع" بتاعها
  const [receiveForm, setReceiveForm] = useState({ fromBranch: "", reason: "" });
  const [confirmName, setConfirmName] = useState({}); // { moveId: receiverName }
  const [busyMoveId, setBusyMoveId] = useState(null);
  const fileInputRef = useRef(null);

  function emptyEquip() { return { name: "", branch: "", supplier: "", purchaseDate: todayStr(), cost: "", warrantyExpiry: "" }; }

  useEffect(() => {
    const unsub = EQUIPMENT_COL.orderBy("name").onSnapshot((snap) => setEquipment(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = EQUIPMENT_MOVES_COL.orderBy("createdAt", "desc").limit(300).onSnapshot((snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), () => {});
    return unsub;
  }, []);

  const pendingConfirmations = moves.filter((m) => m.status === "pending_receipt");

  async function submitTransfer(eq) {
    if (transferForm.destType === "branch" && !transferForm.destBranch) { setMsg(t("اختر الفرع المستلم", "Choose the receiving branch")); return; }
    if (!transferForm.reason.trim()) { setMsg(t("اكتب سبب النقل", "Enter the reason for the transfer")); return; }
    try {
      const destination = transferForm.destType === "branch" ? transferForm.destBranch : t("صيانة", "Maintenance");
      const isBranch = transferForm.destType === "branch";
      await EQUIPMENT_MOVES_COL.add({
        equipmentId: eq.id, equipmentName: eq.name, type: isBranch ? "out_to_branch" : "out_to_maintenance",
        fromLocation: eq.currentLocation || t("المستودع الرئيسي", "Main Warehouse"), toLocation: destination,
        reason: transferForm.reason.trim(), date: todayStr(), sentBy: currentUser.name,
        status: isBranch ? "pending_receipt" : "confirmed", receivedBy: isBranch ? "" : currentUser.name,
        institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      // لو رايحة صيانة، الموقع يتحدّث فورًا (مفيش مستلم خارجي محتاج يوافق). لو لفرع، الموقع يفضل معلّق لحد ما يتأكّد الاستلام
      if (!isBranch) await EQUIPMENT_COL.doc(eq.id).update({ currentLocation: destination });
      setTransferFormId(null); setTransferForm({ destType: "branch", destBranch: "", reason: "" });
      setMsg("✅ " + (isBranch ? t("تم إرسال طلب النقل — بانتظار تأكيد الاستلام من الفرع", "Transfer sent — awaiting branch receipt confirmation") : t("تم تسجيل نقل المعدة للصيانة", "Equipment transfer to maintenance recorded")));
    } catch (e) { setMsg("Error: " + e.message); }
  }

  async function confirmMoveReceipt(move) {
    const receiver = confirmName[move.id];
    if (!receiver || !receiver.trim()) { setMsg(t("اكتب اسم مستلم المعدة قبل التأكيد", "Enter the receiver's name before confirming")); return; }
    setBusyMoveId(move.id);
    try {
      await EQUIPMENT_MOVES_COL.doc(move.id).update({ status: "confirmed", receivedBy: receiver.trim(), confirmedAt: firebase.firestore.FieldValue.serverTimestamp() });
      await EQUIPMENT_COL.doc(move.equipmentId).update({ currentLocation: move.toLocation });
      setMsg("✅ " + t("تم تأكيد استلام المعدة", "Equipment receipt confirmed"));
    } catch (e) { setMsg("Error: " + e.message); }
    setBusyMoveId(null);
  }

  async function submitReceiveFromBranch(eq) {
    if (!receiveForm.fromBranch) { setMsg(t("اختر الفرع اللي راجعة منه المعدة", "Choose the branch it's returning from")); return; }
    if (!receiveForm.reason.trim()) { setMsg(t("اكتب سبب دخول المعدة للمستودع", "Enter the reason it's entering the warehouse")); return; }
    try {
      await EQUIPMENT_MOVES_COL.add({
        equipmentId: eq.id, equipmentName: eq.name, type: "in_from_branch",
        fromLocation: receiveForm.fromBranch, toLocation: t("المستودع الرئيسي", "Main Warehouse"),
        reason: receiveForm.reason.trim(), date: todayStr(), sentBy: currentUser.name, receivedBy: currentUser.name,
        status: "confirmed", institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await EQUIPMENT_COL.doc(eq.id).update({ currentLocation: t("المستودع الرئيسي", "Main Warehouse") });
      setReceiveFormId(null); setReceiveForm({ fromBranch: "", reason: "" });
      setMsg("✅ " + t("تم تسجيل استلام المعدة من الفرع", "Equipment receipt from branch recorded"));
    } catch (e) { setMsg("Error: " + e.message); }
  }

  function set(key, val) { setForm((f) => ({ ...f, [key]: val })); }

  async function onPhotoSelect(file) {
    if (!file) return;
    setUploading(true);
    try {
      let dataUrl = await compressImage(file, 900, 0.55);
      if (dataUrl.length > 600000) dataUrl = await compressImage(file, 650, 0.4);
      setPhoto(dataUrl);
    } catch (e) { setMsg(t("تعذر تجهيز الصورة: ", "Could not process photo: ") + e.message); }
    setUploading(false);
  }

  async function save() {
    if (!form.name.trim()) { setMsg(t("اكتب اسم المعدة", "Enter equipment name")); return; }
    try {
      const payload = {
        name: form.name.trim(), branch: form.branch, supplier: form.supplier.trim(),
        purchaseDate: form.purchaseDate, cost: Number(form.cost) || 0, warrantyExpiry: form.warrantyExpiry,
        photoUrl: photo || (editingId ? undefined : null),
      };
      // ما نمسحش الصورة الحالية لو مافيش صورة جديدة وقت التعديل
      if (payload.photoUrl === undefined) delete payload.photoUrl;
      if (editingId) {
        await EQUIPMENT_COL.doc(editingId).update(payload);
        setMsg("✅ " + t("تم تحديث المعدة", "Equipment updated"));
      } else {
        const initialLocation = form.branch || t("المستودع الرئيسي", "Main Warehouse");
        await EQUIPMENT_COL.add({ ...payload, photoUrl: photo || null, currentLocation: initialLocation, institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        setMsg("✅ " + t("تمت إضافة المعدة", "Equipment added"));
      }
      setForm(emptyEquip()); setPhoto(null); setEditingId(null);
    } catch (e) { setMsg("Error: " + e.message); }
  }

  function editEquip(eq) {
    setForm({ name: eq.name, branch: eq.branch || "", supplier: eq.supplier || "", purchaseDate: eq.purchaseDate || todayStr(), cost: eq.cost || "", warrantyExpiry: eq.warrantyExpiry || "" });
    setPhoto(null); setEditingId(eq.id);
  }
  async function removeEquip(eq) {
    if (!confirm(t(`حذف معدة "${eq.name}"؟`, `Delete equipment "${eq.name}"?`))) return;
    await EQUIPMENT_COL.doc(eq.id).delete();
  }

  async function loadMaintenance(equipId) {
    setOpenId(openId === equipId ? null : equipId);
    if (maintenance[equipId]) return;
    const snap = await MAINTENANCE_COL.where("equipmentId", "==", equipId).get().catch(() => null);
    if (snap) setMaintenance((m) => ({ ...m, [equipId]: snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || "").localeCompare(a.date || "")) }));
  }

  async function addMaintenance(equipId) {
    if (!maintForm.description.trim()) { setMsg(t("اكتب وصف أعمال الصيانة", "Describe the maintenance work")); return; }
    await MAINTENANCE_COL.add({
      equipmentId: equipId, date: maintForm.date, description: maintForm.description.trim(),
      cost: Number(maintForm.cost) || 0, performedBy: maintForm.performedBy.trim() || currentUser.name,
      institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    const snap = await MAINTENANCE_COL.where("equipmentId", "==", equipId).get();
    setMaintenance((m) => ({ ...m, [equipId]: snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || "").localeCompare(a.date || "")) }));
    setMaintForm({ date: todayStr(), description: "", cost: "", performedBy: "" });
  }

  function warrantyStatus(expiry) {
    if (!expiry) return null;
    const days = Math.ceil((new Date(expiry) - new Date(todayStr())) / 86400000);
    if (days < 0) return { label: t("انتهى الضمان", "Warranty expired"), color: C.danger };
    if (days <= 30) return { label: t(`الضمان هينتهي خلال ${days} يوم`, `Warranty expires in ${days} days`), color: C.warn };
    return { label: t("تحت الضمان", "Under warranty"), color: C.success };
  }

  if (equipment === null) return <div style={{ color: C.muted, padding: 20 }}>...</div>;

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>{editingId ? "✏️ " + t("تعديل معدة", "Edit equipment") : "➕ " + t("معدة جديدة", "New equipment")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>{t("اسم المعدة", "Equipment name")}</label>
            <input value={form.name} onChange={(e) => set("name", e.target.value)} style={inputStyle2} placeholder={t("مثال: ماكينة إسبريسو", "e.g. Espresso machine")} />
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>{t("الموقع/الفرع", "Location/Branch")}</label>
            <select value={form.branch} onChange={(e) => set("branch", e.target.value)} style={inputStyle2}>
              <option value="">{t("المستودع الرئيسي", "Main warehouse")}</option>
              <GroupedBranchOptions meta={meta} />
            </select>
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>{t("المورد", "Supplier")}</label>
            <input value={form.supplier} onChange={(e) => set("supplier", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 140px" }}>
            <label style={smallLabel}>{t("تاريخ الشراء", "Purchase date")}</label>
            <input type="date" value={form.purchaseDate} onChange={(e) => set("purchaseDate", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 120px" }}>
            <label style={smallLabel}>{t("التكلفة", "Cost")}</label>
            <input type="number" step="0.01" value={form.cost} onChange={(e) => set("cost", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>🛡️ {t("تاريخ انتهاء الضمان", "Warranty expiry")}</label>
            <input type="date" value={form.warrantyExpiry} onChange={(e) => set("warrantyExpiry", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>📷 {t("صورة المعدة", "Equipment photo")}</label>
            <input type="file" accept="image/*" ref={fileInputRef} style={{ display: "none" }} onChange={(e) => onPhotoSelect(e.target.files[0])} />
            <button type="button" onClick={() => fileInputRef.current?.click()} disabled={uploading} style={ghostBtn}>
              {uploading ? t("جارِ التجهيز...", "Processing...") : (photo ? t("✅ صورة مرفقة — تغيير", "✅ Photo attached — change") : t("رفع صورة", "Upload photo"))}
            </button>
          </div>
        </div>
        {photo && <img src={photo} alt="" style={{ width: 90, height: 90, objectFit: "cover", borderRadius: 8, marginTop: 10, border: "1px solid " + C.border }} />}
        <div style={{ marginTop: 14, display: "flex", gap: 10, alignItems: "center" }}>
          <button onClick={save} style={smallBtn}>{editingId ? t("💾 حفظ التعديل", "💾 Save changes") : t("➕ إضافة المعدة", "➕ Add equipment")}</button>
          {editingId && <button onClick={() => { setForm(emptyEquip()); setPhoto(null); setEditingId(null); }} style={ghostBtn}>{t("إلغاء", "Cancel")}</button>}
          {msg && <span style={{ fontSize: 13, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</span>}
        </div>
      </div>

      {pendingConfirmations.length > 0 && (
        <div style={{ ...cardStyle, background: "#fff7ed", border: "1px solid #fed7aa" }}>
          <div style={cardTitle}>📬 {t("تحويلات معلّقة تنتظر تأكيد الاستلام", "Pending transfers awaiting receipt confirmation")} ({pendingConfirmations.length})</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {pendingConfirmations.map((m) => (
              <div key={m.id} style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap", background: "#fff", borderRadius: 8, padding: 12 }}>
                <div style={{ flex: "1 1 200px" }}>
                  <div style={{ fontWeight: 700, color: C.navy }}>{m.equipmentName}</div>
                  <div style={{ fontSize: 12, color: C.muted }}>{m.fromLocation} ← {m.toLocation} — {t("السبب:", "Reason:")} {m.reason} — {t("أرسلها:", "Sent by:")} {m.sentBy}</div>
                </div>
                <div>
                  <label style={smallLabel}>{t("اسم مستلم المعدة الآن", "Receiver's name now")}</label>
                  <input value={confirmName[m.id] || ""} onChange={(e) => setConfirmName((c) => ({ ...c, [m.id]: e.target.value }))} style={{ ...inputStyle2, width: 180 }} />
                </div>
                <button onClick={() => confirmMoveReceipt(m)} disabled={busyMoveId === m.id} style={smallBtn}>{busyMoveId === m.id ? "..." : "✅ " + t("تأكيد الاستلام", "Confirm receipt")}</button>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={cardStyle}>
        <div style={cardTitle}>🔧 {t("كل المعدات", "All Equipment")} ({equipment.length})</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {equipment.map((eq) => {
            const wStatus = warrantyStatus(eq.warrantyExpiry);
            const eqMoves = moves.filter((m) => m.equipmentId === eq.id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
            const currentLoc = eq.currentLocation || eq.branch || t("المستودع الرئيسي", "Main warehouse");
            return (
              <div key={eq.id} style={{ border: "1px solid " + C.border, borderRadius: 10, padding: 14 }}>
                <div style={{ display: "flex", gap: 14, alignItems: "flex-start", flexWrap: "wrap" }}>
                  {eq.photoUrl ? (
                    <img src={eq.photoUrl} alt="" style={{ width: 70, height: 70, objectFit: "cover", borderRadius: 8, border: "1px solid " + C.border }} />
                  ) : (
                    <div style={{ width: 70, height: 70, borderRadius: 8, background: "#f3f4f6", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24 }}>🔧</div>
                  )}
                  <div style={{ flex: 1, minWidth: 200 }}>
                    <div style={{ fontWeight: 800, fontSize: 15, color: C.navy }}>{eq.name}</div>
                    <div style={{ fontSize: 12.5, fontWeight: 700, color: C.blue, marginTop: 2 }}>📍 {t("الموقع الحالي:", "Current location:")} {currentLoc}</div>
                    <div style={{ fontSize: 12, color: C.muted }}>{eq.supplier || "—"}</div>
                    <div style={{ fontSize: 12, color: C.muted }}>{t("تكلفة الشراء:", "Purchase cost:")} {fmt(eq.cost)} {t("ر.س", "SAR")} — {eq.purchaseDate}</div>
                    {wStatus && <div style={{ fontSize: 12.5, fontWeight: 700, color: wStatus.color, marginTop: 4 }}>🛡️ {wStatus.label} ({eq.warrantyExpiry})</div>}
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" }}>
                    <span onClick={() => editEquip(eq)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700, fontSize: 13 }}>{t("تعديل", "Edit")}</span>
                    <span onClick={() => removeEquip(eq)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700, fontSize: 13 }}>{t("حذف", "Delete")}</span>
                    <span onClick={() => { setTransferFormId(transferFormId === eq.id ? null : eq.id); setReceiveFormId(null); }} style={{ cursor: "pointer", color: C.navy, fontWeight: 700, fontSize: 13 }}>🔄 {t("نقل/تحويل", "Transfer")}</span>
                    <span onClick={() => { setReceiveFormId(receiveFormId === eq.id ? null : eq.id); setTransferFormId(null); }} style={{ cursor: "pointer", color: C.success, fontWeight: 700, fontSize: 13 }}>📥 {t("استلام من فرع", "Receive from branch")}</span>
                    <span onClick={() => setOpenMovesId(openMovesId === eq.id ? null : eq.id)} style={{ cursor: "pointer", color: "#7c3aed", fontWeight: 700, fontSize: 13 }}>📜 {openMovesId === eq.id ? t("إخفاء سجل الحركة", "Hide movement log") : t("سجل الحركة", "Movement log")}</span>
                    <span onClick={() => loadMaintenance(eq.id)} style={{ cursor: "pointer", color: C.navy, fontWeight: 700, fontSize: 13 }}>🔧 {openId === eq.id ? t("إخفاء الصيانة", "Hide maintenance") : t("سجل الصيانة", "Maintenance log")}</span>
                  </div>
                </div>

                {transferFormId === eq.id && (
                  <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px dashed " + C.border, background: C.blueSoft, borderRadius: 8, padding: 12 }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: C.navy, marginBottom: 10 }}>🔄 {t("نقل هذه المعدة", "Transfer this equipment")}</div>
                    <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
                      <div>
                        <label style={smallLabel}>{t("الوجهة", "Destination")}</label>
                        <select value={transferForm.destType} onChange={(e) => setTransferForm((f) => ({ ...f, destType: e.target.value }))} style={inputStyle2}>
                          <option value="branch">{t("فرع", "Branch")}</option>
                          <option value="maintenance">{t("صيانة", "Maintenance")}</option>
                        </select>
                      </div>
                      {transferForm.destType === "branch" && (
                        <div>
                          <label style={smallLabel}>{t("الفرع المستلم", "Receiving branch")}</label>
                          <select value={transferForm.destBranch} onChange={(e) => setTransferForm((f) => ({ ...f, destBranch: e.target.value }))} style={inputStyle2}>
                            <option value="">{t("اختر الفرع", "Choose branch")}</option>
                            <GroupedBranchOptions meta={meta} />
                          </select>
                        </div>
                      )}
                      <div style={{ flex: "1 1 200px" }}>
                        <label style={smallLabel}>{t("سبب النقل", "Reason for transfer")}</label>
                        <input value={transferForm.reason} onChange={(e) => setTransferForm((f) => ({ ...f, reason: e.target.value }))} style={inputStyle2} placeholder={t("مثال: عطل بسيط / فرع محتاجها", "e.g. minor fault / branch needs it")} />
                      </div>
                      <button onClick={() => submitTransfer(eq)} style={smallBtn}>📤 {t("إرسال", "Send")}</button>
                    </div>
                    {transferForm.destType === "branch" && <div style={{ fontSize: 11.5, color: C.muted, marginTop: 8 }}>{t("هتفضل المعدة \"معلّقة\" لحد ما حد في الفرع يأكّد استلامها من قسم \"تحويلات معلّقة\" فوق.", "The equipment stays \"pending\" until someone at the branch confirms receipt from the \"Pending transfers\" section above.")}</div>}
                  </div>
                )}

                {receiveFormId === eq.id && (
                  <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px dashed " + C.border, background: "#f0fdf4", borderRadius: 8, padding: 12 }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: C.navy, marginBottom: 10 }}>📥 {t("استلام هذه المعدة راجعة من فرع", "Receive this equipment returning from a branch")}</div>
                    <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
                      <div>
                        <label style={smallLabel}>{t("راجعة من فرع", "Returning from branch")}</label>
                        <select value={receiveForm.fromBranch} onChange={(e) => setReceiveForm((f) => ({ ...f, fromBranch: e.target.value }))} style={inputStyle2}>
                          <option value="">{t("اختر الفرع", "Choose branch")}</option>
                          <GroupedBranchOptions meta={meta} />
                        </select>
                      </div>
                      <div style={{ flex: "1 1 200px" }}>
                        <label style={smallLabel}>{t("سبب دخولها المستودع", "Reason it's entering the warehouse")}</label>
                        <input value={receiveForm.reason} onChange={(e) => setReceiveForm((f) => ({ ...f, reason: e.target.value }))} style={inputStyle2} placeholder={t("مثال: عطل يحتاج صيانة / مش محتاجينها في الفرع", "e.g. needs repair / branch no longer needs it")} />
                      </div>
                      <button onClick={() => submitReceiveFromBranch(eq)} style={smallBtn}>📥 {t("تسجيل الاستلام", "Record receipt")}</button>
                    </div>
                  </div>
                )}

                {openMovesId === eq.id && (
                  <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px dashed " + C.border }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: C.navy, marginBottom: 10 }}>📜 {t("سجل حركة هذه المعدة", "This equipment's movement log")}</div>
                    <table>
                      <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("من", "From")}</th><th style={th}>{t("إلى", "To")}</th><th style={th}>{t("السبب", "Reason")}</th><th style={th}>{t("الحالة", "Status")}</th><th style={th}>{t("المستلم", "Receiver")}</th></tr></thead>
                      <tbody>
                        {eqMoves.map((m) => (
                          <tr key={m.id}>
                            <td style={td}>{m.date}</td><td style={td}>{m.fromLocation}</td><td style={td}>{m.toLocation}</td><td style={td}>{m.reason}</td>
                            <td style={{ ...td, color: m.status === "pending_receipt" ? C.warn : C.success, fontWeight: 700 }}>{m.status === "pending_receipt" ? t("بانتظار التأكيد", "Awaiting confirmation") : t("مؤكّد", "Confirmed")}</td>
                            <td style={td}>{m.receivedBy || "—"}</td>
                          </tr>
                        ))}
                        {eqMoves.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد حركة بعد", "No movement yet")}</td></tr>}
                      </tbody>
                    </table>
                  </div>
                )}

                {openId === eq.id && (
                  <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px dashed " + C.border }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: C.navy, marginBottom: 10 }}>➕ {t("تسجيل صيانة جديدة", "Log new maintenance")}</div>
                    <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
                      <div><label style={smallLabel}>{t("التاريخ", "Date")}</label><input type="date" value={maintForm.date} onChange={(e) => setMaintForm((f) => ({ ...f, date: e.target.value }))} style={inputStyle2} /></div>
                      <div style={{ flex: "1 1 200px" }}><label style={smallLabel}>{t("وصف الصيانة", "Maintenance description")}</label><input value={maintForm.description} onChange={(e) => setMaintForm((f) => ({ ...f, description: e.target.value }))} style={inputStyle2} /></div>
                      <div><label style={smallLabel}>{t("التكلفة", "Cost")}</label><input type="number" step="0.01" value={maintForm.cost} onChange={(e) => setMaintForm((f) => ({ ...f, cost: e.target.value }))} style={{ ...inputStyle2, width: 110 }} /></div>
                      <div><label style={smallLabel}>{t("بواسطة", "By")}</label><input value={maintForm.performedBy} onChange={(e) => setMaintForm((f) => ({ ...f, performedBy: e.target.value }))} placeholder={currentUser.name} style={inputStyle2} /></div>
                      <button onClick={() => addMaintenance(eq.id)} style={ghostBtn}>➕ {t("تسجيل", "Log")}</button>
                    </div>
                    <table style={{ marginTop: 12 }}>
                      <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("الوصف", "Description")}</th><th style={th}>{t("التكلفة", "Cost")}</th><th style={th}>{t("بواسطة", "By")}</th></tr></thead>
                      <tbody>
                        {(maintenance[eq.id] || []).map((mrec) => (
                          <tr key={mrec.id}><td style={td}>{mrec.date}</td><td style={td}>{mrec.description}</td><td style={td}>{fmt(mrec.cost)}</td><td style={td}>{mrec.performedBy}</td></tr>
                        ))}
                        {(maintenance[eq.id] || []).length === 0 && <tr><td colSpan={4} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد سجل صيانة بعد", "No maintenance logged yet")}</td></tr>}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            );
          })}
          {equipment.length === 0 && <div style={{ color: "#9ca3af", fontSize: 13, textAlign: "center" }}>{t("لا يوجد معدات مسجّلة", "No equipment registered")}</div>}
        </div>
      </div>
    </div>
  );
}

/* ============ كشف حساب فرع: كل حركاته مع المستودع الرئيسي — كام استلم، من كام صنف، والرصيد الحالي عنده ============ */
function BranchStatementTab({ meta, lang, t, institutionName }) {
  const [moves, setMoves] = useState([]);
  const [branchStock, setBranchStock] = useState([]);
  const [counts, setCounts] = useState([]);
  const [selectedBranch, setSelectedBranch] = useState("");
  const [fromDate, setFromDate] = useState(new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0, 10));
  const [toDate, setToDate] = useState(todayStr());

  useEffect(() => { if (!selectedBranch && meta.branches?.length) setSelectedBranch(meta.branches[0]); }, [meta.branches]);
  useEffect(() => {
    const unsub = MOVES_COL.where("type", "==", "out").orderBy("createdAt", "desc").limit(3000).onSnapshot(
      (snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      () => { MOVES_COL.orderBy("createdAt", "desc").limit(4000).onSnapshot((snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((m) => m.type === "out"))); }
    );
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = BRANCH_STOCK_COL.onSnapshot((snap) => setBranchStock(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = COUNTS_COL.orderBy("createdAt", "desc").limit(100).onSnapshot((snap) => setCounts(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), () => {});
    return unsub;
  }, []);

  const branchMoves = moves.filter((m) => m.branch === selectedBranch).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const rangeMoves = branchMoves.filter((m) => m.date >= fromDate && m.date <= toDate);
  const branchCurrentStock = branchStock.filter((b) => b.branch === selectedBranch && (Number(b.qty) || 0) > 0.009);
  const branchCounts = counts.filter((c) => c.branch === selectedBranch).sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  const totalReceivedValue = branchMoves.reduce((s, m) => s + (Number(m.qty) || 0) * (Number(m.price) || 0), 0);
  const rangeReceivedValue = rangeMoves.reduce((s, m) => s + (Number(m.qty) || 0) * (Number(m.price) || 0), 0);
  const currentStockValue = branchCurrentStock.reduce((s, b) => s + (Number(b.qty) || 0) * (b.price || 0), 0);

  function doPrint() { window.print(); }

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={cardTitle}>📋 {t("كشف حساب فرع مع المستودع الرئيسي", "Branch Statement with Main Warehouse")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div>
            <label style={smallLabel}>{t("الفرع", "Branch")}</label>
            <select value={selectedBranch} onChange={(e) => setSelectedBranch(e.target.value)} style={{ ...inputStyle2, maxWidth: 240 }}>
              <GroupedBranchOptions meta={meta} />
            </select>
          </div>
          <div><label style={smallLabel}>{t("من تاريخ", "From")}</label><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} style={inputStyle2} /></div>
          <div><label style={smallLabel}>{t("إلى تاريخ", "To")}</label><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} style={inputStyle2} /></div>
        </div>
      </div>

      {selectedBranch && (
        <div className="print-area">
          <div className="print-only-header"><h2>{institutionName}</h2><div>{t("كشف حساب فرع", "Branch Statement")} — {selectedBranch}</div></div>

          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>{selectedBranch}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة الكشف", "Print statement")}</button>
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>

function WarehouseBackupCard({ t }) {
  const [working, setWorking] = useState(false);
  const [msg, setMsg] = useState("");

  async function downloadBackup() {
    setWorking(true); setMsg("");
    try {
      const [itemsSnap, movesSnap, suppliersSnap, branchStockSnap, countsSnap, notifsSnap] = await Promise.all([
        ITEMS_COL.get(), MOVES_COL.get(), SUPPLIERS_COL.get(), BRANCH_STOCK_COL.get(), COUNTS_COL.get(), WH_NOTIF_COL.get(),
      ]);

      function toRows(snap) {
        return snap.docs.map((d) => {
          const data = d.data();
          const row = { id: d.id };
          Object.keys(data).forEach((k) => {
            const v = data[k];
            row[k] = (v && typeof v === "object" && v.toDate) ? v.toDate().toISOString() : (typeof v === "object" ? JSON.stringify(v) : v);
          });
          return row;
        });
      }

      const wb = window.XLSX.utils.book_new();
      const sheets = [
        { name: "Items", rows: toRows(itemsSnap) },
        { name: "Moves", rows: toRows(movesSnap) },
        { name: "Suppliers", rows: toRows(suppliersSnap) },
        { name: "BranchStock", rows: toRows(branchStockSnap) },
        { name: "Counts", rows: toRows(countsSnap) },
        { name: "Notifications", rows: toRows(notifsSnap) },
      ];
      sheets.forEach((s) => {
        const ws = s.rows.length > 0 ? window.XLSX.utils.json_to_sheet(s.rows) : window.XLSX.utils.aoa_to_sheet([["لا يوجد بيانات"]]);
        window.XLSX.utils.book_append_sheet(wb, ws, s.name);
      });
      const stamp = todayStr();
      window.XLSX.writeFile(wb, `warehouse-backup-${stamp}.xlsx`);
      setMsg("✅ " + t("تم تحميل النسخة الاحتياطية بنجاح — احتفظ بالملف في مكان آمن", "Backup downloaded successfully — keep the file somewhere safe"));
    } catch (e) {
      setMsg("Error: " + e.message);
    }
    setWorking(false);
  }

  return (
    <div style={cardStyle}>
      <div style={cardTitle}>💾 {t("نسخة احتياطية شاملة", "Full Backup")}</div>
      <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>
        {t("بضغطة واحدة، هتنزّل ملف Excel فيه كل بيانات المستودع (الأصناف، كل حركات الوارد والصادر، الموردين، مخزون الفروع، سجل الجرد، والإشعارات) — احتفظ بيه على جهازك بشكل دوري.", "One click downloads an Excel file with all warehouse data (items, all in/out moves, suppliers, branch stock, count history, and notifications) — keep it on your device periodically.")}
      </div>
      <button onClick={downloadBackup} disabled={working} style={smallBtn}>
        {working ? t("جارِ التحضير...", "Preparing...") : "⬇️ " + t("تحميل نسخة احتياطية الآن", "Download backup now")}
      </button>
      {msg && <div style={{ marginTop: 10, fontSize: 13, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
    </div>
  );
}

function ItemPicker({ items, lang, t, onPick, selectedItem }) {
  const [search, setSearch] = useState("");
  const [showScanner, setShowScanner] = useState(false);
  const filtered = items.filter((it) => {
    const s = search.trim().toLowerCase();
    if (!s) return false;
    return (it.nameAr || "").toLowerCase().includes(s) || (it.nameEn || "").toLowerCase().includes(s) || (it.sku || "").toLowerCase().includes(s);
  }).slice(0, 8);

  function onScanFound(code) {
    setShowScanner(false);
    const found = items.find((it) => it.sku === code);
    if (found) onPick(found);
    else alert(t("الكود ده مش مسجّل لأي صنف", "This code isn't registered to any item"));
  }

  return (
    <div>
      <label style={smallLabel}>{t("اختر الصنف (اكتب أو امسح بالكاميرا)", "Choose item (type or scan)")}</label>
      <div style={{ display: "flex", gap: 6, position: "relative" }}>
        <input value={selectedItem ? (lang === "ar" ? (selectedItem.nameAr || selectedItem.nameEn) : (selectedItem.nameEn || selectedItem.nameAr)) : search}
          onChange={(e) => { setSearch(e.target.value); onPick(null); }} style={inputStyle2}
          placeholder={t("اكتب اسم الصنف...", "Type item name...")} />
        <button type="button" onClick={() => setShowScanner(true)} style={{ ...smallBtn, padding: "0 16px" }}>📷</button>
        {!selectedItem && search && filtered.length > 0 && (
          <div style={{ position: "absolute", top: "100%", right: 0, left: 60, background: "#fff", border: "1px solid " + C.border, borderRadius: 8, marginTop: 4, zIndex: 10, boxShadow: "0 8px 20px rgba(0,0,0,0.1)" }}>
            {filtered.map((it) => (
              <div key={it.id} onClick={() => { onPick(it); setSearch(""); }} style={{ padding: "8px 12px", cursor: "pointer", fontSize: 13, borderBottom: "1px solid " + C.border }}>
                <div style={{ fontWeight: 700 }}>{lang === "ar" ? (it.nameAr || it.nameEn) : (it.nameEn || it.nameAr)} {it.institution && <span style={{ fontSize: 10.5, color: C.blue, fontWeight: 700 }}>({it.institution})</span>}</div>
                <div style={{ fontSize: 11, color: C.muted }}>{it.sku} — {t("الرصيد", "Qty")}: {fmt(it.qty)}</div>
              </div>
            ))}
          </div>
        )}
      </div>
      {showScanner && <CameraScanner onScan={onScanFound} onClose={() => setShowScanner(false)} />}
    </div>
  );
}
