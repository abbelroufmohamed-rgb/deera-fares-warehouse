/* ============ توليد QR لصنف (يشفّر كود الصنف فقط) — بيستخدم مكتبة qrcode-generator الموثوقة، بيرسم كصورة data URL ============ */
/* ============ ضغط صورة داخل المتصفح قبل الحفظ (نفس أسلوب تطبيق الكاشير) — بيرجع data URL جاهز للتخزين في Firestore ============ */
/* ============ شجرة الفروع (نفس بيانات الكاشير بالظبط — meta.branchTree): تجميع الفروع تحت المؤسسة/النشاط الأب ============ */
function buildTreeChildren(nodes, parentId) {
  return nodes.filter((n) => (n.parentId || null) === (parentId || null));
}
function collectDescendantBranchNames(nodeId, nodes) {
  const node = nodes.find((n) => n.id === nodeId);
  if (!node) return [];
  let names = node.branchName ? [node.branchName] : [];
  buildTreeChildren(nodes, nodeId).forEach((child) => { names = names.concat(collectDescendantBranchNames(child.id, nodes)); });
  return Array.from(new Set(names));
}
/* بيرجع قائمة تجميعية: كل عقدة جذر (مؤسسة/نشاط) مع كل الفروع اللي تحتها — يستخدم في القوائم المنسّدة المجمّعة وفي تحليل حسب المؤسسة */
function buildBranchGroups(branchTree) {
  const tree = branchTree || [];
  const roots = buildTreeChildren(tree, null);
  return roots.map((root) => ({
    id: root.id, name: root.name, branches: collectDescendantBranchNames(root.id, tree),
  })).filter((g) => g.branches.length > 0);
}
/* كل الكيانات (عُقد الجذر) بأسمائها فقط — حتى لو لسه ما ربطتش فروع تحتها، عشان تستخدم كتصنيف للأصناف من الأول */
function getAllEntityNames(branchTree) {
  const tree = branchTree || [];
  return buildTreeChildren(tree, null).map((root) => root.name);
}

/* بيترسم options مجمّعة تحت المؤسسة (لو فيه شجرة)، أو قائمة عادية لو لسه محدش بنى الشجرة */
function GroupedBranchOptions({ meta }) {
  const groups = buildBranchGroups(meta.branchTree);
  const groupedNames = new Set(groups.flatMap((g) => g.branches));
  const ungrouped = (meta.branches || []).filter((b) => !groupedNames.has(b));
  return (
    <>
      {groups.map((g) => (
        <optgroup key={g.id} label={g.name}>
          {g.branches.map((b) => <option key={b} value={b}>{b}</option>)}
        </optgroup>
      ))}
      {ungrouped.length > 0 && (
        <optgroup label="فروع أخرى">
          {ungrouped.map((b) => <option key={b} value={b}>{b}</option>)}
        </optgroup>
      )}
    </>
  );
}

function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function ItemQRCode({ code, size = 110 }) {
  const [dataUrl, setDataUrl] = useState("");
  useEffect(() => {
    if (window.qrcode && code) {
      try {
        const qr = window.qrcode(0, "M");
        qr.addData(String(code));
        qr.make();
        const cellSize = Math.max(2, Math.floor(size / qr.getModuleCount()));
        setDataUrl(qr.createDataURL(cellSize, 4));
      } catch (e) { setDataUrl(""); }
    }
  }, [code, size]);
  if (!dataUrl) return <div style={{ width: size, height: size, background: "#f3f4f6", borderRadius: 6 }} />;
  return <img src={dataUrl} alt="QR" style={{ width: size, height: size }} />;
}

/* ============ ماسح كاميرا حي لقراءة كود الصنف — بيستخدم مكتبة html5-qrcode، بيفتح الكاميرا مباشرة من المتصفح ============ */
function CameraScanner({ onScan, onClose }) {
  const regionId = "qr-scan-region-" + useRef(uid()).current;
  const scannerRef = useRef(null);
  const [error, setError] = useState("");

  useEffect(() => {
    let stopped = false;
    const scanner = new Html5Qrcode(regionId);
    scannerRef.current = scanner;
    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 230, height: 230 } },
      (decodedText) => {
        if (stopped) return;
        stopped = true;
        scanner.stop().catch(() => {}).finally(() => onScan(decodedText));
      },
      () => {}
    ).catch((e) => setError("تعذر فتح الكاميرا: " + (e.message || e) + " — تأكد من السماح بالوصول للكاميرا من إعدادات المتصفح"));

    return () => {
      if (!stopped) scanner.stop().catch(() => {});
    };
    // eslint-disable-next-line
  }, []);

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(8,15,35,0.92)", zIndex: 1000,
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20,
    }}>
      <div style={{ color: "#fff", fontWeight: 700, marginBottom: 14, fontSize: 15 }}>📷 وجّه الكاميرا على كود الصنف</div>
      <div id={regionId} style={{ width: 280, maxWidth: "90vw", borderRadius: 14, overflow: "hidden" }} />
      {error && <div style={{ color: "#fca5a5", marginTop: 14, fontSize: 13, textAlign: "center", maxWidth: 320 }}>{error}</div>}
      <button onClick={onClose} style={{ ...ghostBtn, marginTop: 20, background: "#fff" }}>إلغاء</button>
    </div>
  );
}

/* ============ شاشة إدارة الأصناف: إضافة/تعديل صنف بكوده وسعره وحده الأدنى — ثنائية اللغة ============ */
function ItemsTab({ currentUser, lang, t, whMeta, meta }) {
  const restrictedEntity = getUserEntityRestriction(currentUser, whMeta);
  const allEntities = getAllEntityNames(meta.branchTree); // نفس كيانات شجرة الفروع (ratio, 24, مسكوب...)
  const entities = restrictedEntity ? [restrictedEntity] : allEntities; // لو الموظف مقيّد بكيان، ما يشوفش غيره خالص

  const [items, setItems] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyItem());
  const [search, setSearch] = useState("");
  const [msg, setMsg] = useState("");
  const [showScanner, setShowScanner] = useState(false);
  const [qrItem, setQrItem] = useState(null);
  const [historyItem, setHistoryItem] = useState(null);
  const [importing, setImporting] = useState(false);
  const [importErrors, setImportErrors] = useState([]);
  const [importSummary, setImportSummary] = useState("");
  const [importDefaultEntity, setImportDefaultEntity] = useState("");
  const [bulkAssignTarget, setBulkAssignTarget] = useState("");
  const [bulkAssigning, setBulkAssigning] = useState(false);
  const [entityFilter, setEntityFilter] = useState(restrictedEntity || "all");
  const fileInputRef = useRef(null);

  function emptyItem() { return { nameAr: "", nameEn: "", sku: "", unit: "قطعة", price: "", minStock: "", category: "", institution: entities[0] || "", qty: 0 }; }

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => {
      setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, []);

  function set(key, val) { setForm((f) => ({ ...f, [key]: val })); }

  // أعمدة ملف Excel (نفس الترتيب للتصدير والاستيراد)
  const EXPORT_HEADERS = [
    { key: "nameAr", labelAr: "اسم الصنف (عربي)", labelEn: "Item name (Arabic)" },
    { key: "nameEn", labelAr: "اسم الصنف (إنجليزي)", labelEn: "Item name (English)" },
    { key: "sku", labelAr: "الكود", labelEn: "Code" },
    { key: "unit", labelAr: "وحدة القياس", labelEn: "Unit" },
    { key: "price", labelAr: "السعر", labelEn: "Price" },
    { key: "minStock", labelAr: "الحد الأدنى", labelEn: "Min stock" },
    { key: "category", labelAr: "الفئة", labelEn: "Category" },
    { key: "institution", labelAr: "الكيان (اختياري — لو فاضي هياخد الكيان الافتراضي المختار وقت الرفع)", labelEn: "Entity (optional — if empty, uses the default entity chosen at upload time)" },
    { key: "qty", labelAr: "الرصيد الحالي (للعرض فقط، متغيّرش)", labelEn: "Current qty (read-only, don't edit)" },
  ];

  function exportExcel() {
    const headerRow = EXPORT_HEADERS.map((h) => lang === "ar" ? h.labelAr : h.labelEn);
    const rows = (items || []).map((it) => EXPORT_HEADERS.map((h) => it[h.key] ?? ""));
    const ws = window.XLSX.utils.aoa_to_sheet([headerRow, ...rows]);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, "Items");
    window.XLSX.writeFile(wb, "warehouse-items.xlsx");
  }
  function downloadTemplate() {
    const headerRow = EXPORT_HEADERS.filter((h) => h.key !== "qty").map((h) => lang === "ar" ? h.labelAr : h.labelEn);
    const ws = window.XLSX.utils.aoa_to_sheet([headerRow]);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, "Template");
    window.XLSX.writeFile(wb, "warehouse-items-template.xlsx");
  }

  function buildErrorMailto(errors) {
    if (!currentUser.email) return null;
    const subject = t(`أخطاء استيراد أصناف المستودع (${errors.length})`, `Warehouse items import errors (${errors.length})`);
    const body = errors.map((e) => `${t("صف", "Row")} ${e.row}: ${e.reason}`).join("\n");
    return "mailto:" + currentUser.email + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }

  async function importExcel(file) {
    setImporting(true); setImportErrors([]); setImportSummary("");
    try {
      const buf = await file.arrayBuffer();
      const wb = window.XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false });
      const dataRows = rows.slice(1); // تجاهل صف العناوين

      let added = 0, updated = 0;
      const errors = [];
      for (let i = 0; i < dataRows.length; i++) {
        const r = dataRows[i];
        const rowNum = i + 2; // رقم الصف الحقيقي في الملف (1 = العناوين)
        const nameAr = String(r[0] || "").trim();
        const nameEn = String(r[1] || "").trim();
        const sku = String(r[2] || "").trim();
        const unit = String(r[3] || "").trim() || "قطعة";
        const price = Number(r[4]) || 0;
        const minStock = Number(r[5]) || 0;
        const category = String(r[6] || "").trim();
        // العمود الثامن (اختياري): كيان لكل صنف لوحده — لو فاضي، بناخد الكيان الافتراضي المختار فوق الرفع
        const rowInstitution = String(r[7] || "").trim();
        const institution = rowInstitution || importDefaultEntity;

        if (!nameAr && !nameEn) { errors.push({ row: rowNum, reason: t("الصف فاضي من اسم الصنف (عربي أو إنجليزي)", "Row is missing item name (Arabic or English)") }); continue; }
        try {
          const existing = sku ? (items || []).find((it) => it.sku === sku) : null;
          if (existing) {
            await ITEMS_COL.doc(existing.id).update({ nameAr, nameEn, unit, price, minStock, category, institution });
            updated++;
          } else {
            await ITEMS_COL.add({
              nameAr, nameEn, sku: sku || uid().toUpperCase(), unit, price, minStock, category, institution,
              qty: 0, institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
            added++;
          }
        } catch (e) {
          errors.push({ row: rowNum, reason: e.message });
        }
      }
      setImportErrors(errors);
      setImportSummary(t(`تم الاستيراد: ${added} صنف جديد، ${updated} صنف اتحدّث` + (errors.length ? `، ${errors.length} صف فيه خطأ` : ""), `Import done: ${added} new, ${updated} updated` + (errors.length ? `, ${errors.length} row(s) with errors` : "")));
    } catch (e) {
      setImportErrors([{ row: "—", reason: t("تعذر قراءة الملف: ", "Could not read file: ") + e.message }]);
    }
    setImporting(false);
  }

  async function bulkAssignEntity() {
    if (!bulkAssignTarget) { setMsg(t("اختر الكيان أولًا", "Choose the entity first")); return; }
    const targetItems = (items || []).filter((it) => !it.institution);
    if (targetItems.length === 0) return;
    if (!confirm(t(`هل تريد تعيين "${bulkAssignTarget}" كيانًا لـ ${targetItems.length} صنف بدون كيان محدد؟`, `Assign "${bulkAssignTarget}" as the entity for ${targetItems.length} item(s) with no entity set?`))) return;
    setBulkAssigning(true); setMsg("");
    try {
      // Firestore batch محدود بـ500 عملية، فبنقسّم على دفعات لو العدد أكبر
      const chunkSize = 450;
      for (let i = 0; i < targetItems.length; i += chunkSize) {
        const chunk = targetItems.slice(i, i + chunkSize);
        const batch = db.batch();
        chunk.forEach((it) => batch.update(ITEMS_COL.doc(it.id), { institution: bulkAssignTarget }));
        await batch.commit();
      }
      setMsg("✅ " + t(`تم تعيين الكيان لـ ${targetItems.length} صنف بنجاح`, `Entity assigned to ${targetItems.length} item(s) successfully`));
      setBulkAssignTarget("");
    } catch (e) { setMsg("Error: " + e.message); }
    setBulkAssigning(false);
  }

  async function save() {
    if (!form.nameAr.trim() && !form.nameEn.trim()) { setMsg(t("اكتب اسم الصنف بالعربي أو الإنجليزي", "Enter the item name in Arabic or English")); return; }
    const code = form.sku.trim() || uid().toUpperCase();
    try {
      if (editingId) {
        await ITEMS_COL.doc(editingId).update({
          nameAr: form.nameAr.trim(), nameEn: form.nameEn.trim(), sku: code, unit: form.unit,
          price: Number(form.price) || 0, minStock: Number(form.minStock) || 0, category: form.category.trim(),
          institution: form.institution || "",
        });
        setMsg(t("✅ تم تحديث الصنف", "✅ Item updated"));
      } else {
        await ITEMS_COL.add({
          nameAr: form.nameAr.trim(), nameEn: form.nameEn.trim(), sku: code, unit: form.unit,
          price: Number(form.price) || 0, minStock: Number(form.minStock) || 0, category: form.category.trim(),
          institution: form.institution || "",
          qty: 0, institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        setMsg(t("✅ تم إضافة الصنف — سجّل أول كمية وارد من تبويب \"وارد للمستودع\"", "✅ Item added — record first stock-in from the \"Stock In\" tab"));
      }
      setForm(emptyItem()); setEditingId(null);
    } catch (e) { setMsg("Error: " + e.message); }
  }

  function editItem(it) {
    setForm({ nameAr: it.nameAr || "", nameEn: it.nameEn || "", sku: it.sku || "", unit: it.unit || "قطعة", price: it.price || "", minStock: it.minStock || "", category: it.category || "", institution: it.institution || "" });
    setEditingId(it.id);
  }
  async function removeItem(it) {
    if (!confirm(t(`حذف الصنف "${it.nameAr}"؟`, `Delete item "${it.nameEn || it.nameAr}"?`))) return;
    await ITEMS_COL.doc(it.id).delete();
  }

  const filtered = (items || []).filter((it) => {
    if (entityFilter !== "all" && (it.institution || "") !== entityFilter) return false;
    const s = search.trim().toLowerCase();
    if (!s) return true;
    return (it.nameAr || "").toLowerCase().includes(s) || (it.nameEn || "").toLowerCase().includes(s) || (it.sku || "").toLowerCase().includes(s);
  });

  function onScanFound(code) {
    setShowScanner(false);
    const found = (items || []).find((it) => it.sku === code);
    if (found) { editItem(found); setMsg(t("تم العثور على الصنف بالمسح", "Item found by scan")); }
    else { setMsg(t("الكود ده مش مسجّل لأي صنف", "This code isn't registered to any item")); }
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>{editingId ? t("✏️ تعديل صنف", "✏️ Edit item") : t("➕ صنف جديد", "➕ New item")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>{t("اسم الصنف (عربي)", "Item name (Arabic)")}</label>
            <input value={form.nameAr} onChange={(e) => set("nameAr", e.target.value)} style={inputStyle2} placeholder="بن قهوة عربي" />
          </div>
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>{t("اسم الصنف (إنجليزي)", "Item name (English)")}</label>
            <input value={form.nameEn} onChange={(e) => set("nameEn", e.target.value)} style={inputStyle2} placeholder="Arabic Coffee Beans" />
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>{t("كود الصنف (اختياري)", "Item code (optional)")}</label>
            <div style={{ display: "flex", gap: 6 }}>
              <input value={form.sku} onChange={(e) => set("sku", e.target.value)} style={inputStyle2} placeholder={t("سيتولّد تلقائيًا", "Auto-generated")} />
              <button type="button" onClick={() => setShowScanner(true)} style={{ ...ghostBtn, padding: "0 12px" }}>📷</button>
            </div>
          </div>
          <div style={{ flex: "1 1 120px" }}>
            <label style={smallLabel}>{t("وحدة القياس", "Unit")}</label>
            <select value={form.unit} onChange={(e) => set("unit", e.target.value)} style={inputStyle2}>
              {(whMeta.units || DEFAULT_UNITS).map((u) => <option key={u} value={u}>{u}</option>)}
            </select>
          </div>
          <div style={{ flex: "1 1 130px" }}>
            <label style={smallLabel}>{t("سعر الوحدة (ر.س)", "Unit price (SAR)")}</label>
            <input type="number" step="0.01" value={form.price} onChange={(e) => set("price", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 130px" }}>
            <label style={smallLabel}>{t("حد أدنى للتنبيه", "Min stock alert")}</label>
            <input type="number" step="0.01" value={form.minStock} onChange={(e) => set("minStock", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 150px" }}>
            <label style={smallLabel}>{t("الفئة (اختياري)", "Category (optional)")}</label>
            <input value={form.category} onChange={(e) => set("category", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>🏢 {t("الكيان (بضاعة مستقلة)", "Entity (independent stock)")}</label>
            <select value={form.institution} onChange={(e) => set("institution", e.target.value)} style={inputStyle2}>
              <option value="">{t("بدون كيان محدّد", "No specific entity")}</option>
              {entities.map((e) => <option key={e} value={e}>{e}</option>)}
            </select>
          </div>
        </div>
        <div style={{ marginTop: 14, display: "flex", gap: 10, alignItems: "center" }}>
          <button onClick={save} style={smallBtn}>{editingId ? t("💾 حفظ التعديل", "💾 Save changes") : t("➕ إضافة الصنف", "➕ Add item")}</button>
          {editingId && <button onClick={() => { setForm(emptyItem()); setEditingId(null); }} style={ghostBtn}>{t("إلغاء", "Cancel")}</button>}
          {msg && <span style={{ fontSize: 13, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</span>}
        </div>
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>📊 {t("تصدير واستيراد الأصناف عبر Excel", "Export/Import items via Excel")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>
          {t("حمّل نموذج فاضي، عبّيه بالأصناف اللي تحبها، وارفعه تاني — أي كود موجود مسبقًا هيتحدّث، وأي كود جديد هيتضاف كصنف جديد.", "Download an empty template, fill it in, then upload it back — existing codes update, new codes get added as new items.")}
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
          <button onClick={downloadTemplate} style={ghostBtn}>📄 {t("تحميل نموذج فاضي", "Download empty template")}</button>
          <button onClick={exportExcel} style={ghostBtn}>⬇️ {t("تصدير كل الأصناف الحالية", "Export all current items")}</button>
        </div>
        {entities.length > 0 && (
          <div style={{ marginTop: 12, background: C.blueSoft, borderRadius: 10, padding: "10px 14px" }}>
            <label style={smallLabel}>🏢 {t("الكيان الافتراضي لهذا الرفع (لو كل الأصناف في الملف لنفس الكيان)", "Default entity for this upload (if all items in the file belong to the same entity)")}</label>
            <select value={importDefaultEntity} onChange={(e) => setImportDefaultEntity(e.target.value)} style={{ ...inputStyle2, maxWidth: 260 }}>
              <option value="">{t("بدون كيان افتراضي", "No default entity")}</option>
              {entities.map((e) => <option key={e} value={e}>{e}</option>)}
            </select>
          </div>
        )}
        <div style={{ marginTop: 12 }}>
          <input type="file" accept=".xlsx,.xls" ref={fileInputRef} style={{ display: "none" }}
            onChange={(e) => { if (e.target.files[0]) importExcel(e.target.files[0]); e.target.value = ""; }} />
          <button onClick={() => fileInputRef.current?.click()} disabled={importing} style={smallBtn}>
            {importing ? t("جارِ الاستيراد...", "Importing...") : "⬆️ " + t("رفع ملف Excel معبّى", "Upload filled Excel file")}
          </button>
        </div>
        {importSummary && <div style={{ marginTop: 12, fontSize: 13.5, fontWeight: 700, color: importErrors.length ? C.warn : C.success }}>{importSummary}</div>}
        {importErrors.length > 0 && (
          <div style={{ marginTop: 10, background: "#fef2f2", border: "1px solid #fecaca", borderRadius: 10, padding: "12px 14px" }}>
            <div style={{ fontWeight: 700, color: C.danger, marginBottom: 8, fontSize: 13 }}>⚠️ {t("أخطاء أثناء الاستيراد", "Errors during import")}:</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 10 }}>
              {importErrors.map((e, i) => (
                <div key={i} style={{ fontSize: 12.5, color: "#991b1b" }}>{t("صف", "Row")} {e.row}: {e.reason}</div>
              ))}
            </div>
            {currentUser.email ? (
              <a href={buildErrorMailto(importErrors)} style={{
                display: "inline-flex", alignItems: "center", gap: 6, background: C.blue, color: "#fff",
                borderRadius: 20, padding: "6px 14px", fontSize: 12.5, fontWeight: 700, textDecoration: "none",
              }}>📧 {t("راسلني بتفاصيل الأخطاء دي", "Email me these error details")}</a>
            ) : (
              <div style={{ fontSize: 11.5, color: C.muted }}>{t("ملاحظة: أضف إيميلك في نظام الكاشير (إدارة المستخدمين) عشان يظهر زرار المراسلة هنا.", "Note: add your email in the cashier system (user management) to enable the email button here.")}</div>
            )}
          </div>
        )}
      </div>

      {entities.length > 0 && (
        <div style={cardStyle}>
          <div style={cardTitle}>🏢 {t("تعيين كيان بالجملة", "Bulk Assign Entity")}</div>
          <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>
            {t("رفعت أصناف قبل ما تحدد لها كيان؟ اختار الكيان هنا وهيتطبّق مرة واحدة على كل الأصناف اللي لسه من غير كيان، من غير ما تحتاج تعدّل كل صنف لوحده أو ترفع الملف تاني.", "Uploaded items before assigning them an entity? Pick the entity here and it'll apply at once to every item that still has no entity — no need to edit each one or re-upload the file.")}
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
            <select value={bulkAssignTarget} onChange={(e) => setBulkAssignTarget(e.target.value)} style={{ ...inputStyle2, maxWidth: 220 }}>
              <option value="">{t("اختر الكيان", "Choose entity")}</option>
              {entities.map((e) => <option key={e} value={e}>{e}</option>)}
            </select>
            <button onClick={bulkAssignEntity} disabled={bulkAssigning || !bulkAssignTarget} style={smallBtn}>
              {bulkAssigning ? t("جارِ التطبيق...", "Applying...") : t(`تطبيق على كل الأصناف بدون كيان (${(items || []).filter((it) => !it.institution).length})`, `Apply to all items without an entity (${(items || []).filter((it) => !it.institution).length})`)}
            </button>
          </div>
        </div>
      )}

      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
          <div style={{ ...cardTitle, marginBottom: 0, border: "none", padding: 0 }}>📋 {t("كل الأصناف", "All items")} ({filtered.length})</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {entities.length > 0 && (
              <select value={entityFilter} onChange={(e) => setEntityFilter(e.target.value)} disabled={!!restrictedEntity} style={{ ...inputStyle2, maxWidth: 180 }}>
                {!restrictedEntity && <option value="all">{t("كل الكيانات", "All entities")}</option>}
                {entities.map((e) => <option key={e} value={e}>{e}</option>)}
              </select>
            )}
            <input value={search} onChange={(e) => setSearch(e.target.value)} style={{ ...inputStyle2, maxWidth: 240 }} placeholder={t("بحث بالاسم أو الكود...", "Search name or code...")} />
          </div>
        </div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr>
              <th style={th}>{t("الاسم", "Name")}</th><th style={th}>🏢 {t("الكيان", "Entity")}</th><th style={th}>{t("الكود", "Code")}</th><th style={th}>{t("الوحدة", "Unit")}</th>
              <th style={th}>{t("السعر", "Price")}</th><th style={th}>{t("الرصيد الحالي", "Current qty")}</th><th style={th}>{t("قيمة المخزون", "Stock value")}</th>
              <th style={th}>QR</th><th style={th}></th>
            </tr></thead>
            <tbody>
              {filtered.map((it) => {
                const low = it.minStock > 0 && (it.qty || 0) <= it.minStock;
                return (
                  <tr key={it.id} style={{ background: low ? "#fef2f2" : undefined }}>
                    <td style={td}>
                      <div style={{ fontWeight: 700 }}>{lang === "ar" ? (it.nameAr || it.nameEn) : (it.nameEn || it.nameAr)}</div>
                      {it.category && <div style={{ fontSize: 11, color: C.muted }}>{it.category}</div>}
                    </td>
                    <td style={td}>{it.institution ? <span style={{ background: C.blueSoft, borderRadius: 12, padding: "3px 10px", fontSize: 12, fontWeight: 700, color: C.navy }}>{it.institution}</span> : "—"}</td>
                    <td style={td}>{it.sku}</td>
                    <td style={td}>{it.unit}</td>
                    <td style={td}>{fmt(it.price)}</td>
                    <td style={{ ...td, fontWeight: 800, color: low ? C.danger : C.navy }}>{fmt(it.qty)} {low && "⚠️"}</td>
                    <td style={td}>{fmt((it.qty || 0) * (it.price || 0))}</td>
                    <td style={td}><span onClick={() => setQrItem(it)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700 }}>{t("عرض/طباعة", "View/Print")}</span></td>
                    <td style={td}>
                      <span onClick={() => setHistoryItem(it)} style={{ cursor: "pointer", color: C.navy, fontWeight: 700, marginLeft: 10 }}>🧾 {t("مسار الصنف", "Item trail")}</span>
                      <span onClick={() => editItem(it)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700, marginLeft: 10 }}>{t("تعديل", "Edit")}</span>
                      <span onClick={() => removeItem(it)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700 }}>{t("حذف", "Delete")}</span>
                    </td>
                  </tr>
                );
              })}
              {filtered.length === 0 && <tr><td colSpan={9} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد أصناف", "No items")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {showScanner && <CameraScanner onScan={onScanFound} onClose={() => setShowScanner(false)} />}
      {qrItem && <ItemLabelModal item={qrItem} lang={lang} t={t} onClose={() => setQrItem(null)} />}
      {historyItem && <ItemHistoryModal item={historyItem} lang={lang} t={t} onClose={() => setHistoryItem(null)} />}
    </div>
  );
}

/* ============ نافذة عرض/طباعة ملصق الباركود لصنف واحد ============ */
/* ============ شاشة الإعدادات: إدارة الفروع (مشتركة مع الكاشير) ووحدات القياس ============ */
function WarehouseSettingsTab({ meta, whMeta, users, t }) {
  const [newBranch, setNewBranch] = useState("");
  const [newUnit, setNewUnit] = useState("");
  const [msg, setMsg] = useState("");

  async function addBranch() {
    const name = newBranch.trim();
    if (!name) return;
    if ((meta.branches || []).includes(name)) { setMsg(t("الفرع ده موجود بالفعل", "Branch already exists")); return; }
    await META_DOC.update({ branches: firebase.firestore.FieldValue.arrayUnion(name) });
    setNewBranch(""); setMsg("✅ " + t("تمت إضافة الفرع", "Branch added"));
  }
  async function removeBranch(name) {
    // نتأكد الأول إن الفرع ده مالوش أي أرصدة بضاعة معلّقة قبل ما نسمح بحذفه
    const stockSnap = await BRANCH_STOCK_COL.where("branch", "==", name).get().catch(() => null);
    const hasStock = stockSnap && stockSnap.docs.some((d) => (Number(d.data().qty) || 0) > 0.009);
    if (hasStock) {
      setMsg(t(`مينفعش تحذف فرع "${name}" — لسه فيه أرصدة بضاعة مسجّلة عليه. صفّي رصيده الأول من "جرد الفروع".`, `Can't delete "${name}" — it still has stock recorded. Clear its balance first from Branch Count.`));
      return;
    }
    if (!confirm(t(`حذف فرع "${name}"؟`, `Delete branch "${name}"?`))) return;
    await META_DOC.update({ branches: firebase.firestore.FieldValue.arrayRemove(name) });
  }

  async function addUnit() {
    const name = newUnit.trim();
    if (!name) return;
    const current = whMeta.units || DEFAULT_UNITS;
    if (current.includes(name)) { setMsg(t("وحدة القياس دي موجودة بالفعل", "Unit already exists")); return; }
    await WH_META_DOC.set({ units: firebase.firestore.FieldValue.arrayUnion(name) }, { merge: true });
    setNewUnit(""); setMsg("✅ " + t("تمت إضافة وحدة القياس", "Unit added"));
  }
  async function removeUnit(name) {
    if (!confirm(t(`حذف وحدة "${name}"؟`, `Delete unit "${name}"?`))) return;
    const current = whMeta.units || DEFAULT_UNITS;
    await WH_META_DOC.set({ units: current.filter((u) => u !== name) }, { merge: true });
  }

  async function setUserWhRole(userId, role) {
    const current = whMeta.userRoles || {};
    if (!role) {
      await WH_META_DOC.set({ userRoles: { [userId]: firebase.firestore.FieldValue.delete() } }, { merge: true });
    } else {
      await WH_META_DOC.set({ userRoles: { ...current, [userId]: role } }, { merge: true });
    }
  }

  async function setUserEntity(userId, entity) {
    const current = whMeta.userEntity || {};
    if (!entity) {
      await WH_META_DOC.set({ userEntity: { [userId]: firebase.firestore.FieldValue.delete() } }, { merge: true });
    } else {
      await WH_META_DOC.set({ userEntity: { ...current, [userId]: entity } }, { merge: true });
    }
  }

  const entities = getAllEntityNames(meta.branchTree);

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>👥 {t("أدوار المستودع (مستقلة عن أدوار الكاشير)", "Warehouse Roles (independent from cashier roles)")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("حدّد لكل مستخدم دوره في نظام المستودع، وممكن كمان تقيّده يشوف بضاعة كيان واحد بس (مثلاً موظف يشوف \"ريشيو\" بس ومش يشوف \"24\" أو \"مسكوب\").", "Assign each user their role in the warehouse system, and optionally restrict them to seeing only one entity's stock (e.g. an employee sees only \"Ratio\", not \"24\" or \"Maskoub\").")}</div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th style={th}>{t("المستخدم", "User")}</th><th style={th}>{t("دوره في الكاشير", "Cashier role")}</th><th style={th}>{t("دوره في المستودع", "Warehouse role")}</th><th style={th}>🏢 {t("مقيّد بكيان", "Restricted to entity")}</th></tr></thead>
            <tbody>
              {(users || []).map((u) => (
                <tr key={u.id}>
                  <td style={{ ...td, fontWeight: 700 }}>{u.name}</td>
                  <td style={td}>{ROLE_LABELS[u.role] || u.role}</td>
                  <td style={td}>
                    <select value={(whMeta.userRoles || {})[u.id] || ""} onChange={(e) => setUserWhRole(u.id, e.target.value)} style={{ ...inputStyle2, maxWidth: 180 }}>
                      <option value="">{t("بدون صلاحية مستودع", "No warehouse access")}</option>
                      <option value="wh_admin">{t("مدير مستودع", "Warehouse manager")}</option>
                      <option value="wh_staff">{t("موظف مستودع", "Warehouse staff")}</option>
                    </select>
                  </td>
                  <td style={td}>

      <div style={cardStyle}>

        </div>

      <WarehouseBackupCard t={t} />

  );
}

/* ============ نسخة احتياطية شاملة: تصدير كل بيانات المستودع (أصناف، حركات، موردين، مخزون فروع، جرد، إشعارات) في ملف Excel واحد ============ */
/* ============ قائمة شراء مقترحة تلقائيًا: أصناف قريبة من النفاذ بناءً على معدل الاستهلاك الفعلي، قابلة للتصدير كأمر شراء ============ */
function SuggestedPurchaseTab({ lang, t, institutionName }) {
  const [items, setItems] = useState([]);
  const [moves, setMoves] = useState([]);
  const [daysWindow, setDaysWindow] = useState(30); // نافذة تحليل الاستهلاك

  useEffect(() => {
    const unsub = ITEMS_COL.orderBy("nameAr").onSnapshot((snap) => setItems(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = MOVES_COL.orderBy("createdAt", "desc").limit(3000).onSnapshot((snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);

  const suggestions = useMemo(() => {
    const fromDate = new Date(Date.now() - daysWindow * 86400000).toISOString().slice(0, 10);
    const consumedByItem = {};
    const lastSupplierByItem = {};
    moves.forEach((m) => {
      if (m.type === "out" && m.date >= fromDate) consumedByItem[m.itemId] = (consumedByItem[m.itemId] || 0) + (Number(m.qty) || 0);
      if (m.type === "in" && m.supplierName && !lastSupplierByItem[m.itemId]) lastSupplierByItem[m.itemId] = m.supplierName;
    });
    return items.map((it) => {
      const consumed = consumedByItem[it.id] || 0;
      const dailyRate = consumed / daysWindow;
      const currentQty = Number(it.qty) || 0;
      const daysLeft = dailyRate > 0 ? currentQty / dailyRate : Infinity;
      const needsReorder = (it.minStock > 0 && currentQty <= it.minStock) || (dailyRate > 0 && daysLeft <= 14);
      // كمية مقترحة: تغطية 30 يوم قادمة، مطروح منها المتاح حاليًا
      const suggestedQty = Math.max(0, Math.ceil(dailyRate * 30 - currentQty));
      return { ...it, dailyRate, daysLeft, needsReorder, suggestedQty, lastSupplier: lastSupplierByItem[it.id] || "" };
    }).filter((it) => it.needsReorder).sort((a, b) => a.daysLeft - b.daysLeft);
    // eslint-disable-next-line
  }, [items, moves, daysWindow]);

  function exportOrder() {
    const headerRow = [t("الصنف", "Item"), t("الرصيد الحالي", "Current qty"), t("الكمية المقترحة", "Suggested qty"), t("آخر مورد", "Last supplier"), t("السعر التقديري", "Estimated price"), t("القيمة التقديرية", "Estimated value")];
    const rows = suggestions.map((s) => [
      lang === "ar" ? (s.nameAr || s.nameEn) : (s.nameEn || s.nameAr), s.qty, s.suggestedQty, s.lastSupplier, s.price, s.suggestedQty * (s.price || 0),
    ]);
    const ws = window.XLSX.utils.aoa_to_sheet([headerRow, ...rows]);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, "PurchaseOrder");
    window.XLSX.writeFile(wb, `suggested-purchase-order-${todayStr()}.xlsx`);
  }

  const totalEstimated = suggestions.reduce((s, x) => s + x.suggestedQty * (x.price || 0), 0);

  return (
    <div>
      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 4 }}>
          <div style={{ ...cardTitle, marginBottom: 0, border: "none", padding: 0 }}>🛍️ {t("قائمة شراء مقترحة تلقائيًا", "Auto-Suggested Purchase List")}</div>
          {suggestions.length > 0 && <button onClick={exportOrder} style={smallBtn}>⬇️ {t("تصدير كأمر شراء", "Export as purchase order")}</button>}
        </div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("بناءً على معدل استهلاك كل صنف فعليًا خلال الفترة، والكمية المقترحة بتغطي 30 يوم قادمة.", "Based on each item's actual consumption rate over the period; suggested quantity covers the next 30 days.")}</div>
        <div style={{ marginBottom: 14 }}>
          <label style={smallLabel}>{t("نافذة تحليل الاستهلاك (أيام)", "Consumption analysis window (days)")}</label>
          <select value={daysWindow} onChange={(e) => setDaysWindow(Number(e.target.value))} style={{ ...inputStyle2, maxWidth: 160 }}>
            <option value={7}>7</option><option value={14}>14</option><option value={30}>30</option><option value={60}>60</option>
          </select>
        </div>
        {suggestions.length > 0 && (
          <div style={{ background: "linear-gradient(135deg,#0f2557,#1d4ed8)", borderRadius: 10, padding: "12px 16px", marginBottom: 14, display: "inline-block" }}>
            <div style={{ fontSize: 12, color: "#dbe6ff" }}>{t("القيمة التقديرية الإجمالية للطلب", "Total estimated order value")}</div>
            <div style={{ fontSize: 20, fontWeight: 800, color: "#fff" }}>{fmt(totalEstimated)} {t("ر.س", "SAR")}</div>
          </div>
        )}
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("الرصيد الحالي", "Current qty")}</th><th style={th}>{t("معدل الاستهلاك اليومي", "Daily rate")}</th><th style={th}>{t("أيام متبقية تقريبًا", "Days left (approx)")}</th><th style={th}>{t("الكمية المقترحة", "Suggested qty")}</th><th style={th}>{t("آخر مورد", "Last supplier")}</th></tr></thead>
            <tbody>
              {suggestions.map((s) => (
                <tr key={s.id} style={{ background: s.daysLeft <= 3 ? "#fef2f2" : undefined }}>
                  <td style={{ ...td, fontWeight: 700 }}>{lang === "ar" ? (s.nameAr || s.nameEn) : (s.nameEn || s.nameAr)}</td>
                  <td style={td}>{fmt(s.qty)} {s.unit}</td>
                  <td style={td}>{s.dailyRate > 0 ? fmt(s.dailyRate) : "—"}</td>
                  <td style={{ ...td, fontWeight: 700, color: s.daysLeft <= 3 ? C.danger : s.daysLeft <= 14 ? C.warn : C.muted }}>{s.daysLeft === Infinity ? "—" : Math.round(s.daysLeft)}</td>
                  <td style={{ ...td, fontWeight: 700, color: C.navy }}>{fmt(s.suggestedQty)} {s.unit}</td>
                  <td style={td}>{s.lastSupplier || "—"}</td>
                </tr>
              ))}
              {suggestions.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد أصناف محتاجة إعادة طلب حاليًا 🎉", "No items currently need reordering 🎉")}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============ كشف حساب المورد: كل فواتيره ومدفوعاته في حساب واحد متصل، بيوضح المديونية الحالية له ============ */
function SupplierStatementTab({ lang, t, institutionName }) {
  const [suppliers, setSuppliers] = useState([]);
  const [moves, setMoves] = useState([]);
  const [selectedSupplier, setSelectedSupplier] = useState("");

  useEffect(() => {
    const unsub = SUPPLIERS_COL.orderBy("name").onSnapshot((snap) => setSuppliers(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => {
    const unsub = MOVES_COL.where("type", "==", "in").orderBy("createdAt", "desc").limit(2000).onSnapshot(
      (snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      () => { MOVES_COL.orderBy("createdAt", "desc").limit(3000).onSnapshot((snap) => setMoves(snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((m) => m.type === "in"))); }
    );
    return unsub;
  }, []);

  useEffect(() => { if (!selectedSupplier && suppliers.length) setSelectedSupplier(suppliers[0].name); }, [suppliers]);

  const supplierMoves = moves.filter((m) => m.supplierName === selectedSupplier).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const totalPurchases = supplierMoves.reduce((s, m) => s + (Number(m.purchaseValue) || 0) + (Number(m.vatAmount) || 0), 0);
  const totalPaid = supplierMoves.reduce((s, m) => s + (Number(m.paidAmount) || 0), 0);
  const balance = totalPurchases - totalPaid; // موجب = مديونية عليك للمورد

  function doPrint() { window.print(); }

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={cardTitle}>🏢 {t("كشف حساب مورد", "Supplier Account Statement")}</div>
        <label style={smallLabel}>{t("اختر المورد", "Choose supplier")}</label>
        <select value={selectedSupplier} onChange={(e) => setSelectedSupplier(e.target.value)} style={{ ...inputStyle2, maxWidth: 300 }}>
          {suppliers.map((s) => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>
        {suppliers.length === 0 && <div style={{ marginTop: 10, color: "#9ca3af", fontSize: 13 }}>{t("لا يوجد موردين مسجّلين بعد", "No suppliers registered yet")}</div>}
      </div>

      {selectedSupplier && (
        <div className="print-area">
          <div className="print-only-header"><h2>{institutionName}</h2><div>{t("كشف حساب مورد", "Supplier Statement")} — {selectedSupplier}</div></div>

          <div style={cardStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }} className="no-print">
              <div style={cardTitle}>{selectedSupplier}</div>
              <button onClick={doPrint} style={ghostBtn}>🖨️ {t("طباعة الكشف", "Print statement")}</button>
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("إجمالي المشتريات (شامل الضريبة)", "Total purchases (incl. VAT)")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.navy }}>{fmt(totalPurchases)}</div>
              </div>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>{t("إجمالي المدفوع له", "Total paid")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.success }}>{fmt(totalPaid)}</div>
              </div>
              <div style={{
                flex: "1 1 200px", borderRadius: 10, padding: "12px 14px",
                background: balance > 0.009 ? "linear-gradient(135deg,#7c2d12,#c2410c)" : "linear-gradient(135deg,#0f2557,#1d4ed8)",
              }}>
                <div style={{ fontSize: 12, color: "#fde8e8" }}>{balance > 0.009 ? t("مديونية عليك للمورد", "Amount you owe supplier") : t("رصيد متسوّى", "Settled balance")}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: "#fff" }}>{fmt(Math.abs(balance))}</div>
              </div>
            </div>
          </div>

          <div style={cardStyle}>
            <div style={cardTitle}>📋 {t("كل فواتير هذا المورد بالترتيب الزمني", "All invoices with this supplier, chronologically")}</div>
            <table>
              <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("رقم الفاتورة", "Invoice #")}</th><th style={th}>{t("الصنف", "Item")}</th><th style={th}>{t("القيمة شامل الضريبة", "Value incl. VAT")}</th><th style={th}>{t("المدفوع", "Paid")}</th><th style={th}>{t("الحالة", "Status")}</th></tr></thead>
              <tbody>
                {supplierMoves.map((m) => (
                  <tr key={m.id}>
                    <td style={td}>{m.date}</td><td style={td}>{m.invoiceNo || "—"}</td><td style={td}>{m.itemName}</td>
                    <td style={{ ...td, fontWeight: 700 }}>{fmt((Number(m.purchaseValue) || 0) + (Number(m.vatAmount) || 0))}</td>
                    <td style={td}>{fmt(m.paidAmount)}</td>
                    <td style={{ ...td, color: m.paymentStatus === "paid" ? C.success : C.danger, fontWeight: 700 }}>{m.paymentStatus === "paid" ? t("مدفوعة", "Paid") : t("غير مدفوعة", "Unpaid")}</td>
                  </tr>
                ))}
                {supplierMoves.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد فواتير لهذا المورد", "No invoices for this supplier")}</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ المعدات والصيانة: تسجيل معدات المستودع/الفروع بصورها وضمانها، ومتابعة سجل صيانة كل معدة ============ */
/* ============ طلب شراء منتج جديد من مورد خارجي (اسم + صورة اختيارية) — قبل ما يكون الصنف مسجّل رسميًا في النظام ============ */
function ExternalPurchaseRequestTab({ currentUser, meta, lang, t, isWhAdmin }) {
  const [productName, setProductName] = useState("");
  const [photo, setPhoto] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [note, setNote] = useState("");
  const [institution, setInstitution] = useState("");
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const [requests, setRequests] = useState([]);
  const [filterStatus, setFilterStatus] = useState("pending");
  const fileInputRef = useRef(null);

  const entities = getAllEntityNames(meta.branchTree);

  useEffect(() => {
    const unsub = PURCHASE_REQUESTS_COL.orderBy("createdAt", "desc").limit(100).onSnapshot(
      (snap) => setRequests(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      () => {}
    );
    return unsub;
  }, []);

  async function onPhotoSelect(file) {
    if (!file) return;
    setUploading(true);
    try {
      let dataUrl = await compressImage(file, 900, 0.55);
      if (dataUrl.length > 600000) dataUrl = await compressImage(file, 650, 0.4);
      setPhoto(dataUrl);
    } catch (e) { setMsg(t("تعذر تجهيز الصورة: ", "Could not process photo: ") + e.message); }
    setUploading(false);
  }

  async function submit() {
    if (!productName.trim()) { setMsg(t("اكتب اسم المنتج المطلوب شراؤه", "Enter the product name to purchase")); return; }
    setSaving(true); setMsg("");
    try {
      await PURCHASE_REQUESTS_COL.add({
        productName: productName.trim(), photoUrl: photo || null, note: note.trim(), institution,
        status: "pending", requestedBy: currentUser.name, institutionId: DEFAULT_INSTITUTION_ID,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setProductName(""); setPhoto(null); setNote(""); setInstitution("");
      setMsg("✅ " + t("تم إرسال طلب الشراء لمراجعة المستودع", "Purchase request sent for warehouse review"));
    } catch (e) { setMsg("Error: " + e.message); }
    setSaving(false);
  }

  async function updateStatus(r, status) {
    await PURCHASE_REQUESTS_COL.doc(r.id).update({ status, reviewedBy: currentUser.name, reviewedAt: firebase.firestore.FieldValue.serverTimestamp() });
  }

  const filtered = requests.filter((r) => filterStatus === "all" || r.status === filterStatus);
  const STATUS_LABEL = { pending: t("قيد المراجعة", "Pending"), approved: t("تمت الموافقة", "Approved"), purchased: t("تم الشراء", "Purchased"), rejected: t("مرفوض", "Rejected") };
  const STATUS_COLOR = { pending: C.warn, approved: C.success, purchased: C.navy, rejected: C.danger };

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>🛒 {t("طلب شراء منتج جديد (خارجي)", "New External Purchase Request")}</div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>{t("للمنتجات اللي لسه مش مسجّلة كصنف رسمي في المستودع — اكتب اسمها وارفق صورة توضيحية لو حابب.", "For products not yet registered as an official item — write the name and attach a reference photo if you like.")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 220px" }}>
            <label style={smallLabel}>{t("اسم المنتج المطلوب", "Requested product name")}</label>
            <input value={productName} onChange={(e) => setProductName(e.target.value)} style={inputStyle2} placeholder={t("مثال: آلة تحضير كابتشينو", "e.g. Cappuccino maker")} />
          </div>
          {entities.length > 0 && (
            <div style={{ flex: "1 1 160px" }}>
              <label style={smallLabel}>🏢 {t("لصالح كيان", "For entity")}</label>
              <select value={institution} onChange={(e) => setInstitution(e.target.value)} style={inputStyle2}>
                <option value="">{t("غير محدّد", "Unspecified")}</option>
                {entities.map((e) => <option key={e} value={e}>{e}</option>)}
              </select>
            </div>
          )}
          <div style={{ flex: "1 1 220px" }}>
            <label style={smallLabel}>{t("ملاحظة (اختياري)", "Note (optional)")}</label>
            <input value={note} onChange={(e) => setNote(e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>📷 {t("صورة المنتج (اختياري)", "Product photo (optional)")}</label>
            <input type="file" accept="image/*" ref={fileInputRef} style={{ display: "none" }} onChange={(e) => onPhotoSelect(e.target.files[0])} />
            <button type="button" onClick={() => fileInputRef.current?.click()} disabled={uploading} style={ghostBtn}>
              {uploading ? t("جارِ التجهيز...", "Processing...") : (photo ? t("✅ صورة مرفقة — تغيير", "✅ Photo attached — change") : t("رفع صورة", "Upload photo"))}
            </button>
          </div>
        </div>
        {photo && <img src={photo} alt="" style={{ width: 90, height: 90, objectFit: "cover", borderRadius: 8, marginTop: 10, border: "1px solid " + C.border }} />}
        <button onClick={submit} disabled={saving} style={{ ...smallBtn, width: "100%", marginTop: 14, padding: "13px 0", fontSize: 15 }}>
          {saving ? t("جارِ الإرسال...", "Sending...") : "📤 " + t("إرسال طلب الشراء", "Send purchase request")}
        </button>
        {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
      </div>

      <div style={cardStyle}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
          <div style={{ ...cardTitle, marginBottom: 0, border: "none", padding: 0 }}>🕒 {t("طلبات الشراء", "Purchase requests")}</div>
          <div style={{ display: "flex", gap: 8 }}>
            {["pending", "approved", "purchased", "rejected", "all"].map((s) => (
              <button key={s} onClick={() => setFilterStatus(s)} style={filterStatus === s ? smallBtn : ghostBtn}>{s === "all" ? t("الكل", "All") : STATUS_LABEL[s]}</button>
            ))}
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {filtered.map((r) => (
            <div key={r.id} style={{ display: "flex", gap: 12, alignItems: "flex-start", border: "1px solid " + C.border, borderRadius: 10, padding: 12 }}>
              {r.photoUrl ? (
                <img src={r.photoUrl} alt="" style={{ width: 56, height: 56, objectFit: "cover", borderRadius: 8 }} />
              ) : (
                <div style={{ width: 56, height: 56, borderRadius: 8, background: "#f3f4f6", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22 }}>🛒</div>
              )}
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, color: C.navy }}>{r.productName} {r.institution && <span style={{ fontSize: 11, color: C.blue }}>({r.institution})</span>}</div>
                <div style={{ fontSize: 12, color: C.muted }}>{t("طلبه:", "Requested by:")} {r.requestedBy} {r.note && "— " + r.note}</div>
              </div>
              <div style={{ textAlign: "left" }}>
                <div style={{ fontWeight: 700, color: STATUS_COLOR[r.status], fontSize: 12.5, marginBottom: 6 }}>{STATUS_LABEL[r.status]}</div>
                {isWhAdmin && r.status === "pending" && (
                  <div style={{ display: "flex", gap: 6 }}>
                    <span onClick={() => updateStatus(r, "approved")} style={{ cursor: "pointer", color: C.success, fontWeight: 700, fontSize: 12 }}>{t("موافقة", "Approve")}</span>
                    <span onClick={() => updateStatus(r, "rejected")} style={{ cursor: "pointer", color: C.danger, fontWeight: 700, fontSize: 12 }}>{t("رفض", "Reject")}</span>
                  </div>
                )}
                {isWhAdmin && r.status === "approved" && (
                  <span onClick={() => updateStatus(r, "purchased")} style={{ cursor: "pointer", color: C.navy, fontWeight: 700, fontSize: 12 }}>{t("تعليم كمشترى", "Mark as purchased")}</span>
                )}
              </div>
            </div>
          ))}
          {filtered.length === 0 && <div style={{ color: "#9ca3af", fontSize: 13, textAlign: "center" }}>{t("لا يوجد طلبات", "No requests")}</div>}
        </div>
      </div>
    </div>
  );
}

function EquipmentTab({ currentUser, meta, lang, t }) {
  const [equipment, setEquipment] = useState(null);
  const [form, setForm] = useState(emptyEquip());
  const [editingId, setEditingId] = useState(null);
  const [photo, setPhoto] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [msg, setMsg] = useState("");
  const [openId, setOpenId] = useState(null); // معدة مفتوحة لعرض سجل صيانتها
  const [maintenance, setMaintenance] = useState({}); // { equipmentId: [...] }
  const [maintForm, setMaintForm] = useState({ date: todayStr(), description: "", cost: "", performedBy: "" });
  const fileInputRef = useRef(null);

  function emptyEquip() { return { name: "", branch: "", supplier: "", purchaseDate: todayStr(), cost: "", warrantyExpiry: "" }; }

  useEffect(() => {
    const unsub = EQUIPMENT_COL.orderBy("name").onSnapshot((snap) => setEquipment(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);

  function set(key, val) { setForm((f) => ({ ...f, [key]: val })); }

  async function onPhotoSelect(file) {
    if (!file) return;
    setUploading(true);
    try {
      let dataUrl = await compressImage(file, 900, 0.55);
      if (dataUrl.length > 600000) dataUrl = await compressImage(file, 650, 0.4);
      setPhoto(dataUrl);
    } catch (e) { setMsg(t("تعذر تجهيز الصورة: ", "Could not process photo: ") + e.message); }
    setUploading(false);
  }

  async function save() {
    if (!form.name.trim()) { setMsg(t("اكتب اسم المعدة", "Enter equipment name")); return; }
    try {
      const payload = {
        name: form.name.trim(), branch: form.branch, supplier: form.supplier.trim(),
        purchaseDate: form.purchaseDate, cost: Number(form.cost) || 0, warrantyExpiry: form.warrantyExpiry,
        photoUrl: photo || (editingId ? undefined : null),
      };
      // ما نمسحش الصورة الحالية لو مافيش صورة جديدة وقت التعديل
      if (payload.photoUrl === undefined) delete payload.photoUrl;
      if (editingId) {
        await EQUIPMENT_COL.doc(editingId).update(payload);
        setMsg("✅ " + t("تم تحديث المعدة", "Equipment updated"));
      } else {
        await EQUIPMENT_COL.add({ ...payload, photoUrl: photo || null, institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        setMsg("✅ " + t("تمت إضافة المعدة", "Equipment added"));
      }
      setForm(emptyEquip()); setPhoto(null); setEditingId(null);
    } catch (e) { setMsg("Error: " + e.message); }
  }

  function editEquip(eq) {
    setForm({ name: eq.name, branch: eq.branch || "", supplier: eq.supplier || "", purchaseDate: eq.purchaseDate || todayStr(), cost: eq.cost || "", warrantyExpiry: eq.warrantyExpiry || "" });
    setPhoto(null); setEditingId(eq.id);
  }
  async function removeEquip(eq) {
    if (!confirm(t(`حذف معدة "${eq.name}"؟`, `Delete equipment "${eq.name}"?`))) return;
    await EQUIPMENT_COL.doc(eq.id).delete();
  }

  async function loadMaintenance(equipId) {
    setOpenId(openId === equipId ? null : equipId);
    if (maintenance[equipId]) return;
    const snap = await MAINTENANCE_COL.where("equipmentId", "==", equipId).get().catch(() => null);
    if (snap) setMaintenance((m) => ({ ...m, [equipId]: snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || "").localeCompare(a.date || "")) }));
  }

  async function addMaintenance(equipId) {
    if (!maintForm.description.trim()) { setMsg(t("اكتب وصف أعمال الصيانة", "Describe the maintenance work")); return; }
    await MAINTENANCE_COL.add({
      equipmentId: equipId, date: maintForm.date, description: maintForm.description.trim(),
      cost: Number(maintForm.cost) || 0, performedBy: maintForm.performedBy.trim() || currentUser.name,
      institutionId: DEFAULT_INSTITUTION_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    const snap = await MAINTENANCE_COL.where("equipmentId", "==", equipId).get();
    setMaintenance((m) => ({ ...m, [equipId]: snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || "").localeCompare(a.date || "")) }));
    setMaintForm({ date: todayStr(), description: "", cost: "", performedBy: "" });
  }

  function warrantyStatus(expiry) {
    if (!expiry) return null;
    const days = Math.ceil((new Date(expiry) - new Date(todayStr())) / 86400000);
    if (days < 0) return { label: t("انتهى الضمان", "Warranty expired"), color: C.danger };
    if (days <= 30) return { label: t(`الضمان هينتهي خلال ${days} يوم`, `Warranty expires in ${days} days`), color: C.warn };
    return { label: t("تحت الضمان", "Under warranty"), color: C.success };
  }

  if (equipment === null) return <div style={{ color: C.muted, padding: 20 }}>...</div>;

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>{editingId ? "✏️ " + t("تعديل معدة", "Edit equipment") : "➕ " + t("معدة جديدة", "New equipment")}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>{t("اسم المعدة", "Equipment name")}</label>
            <input value={form.name} onChange={(e) => set("name", e.target.value)} style={inputStyle2} placeholder={t("مثال: ماكينة إسبريسو", "e.g. Espresso machine")} />
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>{t("الموقع/الفرع", "Location/Branch")}</label>
            <select value={form.branch} onChange={(e) => set("branch", e.target.value)} style={inputStyle2}>
              <option value="">{t("المستودع الرئيسي", "Main warehouse")}</option>
              <GroupedBranchOptions meta={meta} />
            </select>
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>{t("المورد", "Supplier")}</label>
            <input value={form.supplier} onChange={(e) => set("supplier", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 140px" }}>
            <label style={smallLabel}>{t("تاريخ الشراء", "Purchase date")}</label>
            <input type="date" value={form.purchaseDate} onChange={(e) => set("purchaseDate", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 120px" }}>
            <label style={smallLabel}>{t("التكلفة", "Cost")}</label>
            <input type="number" step="0.01" value={form.cost} onChange={(e) => set("cost", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 160px" }}>
            <label style={smallLabel}>🛡️ {t("تاريخ انتهاء الضمان", "Warranty expiry")}</label>
            <input type="date" value={form.warrantyExpiry} onChange={(e) => set("warrantyExpiry", e.target.value)} style={inputStyle2} />
          </div>
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>📷 {t("صورة المعدة", "Equipment photo")}</label>
            <input type="file" accept="image/*" ref={fileInputRef} style={{ display: "none" }} onChange={(e) => onPhotoSelect(e.target.files[0])} />
            <button type="button" onClick={() => fileInputRef.current?.click()} disabled={uploading} style={ghostBtn}>
              {uploading ? t("جارِ التجهيز...", "Processing...") : (photo ? t("✅ صورة مرفقة — تغيير", "✅ Photo attached — change") : t("رفع صورة", "Upload photo"))}
            </button>
          </div>
        </div>
        {photo && <img src={photo} alt="" style={{ width: 90, height: 90, objectFit: "cover", borderRadius: 8, marginTop: 10, border: "1px solid " + C.border }} />}
        <div style={{ marginTop: 14, display: "flex", gap: 10, alignItems: "center" }}>
          <button onClick={save} style={smallBtn}>{editingId ? t("💾 حفظ التعديل", "💾 Save changes") : t("➕ إضافة المعدة", "➕ Add equipment")}</button>
          {editingId && <button onClick={() => { setForm(emptyEquip()); setPhoto(null); setEditingId(null); }} style={ghostBtn}>{t("إلغاء", "Cancel")}</button>}
          {msg && <span style={{ fontSize: 13, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</span>}
        </div>
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>🔧 {t("كل المعدات", "All Equipment")} ({equipment.length})</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {equipment.map((eq) => {
            const wStatus = warrantyStatus(eq.warrantyExpiry);
            return (
              <div key={eq.id} style={{ border: "1px solid " + C.border, borderRadius: 10, padding: 14 }}>
                <div style={{ display: "flex", gap: 14, alignItems: "flex-start", flexWrap: "wrap" }}>
                  {eq.photoUrl ? (
                    <img src={eq.photoUrl} alt="" style={{ width: 70, height: 70, objectFit: "cover", borderRadius: 8, border: "1px solid " + C.border }} />
                  ) : (
                    <div style={{ width: 70, height: 70, borderRadius: 8, background: "#f3f4f6", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24 }}>🔧</div>
                  )}
                  <div style={{ flex: 1, minWidth: 200 }}>
                    <div style={{ fontWeight: 800, fontSize: 15, color: C.navy }}>{eq.name}</div>
                    <div style={{ fontSize: 12, color: C.muted }}>{eq.branch || t("المستودع الرئيسي", "Main warehouse")} — {eq.supplier || "—"}</div>
                    <div style={{ fontSize: 12, color: C.muted }}>{t("تكلفة الشراء:", "Purchase cost:")} {fmt(eq.cost)} {t("ر.س", "SAR")} — {eq.purchaseDate}</div>
                    {wStatus && <div style={{ fontSize: 12.5, fontWeight: 700, color: wStatus.color, marginTop: 4 }}>🛡️ {wStatus.label} ({eq.warrantyExpiry})</div>}
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" }}>
                    <span onClick={() => editEquip(eq)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700, fontSize: 13 }}>{t("تعديل", "Edit")}</span>
                    <span onClick={() => removeEquip(eq)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700, fontSize: 13 }}>{t("حذف", "Delete")}</span>
                    <span onClick={() => loadMaintenance(eq.id)} style={{ cursor: "pointer", color: C.navy, fontWeight: 700, fontSize: 13 }}>🔧 {openId === eq.id ? t("إخفاء الصيانة", "Hide maintenance") : t("سجل الصيانة", "Maintenance log")}</span>
                  </div>
                </div>

                {openId === eq.id && (
                  <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px dashed " + C.border }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: C.navy, marginBottom: 10 }}>➕ {t("تسجيل صيانة جديدة", "Log new maintenance")}</div>
                    <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
                      <div><label style={smallLabel}>{t("التاريخ", "Date")}</label><input type="date" value={maintForm.date} onChange={(e) => setMaintForm((f) => ({ ...f, date: e.target.value }))} style={inputStyle2} /></div>
                      <div style={{ flex: "1 1 200px" }}><label style={smallLabel}>{t("وصف الصيانة", "Maintenance description")}</label><input value={maintForm.description} onChange={(e) => setMaintForm((f) => ({ ...f, description: e.target.value }))} style={inputStyle2} /></div>
                      <div><label style={smallLabel}>{t("التكلفة", "Cost")}</label><input type="number" step="0.01" value={maintForm.cost} onChange={(e) => setMaintForm((f) => ({ ...f, cost: e.target.value }))} style={{ ...inputStyle2, width: 110 }} /></div>
                      <div><label style={smallLabel}>{t("بواسطة", "By")}</label><input value={maintForm.performedBy} onChange={(e) => setMaintForm((f) => ({ ...f, performedBy: e.target.value }))} placeholder={currentUser.name} style={inputStyle2} /></div>
                      <button onClick={() => addMaintenance(eq.id)} style={ghostBtn}>➕ {t("تسجيل", "Log")}</button>
                    </div>
                    <table style={{ marginTop: 12 }}>
                      <thead><tr><th style={th}>{t("التاريخ", "Date")}</th><th style={th}>{t("الوصف", "Description")}</th><th style={th}>{t("التكلفة", "Cost")}</th><th style={th}>{t("بواسطة", "By")}</th></tr></thead>
                      <tbody>
                        {(maintenance[eq.id] || []).map((mrec) => (
                          <tr key={mrec.id}><td style={td}>{mrec.date}</td><td style={td}>{mrec.description}</td><td style={td}>{fmt(mrec.cost)}</td><td style={td}>{mrec.performedBy}</td></tr>
                        ))}
                        {(maintenance[eq.id] || []).length === 0 && <tr><td colSpan={4} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>{t("لا يوجد سجل صيانة بعد", "No maintenance logged yet")}</td></tr>}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            );
          })}
          {equipment.length === 0 && <div style={{ color: "#9ca3af", fontSize: 13, textAlign: "center" }}>{t("لا يوجد معدات مسجّلة", "No equipment registered")}</div>}
        </div>
      </div>
    </div>
  );
}

function WarehouseBackupCard({ t }) {
  const [working, setWorking] = useState(false);
  const [msg, setMsg] = useState("");

  async function downloadBackup() {
    setWorking(true); setMsg("");
    try {
      const [itemsSnap, movesSnap, suppliersSnap, branchStockSnap, countsSnap, notifsSnap] = await Promise.all([
        ITEMS_COL.get(), MOVES_COL.get(), SUPPLIERS_COL.get(), BRANCH_STOCK_COL.get(), COUNTS_COL.get(), WH_NOTIF_COL.get(),
      ]);

      function toRows(snap) {
        return snap.docs.map((d) => {
          const data = d.data();
          const row = { id: d.id };
          Object.keys(data).forEach((k) => {
            const v = data[k];
            row[k] = (v && typeof v === "object" && v.toDate) ? v.toDate().toISOString() : (typeof v === "object" ? JSON.stringify(v) : v);
          });
          return row;
        });
      }

      const wb = window.XLSX.utils.book_new();
      const sheets = [
        { name: "Items", rows: toRows(itemsSnap) },
        { name: "Moves", rows: toRows(movesSnap) },
        { name: "Suppliers", rows: toRows(suppliersSnap) },
        { name: "BranchStock", rows: toRows(branchStockSnap) },
        { name: "Counts", rows: toRows(countsSnap) },
        { name: "Notifications", rows: toRows(notifsSnap) },
      ];
      sheets.forEach((s) => {
        const ws = s.rows.length > 0 ? window.XLSX.utils.json_to_sheet(s.rows) : window.XLSX.utils.aoa_to_sheet([["لا يوجد بيانات"]]);
        window.XLSX.utils.book_append_sheet(wb, ws, s.name);
      });
      const stamp = todayStr();
      window.XLSX.writeFile(wb, `warehouse-backup-${stamp}.xlsx`);
      setMsg("✅ " + t("تم تحميل النسخة الاحتياطية بنجاح — احتفظ بالملف في مكان آمن", "Backup downloaded successfully — keep the file somewhere safe"));
    } catch (e) {
      setMsg("Error: " + e.message);
    }
    setWorking(false);
  }

  return (
    <div style={cardStyle}>
      <div style={cardTitle}>💾 {t("نسخة احتياطية شاملة", "Full Backup")}</div>
      <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>
        {t("بضغطة واحدة، هتنزّل ملف Excel فيه كل بيانات المستودع (الأصناف، كل حركات الوارد والصادر، الموردين، مخزون الفروع، سجل الجرد، والإشعارات) — احتفظ بيه على جهازك بشكل دوري.", "One click downloads an Excel file with all warehouse data (items, all in/out moves, suppliers, branch stock, count history, and notifications) — keep it on your device periodically.")}
      </div>
      <button onClick={downloadBackup} disabled={working} style={smallBtn}>
        {working ? t("جارِ التحضير...", "Preparing...") : "⬇️ " + t("تحميل نسخة احتياطية الآن", "Download backup now")}
      </button>
      {msg && <div style={{ marginTop: 10, fontSize: 13, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
    </div>
  );
}
